    // Learning a magic school grants its tier-1 spell, or the skill is inert.
    for (const id of Spellcraft.SPELL_IDS) {
      const sp = Spellcraft.SPELLS[id];
      if (sp.school === skill && sp.tier <= 2 && Spellcraft.learnable(ch, id)) ch.spells[id] = true;
    }
    recompute(ch);
    return true;
  }

  function acceptQuest(qid) {
    if (!state.party.quests[qid]) state.party.quests[qid] = { state: 1, killed: 0 };
    else state.party.quests[qid].state = 1;
    Log.push('Quest accepted: ' + World.QUESTS[qid].name, 'sys');
    state.party.autonotes.push(World.QUESTS[qid].name);
    closeScreens();
    return true;
  }

  function startCreation() {
    state.createSpec = defaultSpec();
    state.createSlot = 0;
    state.screen = 'creation';
  }

  function bumpStat(s, d) {
    const spec = state.createSpec[state.createSlot];
    const v = spec.base[s] + d;
    if (v < Rules.STAT_MIN || v > Rules.STAT_MAX) return false;
    const trial = Object.assign({}, spec.base); trial[s] = v;
    if (Rules.creationCost(trial) > Rules.CREATE_POINTS) return false;
    spec.base[s] = v;
    return true;
  }

  // Advance one combat "round": everyone gets recovery time, which is what stops the deadlock where
  // the budget drains and nothing ever becomes ready again.
  function stepTurn() {
    const quantum = 120;
    for (const ch of state.party.members) ch.recovery = Math.max(0, ch.recovery - quantum);
    for (const e of liveEnemies()) monsterTurn(e, quantum);
    Clock.advance(quantum);
    return true;
  }

  // ---------------------------------------------------------------- loop
  function boot() {
    if (state.booted) return;
    state.booted = true;

    // UI is handed `state`, so the few queries it needs live on it. UI must never compute these
    // itself — that is how a second implementation of a rule gets born.
    state.acOf = acOf;
    state.seen = seen;
    state.safeToRest = safeToRest;
    state.questComplete = questComplete;

    state.world = World.build(7);
    state.createSpec = defaultSpec();
    // A party exists from boot so the harness can drive the sim before anyone presses New Game.
    if (!state.party) {
      try { newParty(defaultSpec()); } catch (e) { state.lastError = e.message; }
    }
    state.screen = 'title';
    // Baked art replaces the procedural painters where it exists. Failures are RECORDED, never
    // swallowed: a texture that silently fails to decode looks like an art problem three stages later.
    if (typeof window !== 'undefined' && window.__BAKED__) {
      const blob = window.__BAKED__;
      if (typeof Art !== 'undefined' && Art.installBakedTextures) {
        Art.installBakedTextures(blob)
          .then((n) => { state.bakedTextures = n; })
          .catch((e) => { state.lastError = 'texture bake: ' + e.message; });
      }
      if (typeof Sprites !== 'undefined' && blob.sprites) {
        Sprites.installBaked(blob.sprites);
        Sprites.prepareBaked()
          .then((r) => { Sprites.BAKED.__ready = r; state.bakedSprites = Object.keys(r).length; })
          .catch((e) => { state.lastError = 'sprite bake: ' + e.message; });
      }
    }
  }

  function update(dt) {
    Clock.advance(dt);
    Art.step();
    if (state.screen === 'title' || state.screen === 'creation' || !state.party) return;

    if (!state.screen) move(dt);

    expireBuffs();
    const regen = buff('regen');
    for (const ch of state.party.members) {
      ch.recovery = Math.max(0, ch.recovery - dt * (buff('haste') ? 1.5 : 1));
      if (regen && Clock.t !== state._lastRegen) Rules.healTo(ch, regen);
    }
    if (regen) state._lastRegen = Clock.t;
    // Immolation burns whatever stands next to the party.
    const imm = buff('immolation');
    if (imm && Clock.t !== state._lastImm) {
      state._lastImm = Clock.t;
      for (const e of liveEnemies()) {
        if (Math.hypot(e.x - state.party.x, e.y - state.party.y) > 3.2) continue;
        e.hp -= imm;
        if (e.hp <= 0) killEntityObj(e);
      }
    }

    const enemies = liveEnemies();
    let anyAlerted = false;
    for (const e of enemies) {
      if (Math.hypot(e.x - state.party.x, e.y - state.party.y) < 26) monsterTurn(e, dt);
      if (e.alerted) anyAlerted = true;
    }
    state.combat.active = anyAlerted && !!nearestEnemy(AGGRO);
  }

  function render() {
    const En = Engine;
    if (state.screen === 'title' || state.screen === 'creation') {
      En.clear(Core.idx(0, 1));
      UI.draw(state);
      return;
    }

    const p = state.party;
    const cam = {
      x: p.x, y: p.y, z: p.z, ang: p.ang, map: state.map,
      horizon: Math.round((p.pitch || 0) * 140),
      torch: state.map.kind === 'dungeon' ? 8.5 + buff('light') * 1.8 : 99,
    };
    En.clear(Core.idx(0, 1));
    En.render3D(cam, state.world);
    drawEntities(cam);
    UI.draw(state);
  }

  // Sprites, sorted far to near so nearer ones overwrite.
  function drawEntities(cam) {
    const m = state.map;
    const list = [];

    for (const d of m.decor) {
      if (d.kind === 'chest' && d.opened) continue;
      if (d.kind === 'questitem' && d.taken) continue;
      const dist = Math.hypot(d.x - cam.x, d.y - cam.y);
      if (dist > m.fogEnd) continue;
      list.push({ dist, spr: Sprites.decor(d.kind), x: d.x, y: d.y,
        z: m.kind === 'dungeon' ? 0 : World.H(m, d.x, d.y),
        h: Sprites.DECOR_HEIGHT[d.kind] || 2 });
    }
    for (const n of m.npcs || []) {
      const dist = Math.hypot(n.x - cam.x, n.y - cam.y);
      if (dist > m.fogEnd) continue;
      list.push({ dist, spr: Sprites.creature('npc_' + n.role), x: n.x, y: n.y,
        z: World.H(m, n.x, n.y), h: 1.8 });
    }
    for (const e of (m.live || [])) {
      if (e.dead) continue;
      const dist = Math.hypot(e.x - cam.x, e.y - cam.y);
      if (dist > m.fogEnd) continue;
      const f = Engine.facingFor(e.ang, cam.x, cam.y, e.x, e.y, 5);
      const def = Items.MONSTERS[e.kind];
      list.push({ dist, spr: Sprites.creature(e.kind, f.index), mirror: f.mirror,
        x: e.x, y: e.y, z: World.walkHeight(m, e.x, e.y, e.z),
        h: /ogre|troll|elemental|crown|knight/.test(e.kind) ? 2.9 : /rat|spider/.test(e.kind) ? 0.9 : 1.9 });
    }

    list.sort((a, b) => b.dist - a.dist);
    const lit = m.kind === 'dungeon' ? 0 : Art.sunShade(1);
    for (const s of list) {
      Engine.drawSprite(cam, s.spr, s.x, s.y, s.z, s.h,
        { lit: lit + (m.kind === 'dungeon' ? Engine.dungeonLight(cam, s.x, s.y, m) : 0), mirror: s.mirror });
    }
  }

  // ---------------------------------------------------------------- introspection
  function dumpState() {
    const p = state.party;
    if (!p) return null;
    return {
      map: p.map,
      pos: [Number(p.x.toFixed(4)), Number(p.y.toFixed(4)), Number(p.z.toFixed(4))],
      ang: Number(p.ang.toFixed(4)),
      gold: p.gold, food: p.food,
      quests: p.quests,
      members: p.members.map((c) => ({
        name: c.name, cls: c.cls, level: c.level, xp: c.xp, hp: c.hp, sp: c.sp,
        cond: c.cond, skillPts: c.skillPts,
        pack: c.pack.map((s) => s.id + 'x' + (s.qty || 1)),
        equip: Object.keys(c.equip).sort().map((k) => k + ':' + (c.equip[k] ? c.equip[k].id : '-')),
      })),
      dead: Object.keys(state.world.maps).sort().map((id) =>
        id + ':' + ((state.world.maps[id].live || []).filter((e) => e.dead).length)),
    };
  }

  function brief() {
    const p = state.party;
    return p ? { map: p.map, gold: p.gold, hp: p.members.map((c) => c.hp), screen: state.screen,
      won: !!p.flags.won, level: p.members[0].level } : { none: true };
  }

  function invariants() {
    const bad = [];
    const p = state.party;
    if (!p) return bad;
    for (const ch of p.members) {
      if (ch.hp > Rules.maxHP(ch)) bad.push(ch.name + ' hp above max');
      if (ch.hp < -10) bad.push(ch.name + ' hp below floor');
      if (ch.sp > Rules.maxSP(ch)) bad.push(ch.name + ' sp above max');
      if (ch.pack.length > 30) bad.push(ch.name + ' pack overflow');
      if (ch.cond.dead && ch.hp > 0) bad.push(ch.name + ' dead but positive hp');
    }
    if (p.gold < 0) bad.push('negative gold');
    if (!state.world.maps[p.map]) bad.push('party on unknown map');
    // Every portal must have landing coordinates. This is the v1 softlock, asserted at runtime.
    for (const id of Object.keys(state.world.maps)) {
      for (const portal of state.world.maps[id].portals) {
        if (portal.shop) continue;
        if (portal.tx === undefined || portal.ty === undefined) bad.push(id + ' portal to ' + portal.to + ' has no landing');
      }
    }
    return bad;
  }

  // Count every item everywhere. The conservation probe: how to refuse to chase a duplication ghost.
  function census() {
    const byId = Object.create(null);
    let total = 0;
    for (const ch of state.party.members) {
      for (const st of ch.pack) { byId[st.id] = (byId[st.id] || 0) + (st.qty || 1); total += st.qty || 1; }
      for (const slot of Object.keys(ch.equip)) {
        const s = ch.equip[slot];
        if (s) { byId[s.id] = (byId[s.id] || 0) + 1; total += 1; }
      }
    }
    return { total, byId, gold: state.party.gold };
  }

  function debugLines() {
    const p = state.party;
    if (!p) return ['no party'];
    return [
      'map ' + p.map + ' ' + state.map.w + 'x' + state.map.h,
      'pos ' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ' z' + p.z.toFixed(2) + ' a' + p.ang.toFixed(2),
      'enemies ' + liveEnemies().length + '  combat ' + state.combat.active,
      state.lastError ? 'ERR ' + state.lastError : '',
    ].filter(Boolean);
  }

  return {
    state, boot, update, render, onKey, onTap,
    newParty, gotoMap, teleport, walkCells, openScreen, closeScreens,
    grantItem, grantXP, healParty, save, load,
    interact, castSpell, doRest, stepTurn, acceptQuest, turnInQuest, questComplete,
    killEntity: (eid) => { const e = (state.map.live || []).find((x) => x.eid === eid); if (e) killEntityObj(e); return !!e; },
    spawnEntity: (kind, x, y) => {
      const def = Items.MONSTERS[kind];
      const e = { eid: 'spawn' + Math.round(Clock.t) + '_' + (state.map.live || []).length, kind, x, y,
        z: World.walkHeight(state.map, x, y), ang: 0, hp: def.hp, hpMax: def.hp, recovery: 0, dead: false, alerted: true };
      (state.map.live || (state.map.live = [])).push(e);
      return e;
    },
    acOf, seen, safeToRest, countItem, dumpState, brief, invariants, census, debugLines,
    partyAttack, reachOf, nearestEnemy, liveEnemies,
    buy, doTrain, doSkillUp, equipFromPack, unequip, dropFromPack, usePortal, giveStack,
    buff, setBuff, SPECIALS, isUndead,
    get party() { return state.party; },
    get map() { return state.map; },
    get screen() { return state.screen; },
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Game;


/* ==================== 10_debug.js ==================== */
// 10_debug.js — boot, main loop, input, the ?debug overlay, and the test harness.
// Owner: debug. Loads last, so it may reference everything.
//
// The harness is built FIRST, before there is anything to drive, because every later stage is
// driven through it: the shot list, the E2E suite, the campaign test and the determinism diff all
// speak to __game / __session and nothing else. See ARCHITECTURE.md §10 for the contract.

const Debug = (() => {
  'use strict';

  const { Clock, RNG, Bus, Log } = Core;

  const STEP_MS = 16;          // fixed simulation timestep; the harness never uses wall-clock time
  const MAX_CATCHUP = 5;       // frames of catch-up per rAF, so a stall cannot spiral

  const state = {
    booted: false,
    ctx: null,
    canvas: null,
    acc: 0,
    last: 0,
    frames: 0,
    fps: 0,
    fpsAcc: 0,
    fpsN: 0,
    overlay: false,
    keys: Object.create(null),
    pointer: { x: 0, y: 0, down: false },
    lastError: null,
  };

  // Is the game layer present yet? Modules land across rounds; the harness must be honest about
  // what it can and cannot drive rather than failing obscurely.
  const hasGame = () => typeof Game !== 'undefined' && Game && typeof Game.update === 'function';

  function need(what) {
    throw new Error('harness: ' + what + ' requires the game layer, which is not built yet ' +
      '(src/09_game.js). This is a real gap, not a transient failure.');
  }

  // ---------------------------------------------------------------- loop
  function simulate(dtMs) {
    if (hasGame()) Game.update(dtMs);
    else Clock.advance(dtMs);
    state.frames++;
  }

  function draw() {
    if (hasGame()) Game.render();
    else Engine.testCard();
    if (state.overlay) drawOverlay();
    if (state.ctx) Engine.present(state.ctx);
  }

  function frame(now) {
    if (!state.last) state.last = now;
    let dt = now - state.last;
    state.last = now;
    if (dt > 250) dt = 250;                       // tab was backgrounded; do not fast-forward
    state.acc += dt;

    let n = 0;
    while (state.acc >= STEP_MS && n < MAX_CATCHUP) {
      simulate(STEP_MS);
      state.acc -= STEP_MS;
      n++;
    }
    if (n === MAX_CATCHUP) state.acc = 0;

    state.fpsAcc += dt; state.fpsN++;
    if (state.fpsAcc >= 500) {
      state.fps = Math.round(1000 / (state.fpsAcc / state.fpsN));
      state.fpsAcc = 0; state.fpsN = 0;
    }

    draw();
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- overlay
  function drawOverlay() {
    const lines = [
      'fps ' + state.fps + '  frame ' + state.frames,
      'clock ' + Clock.hhmm() + ' d' + Clock.day + ' ' + Clock.phase(),
      'seed ' + RNG.seed,
    ];
    if (hasGame() && Game.debugLines) lines.push.apply(lines, Game.debugLines());
    if (state.lastError) lines.push('ERR ' + state.lastError);

    // Drawn with raster primitives rather than a font until Art owns one.
    Engine.clipReset();
    Engine.rect(2, 2, 210, 6 + lines.length * 8, Core.idx(0, 1));
    Engine.frameRect(2, 2, 210, 6 + lines.length * 8, Core.idx(13, 9));
    if (typeof Art !== 'undefined' && Art.text) {
      for (let i = 0; i < lines.length; i++) Art.text(Engine, 6, 6 + i * 8, lines[i], Core.idx(0, 14));
    }
  }

  // ---------------------------------------------------------------- input
  const KEYMAP = {
    ArrowUp: 'fwd', ArrowDown: 'back', ArrowLeft: 'turnL', ArrowRight: 'turnR',
    w: 'fwd', s: 'back', a: 'strafeL', d: 'strafeR', q: 'turnL', e: 'turnR',
    Enter: 'act', ' ': 'act', Escape: 'esc', Tab: 'next',
    c: 'sheet', i: 'inv', m: 'map', r: 'rest', b: 'book', x: 'quick',
  };

  function bindInput(canvas) {
    window.addEventListener('keydown', (e) => {
      if (e.key === '`') { state.overlay = !state.overlay; e.preventDefault(); return; }
      const k = KEYMAP[e.key] || e.key;
      state.keys[k] = true;
      if (hasGame() && Game.onKey) Game.onKey(k, true);
      if (KEYMAP[e.key]) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const k = KEYMAP[e.key] || e.key;
      state.keys[k] = false;
      if (hasGame() && Game.onKey) Game.onKey(k, false);
    });

    // Pointer/touch mapped from CSS pixels into framebuffer coordinates.
    const toFb = (clientX, clientY) => {
      const r = canvas.getBoundingClientRect();
      return {
        x: Math.floor((clientX - r.left) / r.width * Engine.W),
        y: Math.floor((clientY - r.top) / r.height * Engine.H),
      };
    };
    const down = (x, y) => {
      const p = toFb(x, y);
      state.pointer.x = p.x; state.pointer.y = p.y; state.pointer.down = true;
      if (hasGame() && Game.onTap) Game.onTap(p.x, p.y, true);
    };
    const up = (x, y) => {
      const p = toFb(x, y);
      state.pointer.down = false;
      if (hasGame() && Game.onTap) Game.onTap(p.x, p.y, false);
    };
    canvas.addEventListener('pointerdown', (e) => { down(e.clientX, e.clientY); e.preventDefault(); });
    canvas.addEventListener('pointerup', (e) => { up(e.clientX, e.clientY); e.preventDefault(); });
    canvas.addEventListener('pointermove', (e) => {
      const p = toFb(e.clientX, e.clientY);
      state.pointer.x = p.x; state.pointer.y = p.y;
      if (hasGame() && Game.onMove) Game.onMove(p.x, p.y);
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // ---------------------------------------------------------------- layout
  function fit(canvas) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / Engine.W, vh / Engine.H);
    canvas.style.width = Math.floor(Engine.W * scale) + 'px';
    canvas.style.height = Math.floor(Engine.H * scale) + 'px';
  }

  // ---------------------------------------------------------------- boot
  function start() {
    if (state.booted) return;
    state.booted = true;

    const canvas = document.getElementById('fb');
    state.canvas = canvas;
    state.ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    state.ctx.imageSmoothingEnabled = false;

    fit(canvas);
    window.addEventListener('resize', () => fit(canvas));
    window.addEventListener('orientationchange', () => setTimeout(() => fit(canvas), 100));
    bindInput(canvas);

    const params = new URLSearchParams(location.search);
    if (params.has('debug')) state.overlay = true;
    if (params.has('seed')) RNG.setSeed(parseInt(params.get('seed'), 10) || 1);

    // Surface errors instead of swallowing them. A silent catch is a lie; this records and shows.
    window.addEventListener('error', (e) => {
      state.lastError = e.message;
      state.overlay = true;
    });

    if (hasGame() && Game.boot) Game.boot();
    Log.push('Thornmarch booted.', 'sys');
    requestAnimationFrame(frame);
  }

  // ================================================================ HARNESS
  // Contract in ARCHITECTURE.md §10. Everything the shot list, E2E suite, campaign test and
  // determinism diff use goes through here.
  //
  // Player-legality matters: walk/press/tap/key are actions a player could take. teleport, gotoMap,
  // give, gold, xp, heal, kill and spawn are NOT, and the campaign test is forbidden from using
  // them — it must win the game the way a person would.
  const harness = {
    // ---- travel (NOT player-legal; for reaching content quickly, never for skipping systems)
    teleport(x, y, ang) {
      if (!hasGame()) need('teleport');
      return Game.teleport(x, y, ang);
    },
    gotoMap(id, x, y, ang) {
      if (!hasGame()) need('gotoMap');
      return Game.gotoMap(id, x, y, ang);
    },
    face(ang) { if (!hasGame()) need('face'); Game.party.ang = ang; return ang; },
    pitch(p) { if (!hasGame()) need('pitch'); Game.party.pitch = p; return p; },

    // ---- player-legal movement and input
    walk(dir, cells) {
      if (!hasGame()) need('walk');
      return Game.walkCells(dir, cells === undefined ? 1 : cells);
    },
    press(key, ms) {
      if (!hasGame()) need('press');
      const steps = Math.max(1, Math.round((ms === undefined ? STEP_MS : ms) / STEP_MS));
      Game.onKey(key, true);
      for (let i = 0; i < steps; i++) simulate(STEP_MS);
      Game.onKey(key, false);
      return steps;
    },
    key(name) { if (!hasGame()) need('key'); Game.onKey(name, true); Game.onKey(name, false); },
    // Player-legal: the same call the ATK button makes.
    attack() { if (!hasGame()) need('attack'); return Game.partyAttack(); },
    attackWith(i) { if (!hasGame()) need('attackWith'); return Game.partyAttack(i); },
    enemiesNear(d) { if (!hasGame()) need('enemiesNear'); return Game.liveEnemies().filter((e) =>
      Math.hypot(e.x - Game.party.x, e.y - Game.party.y) < (d === undefined ? 12 : d)).length; },
    tap(x, y) {
      if (!hasGame()) need('tap');
      Game.onTap(x, y, true); Game.onTap(x, y, false);
    },

    // ---- grants (NOT player-legal)
    give(itemId, n) { if (!hasGame()) need('give'); return Game.grantItem(itemId, n === undefined ? 1 : n); },
    gold(n) { if (!hasGame()) need('gold'); Game.party.gold += n | 0; return Game.party.gold; },
    xp(n) { if (!hasGame()) need('xp'); return Game.grantXP(n | 0); },
    heal() { if (!hasGame()) need('heal'); return Game.healParty(); },
    kill(eid) { if (!hasGame()) need('kill'); return Game.killEntity(eid); },
    spawn(kind, x, y) { if (!hasGame()) need('spawn'); return Game.spawnEntity(kind, x, y); },

    // ---- clock (works without the game layer: Core owns it)
    setTime(minutesSinceMidnight) { return Clock.setTod(minutesSinceMidnight); },
    setDay(n) { Clock.t = (n | 0) * Core.MIN_PER_DAY + Clock.tod; return Clock.t; },

    // ---- persistence
    save(slot) { if (!hasGame()) need('save'); return Game.save(slot === undefined ? 0 : slot); },
    load(slot) { if (!hasGame()) need('load'); return Game.load(slot === undefined ? 0 : slot); },
    newParty(spec) { if (!hasGame()) need('newParty'); return Game.newParty(spec); },

    // ---- screens
    screen(name) { if (!hasGame()) need('screen'); return Game.openScreen(name); },
    closeAll() { if (!hasGame()) need('closeAll'); return Game.closeScreens(); },

    // ---- determinism control
    seed(n) { RNG.setSeed(n); return RNG.seed; },

    // Advance the simulation by exactly `ms` of game time at the fixed timestep. Never touches
    // wall-clock, so a headless run reproduces exactly.
    step(ms) {
      const steps = Math.max(1, Math.round(ms / STEP_MS));
      for (let i = 0; i < steps; i++) simulate(STEP_MS);
      return steps;
    },
    // Render `n` frames without advancing simulation further than one step each — used before a
    // capture so transient state (fades, bobs) has settled.
    settle(n) {
      const k = n === undefined ? 2 : n;
      for (let i = 0; i < k; i++) { simulate(STEP_MS); draw(); }
      return k;
    },
    // Force a redraw only. A capture calls this so the framebuffer matches the asserted state.
    redraw() { draw(); return true; },

    // Introspection for tests that need to know what exists yet.
    ready() { return hasGame(); },
    layers() {
      return {
        core: typeof Core !== 'undefined',
        rules: typeof Rules !== 'undefined',
        spells: typeof Spellcraft !== 'undefined',
        items: typeof Items !== 'undefined',
        world: typeof World !== 'undefined',
        engine: typeof Engine !== 'undefined',
        art: typeof Art !== 'undefined',
        ui: typeof UI !== 'undefined',
        game: hasGame(),
      };
    },
  };

  // ---------------------------------------------------------------- session dump
  // Stable-ordered, side-effect-free JSON. The determinism diff reads this; an unstable dump or
  // one that advances an RNG stream makes the diff meaningless.
  function sortedClone(v) {
    if (v === null || typeof v !== 'object') {
      // Normalise float noise so a dump is byte-comparable across runs.
      return typeof v === 'number' && !Number.isInteger(v) ? Number(v.toFixed(6)) : v;
    }
    if (Array.isArray(v)) return v.map(sortedClone);
    if (ArrayBuffer.isView(v)) return Array.from(v);
    if (v instanceof Map) {
      const o = {};
      for (const k of Array.from(v.keys()).sort()) o[k] = sortedClone(v.get(k));
      return o;
    }
    const out = {};
    for (const k of Object.keys(v).sort()) {
      if (k.startsWith('_')) continue;             // internal caches are not state
      out[k] = sortedClone(v[k]);
    }
    return out;
  }

  const session = {
    dump() {
      const d = {
        clock: Clock.dump(),
        rng: RNG.dump(),
        frames: state.frames,
      };
      if (hasGame() && Game.dumpState) d.game = Game.dumpState();
      return sortedClone(d);
    },

    brief() {
      const d = { t: Clock.t, phase: Clock.phase(), frames: state.frames, ready: hasGame() };
      if (hasGame() && Game.brief) Object.assign(d, Game.brief());
      return d;
    },

    // Things that must ALWAYS hold. Returns [] or a list of violations — never throws, because
    // a test wants the list, not the first failure.
    invariants() {
      const bad = [];
      if (Clock.t < 0) bad.push('clock.t negative');
      if (!Number.isInteger(Clock.t)) bad.push('clock.t not an integer');
      if (hasGame() && Game.invariants) bad.push.apply(bad, Game.invariants());
      return bad;
    },

    // Counts every item everywhere in the world. This is the conservation probe: the way to
    // refuse to chase a reported duplication ghost is to count before and after N operations.
    census() {
      if (hasGame() && Game.census) return Game.census();
      return { total: 0, byId: {}, note: 'game layer not built' };
    },

    log() { return Log.lines.map((l) => l.text); },
  };

  return { state, start, harness, session, STEP_MS, simulate, draw };
})();

// Install the harness on window under the names every test and capture script expects.
if (typeof window !== 'undefined') {
  window.__game = Debug.harness;
  window.__session = Debug.session;
  window.__debug = Debug;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', Debug.start);
  } else {
    Debug.start();
  }
}

if (typeof module !== 'undefined' && module.exports) module.exports = Debug;

</script>
</body>
</html>
