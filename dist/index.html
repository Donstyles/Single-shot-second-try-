  // Carved stone course-work, for the chrome the viewport is set into. A flat panel is a margin; a
  // coursed one is a frame, and the frame is now load-bearing — it holds the touch controls that
  // used to float over the world.
  function stonework(E, x, y, w, h) {
    // Ramp 2 (warm stone), DARK. Ramp 13 is gold/brass and at these shades it painted the chrome
    // brighter than the daylit world inside the viewport, which inverts the whole frame: the eye
    // goes to the border instead of the game. Gold is now an accent only, on the rivets.
    const COURSE = 16;
    for (let ry = 0; ry < h; ry += COURSE) {
      const row = (ry / COURSE) | 0;
      for (let sy = 0; sy < COURSE && ry + sy < h; sy++) {
        // A top-lit gradient per course, so each block has a lip and a shadow under it. The whole
        // range sits BELOW the daylit world's value: chrome brighter than the game inverts the
        // frame and the eye goes to the border instead of through it.
        const sh = sy === 0 ? 6 : sy === 1 ? 5 : sy >= COURSE - 2 ? 1 : 3 - ((sy > COURSE / 2) ? 1 : 0);
        E.hline(x, y + ry + sy, w, Core.idx(2, sh));
      }
      // Staggered vertical joint.
      const jx = x + ((row & 1) ? (w >> 1) : (w >> 2));
      for (let sy = 1; sy < COURSE - 2 && ry + sy < h; sy++) {
        E.px(jx, y + ry + sy, Core.idx(2, 0));
        E.px(jx + 1, y + ry + sy, Core.idx(2, 5));
      }
      // Weathering: a deterministic speckle keyed to position, never Math.random.
      for (let i = 0; i < 7; i++) {
        const hx = Core.hashStr('stone' + row + ':' + i) >>> 0;
        const px2 = x + 2 + (hx % Math.max(1, w - 4));
        const py2 = y + ry + 3 + ((hx >>> 8) % Math.max(1, COURSE - 6));
        if (py2 < y + h) E.px(px2, py2, Core.idx(2, (hx >>> 16) & 1 ? 1 : 5));
      }
      // A brass rivet at the course line: the one place gold belongs.
      if ((row & 1) === 0 && ry + 2 < h) {
        const rx = x + w - 7;
        E.rect(rx, y + ry + 2, 3, 3, Core.idx(13, 9));
        E.px(rx, y + ry + 2, Core.idx(13, 13));
        E.px(rx + 2, y + ry + 4, Core.idx(13, 4));
      }
    }
  }

  // Movement arrows, drawn as solid triangles. The old pad used '<' '>' '^' 'v' from the text font,
  // which a player described as "four brown squares in a diamond, each with a glyph so faint I had
  // to guess — I still don't know if < and > are turns or strafes".
  function arrowGlyph(E, cx, cy, dir, pi) {
    // THE POINT GOES FIRST, and a TURN is a curve.
    //
    // Forward and back are solid triangles pointing the way they move. Left and right are ARCS with
    // an arrowhead — a rotation glyph, not a translation one. A straight horizontal arrow reads as
    // strafe, and a cold player spent an entire fifteen-minute session convinced the game had no
    // way to turn around: "I pressed left eight times and ended up in a different quarter of town
    // still facing the same direction." Measured afterwards, eight taps rotate the party 189
    // degrees and move it exactly nowhere. The button was never broken; the picture on it was, and
    // a control a player cannot identify is as good as one that does not work.
    const R = 8;
    // Sidestep: a solid triangle with a bar behind it, so it cannot be confused with the turn arc.
    if (dir === 'sideL' || dir === 'sideR') {
      const sg = dir === 'sideL' ? -1 : 1;
      for (let i = 0; i < 7; i++) E.vline(cx + sg * (1 + i), cy - (6 - i), (6 - i) * 2 + 1, pi);
      E.vline(cx - sg * 4, cy - 6, 13, pi);
      E.vline(cx - sg * 5, cy - 6, 13, pi);
      return;
    }
    if (dir === 'up' || dir === 'down') {
      for (let i = 0; i < R; i++) {
        const half = i;
        if (dir === 'up') E.hline(cx - half, cy - (R >> 1) + i, half * 2 + 1, pi);
        else E.hline(cx - half, cy + (R >> 1) - i, half * 2 + 1, pi);
      }
      return;
    }
    // A three-quarter arc, opening toward the direction of rotation.
    const sgn = dir === 'left' ? -1 : 1;
    for (let a = -140; a <= 110; a += 4) {
      const t = a * Math.PI / 180;
      const ax = Math.round(Math.cos(t) * 7) * sgn, ay = Math.round(Math.sin(t) * 7);
      E.px(cx + ax, cy + ay, pi);
      E.px(cx + ax, cy + ay + 1, pi);
      E.px(cx + ax + sgn, cy + ay, pi);
    }
    // Arrowhead at the open end, pointing around the arc.
    const hx = cx + Math.round(Math.cos(-140 * Math.PI / 180) * 7) * sgn;
    const hy = cy + Math.round(Math.sin(-140 * Math.PI / 180) * 7);
    for (let i = 0; i < 5; i++) {
      E.hline(hx - i * sgn - (sgn < 0 ? 0 : i), hy + i, i * 2 + 1, pi);
    }
  }

  // The ornate outer frame: the viewport hole must stay index 0 so nothing paints over the 3D view.
  function gameFrame(E) {
    const V = E.VIEW;
    // Border band around the viewport.
    panel(E, 0, 0, E.W, V.y, 13, true);
    panel(E, 0, V.y, V.x, V.h, 13, true);
    panel(E, V.x + V.w, V.y, E.W - V.x - V.w, V.h, 13, true);
    stonework(E, 2, V.y, V.x - 4, V.h);
    stonework(E, V.x + V.w + 2, V.y, E.W - V.x - V.w - 4, V.h);
    E.frameRect(V.x - 1, V.y - 1, V.w + 2, V.h + 2, Core.idx(13, 9));
    // Corner rosettes.
    for (const [cx, cy] of [[V.x - 1, V.y - 1], [V.x + V.w - 3, V.y - 1],
      [V.x - 1, V.y + V.h - 3], [V.x + V.w - 3, V.y + V.h - 3]]) {
      E.rect(cx - 1, cy - 1, 5, 5, Core.idx(13, 11));
      E.rect(cx, cy, 3, 3, Core.idx(13, 6));
    }
  }

  function bar(E, x, y, w, h, frac, ramp) {
    E.rect(x, y, w, h, Core.idx(0, 2));
    E.frameRect(x, y, w, h, Core.idx(0, 5));
    const fw = Math.round((w - 2) * clamp(frac, 0, 1));
    if (fw > 0) {
      E.rect(x + 1, y + 1, fw, h - 2, Core.idx(ramp, 9));
      E.hline(x + 1, y + 1, fw, Core.idx(ramp, 12));
    }
  }

  // ---------------------------------------------------------------- hud icons
  // Every shipped 1998 CRPG hand-painted its command bar: a helm, a pack, a book, a map. Six
  // three-letter text labels in flat rectangles read as placeholder tooling, and "MNU" reads as a
  // debug string. These are drawn, not typed.
  function hudIcon(E, kind, x, y, s) {
    const k = s || 2;
    const px = (cx, cy, ramp, sh) => E.rect(x + cx * k, y + cy * k, k, k, Core.idx(ramp, sh));
    const box = (cx, cy, w, h, ramp, sh) => E.rect(x + cx * k, y + cy * k, w * k, h * k, Core.idx(ramp, sh));

    if (kind === 'journal') {          // a sealed scroll with a ribbon
      box(2, 2, 8, 9, 2, 13); box(2, 2, 8, 1, 2, 15);
      for (let r = 0; r < 5; r++) box(3, 4 + r, 6, 1, 2, 8 + (r & 1));
      box(1, 10, 10, 2, 4, 6); px(5, 11, 11, 12); px(6, 11, 11, 12);
      return;
    }
    if (kind === 'sheet') {            // a helm, visored
      box(3, 1, 6, 2, 14, 11); box(2, 3, 8, 5, 14, 9);
      box(3, 4, 6, 2, 0, 2);           // visor slit
      box(2, 8, 8, 1, 14, 6);
      px(5, 0, 11, 12); px(6, 0, 11, 12);
    } else if (kind === 'inv') {       // a pack with straps
      box(2, 3, 8, 6, 4, 8); box(2, 2, 8, 1, 4, 11);
      box(4, 0, 4, 2, 4, 6);           // flap
      px(4, 5, 13, 12); px(7, 5, 13, 12);
    } else if (kind === 'book') {      // an open spellbook
      box(1, 2, 4, 7, 0, 13); box(7, 2, 4, 7, 0, 13);
      box(5, 1, 2, 8, 4, 5);           // spine
      px(2, 4, 12, 11); px(3, 6, 12, 11); px(8, 4, 12, 11); px(9, 6, 12, 11);
    } else if (kind === 'map') {       // a folded map
      box(1, 2, 10, 7, 2, 12);
      box(4, 2, 1, 7, 2, 8); box(8, 2, 1, 7, 2, 8);   // folds
      px(2, 4, 11, 12); px(3, 5, 11, 12); px(9, 6, 11, 12);
    } else if (kind === 'rest') {      // a tent under a moon
      for (let i = 0; i < 5; i++) box(6 - i, 4 + i, 1 + i * 2, 1, 4, 7 + (i & 1));
      box(1, 9, 11, 1, 5, 5);
      px(9, 1, 13, 14); px(10, 1, 13, 14); px(10, 2, 13, 14);
    } else if (kind === 'menu') {      // a sealed scroll
      box(2, 2, 8, 7, 2, 13);
      box(2, 2, 8, 1, 2, 9); box(2, 8, 8, 1, 2, 9);
      px(5, 5, 11, 11); px(6, 5, 11, 11); px(5, 6, 11, 11); px(6, 6, 11, 11);
    }
  }

  // A pictorial shop sign. Blank brown planks meant a player had to walk into every door to learn
  // what it was.
  // A PAINTED INTERIOR behind a shop's stock list. Three separate reviews said the same thing —
  // "a door swaps the view for a menu panel", "buildings are shells", "25% content and 75% empty
  // brown box" — and named it the largest single gap to MM6. MM6's own shops are not rendered
  // rooms either: they are painted 2D interiors with a list of goods over them. So this is the
  // faithful answer rather than a substitute for one.
  function shopInterior(E, x, y, w, h, kind) {
    const px = (cx, cy, ramp, sh) => E.px(x + cx, y + cy, Core.idx(ramp, sh));
    const box = (cx, cy, bw, bh, ramp, sh) => E.rect(x + cx, y + cy, bw, bh, Core.idx(ramp, sh));

    const warm = kind === 'temple' ? 9 : kind === 'magic' ? 12 : kind === 'guild' ? 12 : 4;
    const wallRamp = kind === 'temple' || kind === 'guild' ? 1 : kind === 'magic' ? 0 : 4;

    // Back wall: coursed masonry for stone trades, planking for the rest, lit from the lamp.
    for (let ry = 0; ry < h; ry++) {
      const fall = 1 - ry / h;
      for (let rx = 0; rx < w; rx++) {
        const cx2 = Math.abs(rx - w / 2) / (w / 2);
        const lamp = Math.max(0, 1.15 - cx2 * 0.8 - fall * 0.25);
        let sh = 3 + Math.round(lamp * 5);
        if (wallRamp === 4) { if ((rx % 13) === 0) sh -= 2; }                 // plank seams
        else { if ((ry % 11) === 0 || ((rx + (((ry / 11) | 0) & 1) * 11) % 22) === 0) sh -= 2; }
        px(rx, ry, wallRamp, sh < 1 ? 1 : sh);
      }
    }

    // Floorboards, in perspective: the courses get shallower toward the back wall.
    const fy = Math.round(h * 0.62);
    let step = 3;
    for (let ry = h - 1, k = 0; ry > fy; k++) {
      const band = Math.max(2, step);
      for (let b = 0; b < band && ry > fy; b++, ry--) {
        for (let rx = 0; rx < w; rx++) {
          px(rx, ry, 5, (b === 0 ? 3 : 6) + (((rx + k * 3) % 17) === 0 ? -2 : 0));
        }
      }
      step = Math.max(2, step - 1);
    }

    // A hanging lamp with a warm pool — the one emissive thing in the room.
    const lx = Math.round(w * 0.17);
    for (let ry = 0; ry < 16; ry++) px(lx, ry, 13, 6);
    for (let ry = 16; ry < 24; ry++) {
      const ww = 9 - Math.abs(ry - 20);
      for (let rx = -ww; rx <= ww; rx++) px(lx + rx, ry, 13, ry < 20 ? 11 : 7);
    }
    for (let ry = 22; ry < 28; ry++) for (let rx = -3; rx <= 3; rx++) {
      if (rx * rx + (ry - 24) * (ry - 24) > 10) continue;
      px(lx + rx, ry, 15, 13);
    }

    // Shelves either side, stacked with trade goods.
    for (const side of [0, 1]) {
      const sx = side ? w - 96 : 12;
      for (let shelf = 0; shelf < 3; shelf++) {
        const sy = Math.round(h * 0.16) + shelf * 34;
        box(sx, sy + 22, 84, 4, 4, 3);
        box(sx, sy + 22, 84, 1, 4, 9);
        for (let g = 0; g < 5; g++) {
          const gx = sx + 5 + g * 16;
          const hsh = (Core.hashStr('goods' + kind + shelf + g + side) >>> 0);
          const gh2 = 8 + (hsh % 12);
          const ramp = kind === 'weapon' ? [14, 14, 13, 4, 14][g % 5]
            : kind === 'armour' ? [14, 1, 14, 13, 1][g % 5]
            : kind === 'magic' ? [12, 11, 6, 15, 12][g % 5]
            : kind === 'temple' ? [13, 0, 13, 9, 13][g % 5]
            : [4, 6, 11, 2, 13][g % 5];
          for (let ry = 0; ry < gh2; ry++) {
            const bw = (hsh & 1) && ry < 3 ? 4 : 9;
            for (let rx = 0; rx < bw; rx++) px(gx + rx + (9 - bw) / 2 | 0, sy + 22 - ry, ramp, 7 + ((rx + ry) & 1) * 3 - (rx > bw - 3 ? 3 : 0));
          }
        }
      }
    }

    // The counter, across the front, with the keeper behind it.
    const cy0 = Math.round(h * 0.60);
    box(0, cy0, w, 8, 4, 9);
    box(0, cy0 + 8, w, h - cy0 - 8, 4, 5);
    for (let rx = 0; rx < w; rx += 19) box(rx, cy0 + 8, 2, h - cy0 - 8, 4, 3);
    box(0, cy0, w, 2, 4, 12);

    // Keeper: shoulders, head, and an apron in the trade's colour.
    const kx = Math.round(w * 0.17), ky = cy0 - 44;
    box(kx - 22, ky + 16, 44, 30, warm, 8);
    box(kx - 22, ky + 16, 44, 2, warm, 11);
    for (let ry = 0; ry < 20; ry++) {
      for (let rx = -10; rx <= 10; rx++) {
        if ((rx * rx) / 100 + ((ry - 10) * (ry - 10)) / 110 > 1) continue;
        px(kx + rx, ky + ry - 4, 10, 11 - Math.round((rx + 10) / 20 * 4));
      }
    }
    for (let ry = -6; ry < 4; ry++) for (let rx = -11; rx <= 11; rx++) {
      if ((rx * rx) / 130 + ((ry) * (ry)) / 40 > 1) continue;
      px(kx + rx, ky + ry - 4, 4, 6 - ((rx + ry) & 1));
    }
    px(kx - 4, ky + 6, 0, 2); px(kx + 4, ky + 6, 0, 2);
    for (let rx = -3; rx <= 3; rx++) px(kx + rx, ky + 12, 11, 6);
  }

  function shopSign(E, kind, x, y, s) {
    const k = s || 2;
    const box = (cx, cy, w, h, ramp, sh) => E.rect(x + cx * k, y + cy * k, w * k, h * k, Core.idx(ramp, sh));
    if (kind === 'weapon') { box(5, 0, 2, 7, 14, 12); box(3, 6, 6, 1, 13, 10); box(5, 7, 2, 3, 4, 7); }
    else if (kind === 'armour') { box(3, 1, 6, 7, 14, 10); box(2, 2, 1, 4, 14, 8); box(9, 2, 1, 4, 14, 8); }
    else if (kind === 'general') { box(2, 3, 8, 6, 4, 8); box(4, 1, 4, 2, 4, 6); }
    else if (kind === 'magic') { box(5, 1, 2, 9, 4, 6); box(3, 0, 6, 2, 12, 12); }
    else if (kind === 'temple') { box(5, 0, 2, 10, 0, 14); box(2, 3, 8, 2, 0, 14); }
    else if (kind === 'tavern') { box(3, 3, 6, 6, 13, 10); box(9, 4, 2, 3, 13, 8); box(3, 2, 6, 1, 0, 13); }
    else if (kind === 'trainer') { box(2, 4, 8, 2, 14, 11); box(4, 2, 1, 6, 4, 7); box(7, 2, 1, 6, 4, 7); }
    else if (kind === 'guild') { box(3, 1, 6, 8, 12, 9); box(5, 3, 2, 4, 13, 13); }
  }

  // ---------------------------------------------------------------- animation
  let tick = 0;
  function step() { tick++; }

  return {
    TS, FONT, CH_W, CH_H, GLYPH_H, ADVANCE,
    text, textShadow, textCentred, textCentredShadow, textWidth, isBuilding, windowTexel,
    makeTexture, texFor, installBaked, installBakedTextures, groundTexel, wallTexel, slopeShade,
    mipsFor, lodFor, levelOf,
    skyBand, sunShade, SKY_KEYS,
    panel, button, gameFrame, stonework, arrowGlyph, bar, step, hudIcon, shopSign, shopInterior,
    get tick() { return tick; },
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Art;


/* ==================== 06b_sprites.js ==================== */
// 06b_sprites.js — sprite, portrait, paperdoll and icon painters.
// Owner: sprites. Calls Core, Art.
//
// Two sources, one interface. Baked foundry frames (assets/sprites/*.json, embedded by build.js)
// are used when present; otherwise a procedural painter stands in. The engine never knows which it
// got, which is what lets the art pass upgrade the game without touching the renderer.

const Sprites = (() => {
  'use strict';

  const { clamp, RNG } = Core;

  const cache = Object.create(null);
  const BAKED = Object.create(null);

  // ---------------------------------------------------------------- baked
  // Decode indexed PNGs the build embedded. The browser decodes them for free, which is why the
  // payload is PNG rather than raw index arrays.
  function installBaked(manifest) {
    if (!manifest) return 0;
    let n = 0;
    for (const id of Object.keys(manifest)) {
      BAKED[id] = manifest[id];
      n++;
    }
    return n;
  }

  // Decode a base64 indexed PNG into {w,h,data} using a canvas. Index recovery works because the
  // build writes the game palette into the PNG's PLTE, so a decoded RGB maps back 1:1.
  function decodePNG(b64, pal) {
    const img = new Image();
    img.src = 'data:image/png;base64,' + b64;
    return img;   // callers await decode; see prepareBaked
  }

  async function prepareBaked() {
    const out = {};
    for (const id of Object.keys(BAKED)) {
      const m = BAKED[id];
      const facings = [];
      for (const f of m.facings) {
        const img = new Image();
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/png;base64,' + f.png; });
        const c = document.createElement('canvas');
        c.width = f.w; c.height = f.h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, f.w, f.h).data;
        const data = new Uint8Array(f.w * f.h);
        for (let i = 0, p = 0; i < data.length; i++, p += 4) {
          data[i] = d[p + 3] < 128 ? 0 : Core.palIdx(d[p], d[p + 1], d[p + 2]);
        }
        facings.push({ w: f.w, h: f.h, data });
      }
      out[id] = { facings, h: m.h, aspect: m.aspect, pxPerUnit: m.pxPerUnit || (m.h / 1.24) };
    }
    return out;
  }

  // ---------------------------------------------------------------- procedural
  // Stand-in creature painter. Deliberately silhouette-first: a blob that reads at 40px beats a
  // detailed thing that does not, and the silhouette is the best predictor of "reads as MM6".
  function paintCreature(kind, w, h) {
    const d = new Uint8Array(w * h);
    const r = RNG.world('spr:' + kind);
    const M = Items.MONSTERS[kind] || { level: 1 };

    // Body plan varies by rough archetype so a skeleton does not look like an ogre.
    const heavy = /ogre|troll|zombie|knight|elemental|crown/.test(kind);
    const thin = /skeleton|wraith|lich|harpy|spider|rat/.test(kind);
    const ramp = /skeleton|lich|wraith/.test(kind) ? 0
      : /goblin|troll|harpy/.test(kind) ? 6
      : /elemental|crown/.test(kind) ? 15
      : /knight|steel/.test(kind) ? 14
      : /zombie|ghoul/.test(kind) ? 7
      : 10;

    const cx = w >> 1;
    const bodyW = Math.round(w * (heavy ? 0.52 : thin ? 0.26 : 0.38));
    const headR = Math.round(w * (heavy ? 0.15 : 0.13));
    const shoulderY = Math.round(h * 0.30);
    const hipY = Math.round(h * 0.66);

    const put = (x, y, sh) => {
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      d[y * w + x] = Core.shade(ramp << 4, sh);
    };

    // Legs
    for (let y = hipY; y < h; y++) {
      const spread = Math.round((y - hipY) * 0.22) + 2;
      const lw = Math.max(2, Math.round(bodyW * 0.22));
      for (let k = 0; k < lw; k++) {
        put(cx - spread - k, y, 7 - (k >> 1));
        put(cx + spread + k, y, 6 - (k >> 1));
      }
    }
    // Torso: a tapered barrel, lit from upper-left to match the foundry rig.
    for (let y = shoulderY; y < hipY; y++) {
      const t = (y - shoulderY) / Math.max(1, hipY - shoulderY);
      const ww = Math.round(bodyW * (1 - t * 0.18));
      for (let x = -ww; x <= ww; x++) {
        const lit = 10 - Math.round(Math.abs(x + ww * 0.35) / ww * 5);
        put(cx + x, y, clamp(lit, 3, 13));
      }
    }
    // Arms
    for (let y = shoulderY + 1; y < hipY - 1; y++) {
      const t = (y - shoulderY) / Math.max(1, hipY - shoulderY);
      const off = bodyW + 1 + Math.round(Math.sin(t * 2.4) * 2);
      for (let k = 0; k < Math.max(2, Math.round(bodyW * 0.28)); k++) {
        put(cx - off - k, y, 9 - (k >> 1));
        put(cx + off + k, y, 6 - (k >> 1));
      }
    }
    // Head
    for (let y = -headR; y <= headR; y++) {
      for (let x = -headR; x <= headR; x++) {
        if (x * x + y * y > headR * headR) continue;
        const lit = 11 - Math.round((x + headR) / (headR * 2) * 5) - Math.round((y + headR) / (headR * 2) * 2);
        put(cx + x, shoulderY - headR + y, clamp(lit, 4, 14));
      }
    }
    // Eyes: two dark pips. At 40px this is the only facial feature that survives, and it is the
    // one that makes a shape read as a creature rather than a rock.
    put(cx - Math.max(1, headR >> 1), shoulderY - headR, 1);
    put(cx + Math.max(1, headR >> 1), shoulderY - headR, 1);
    if (/goblin|troll|ogre/.test(kind)) {
      // Horns, because the silhouette test is what matters most.
      for (let k = 0; k < headR; k++) {
        put(cx - headR - k + 1, shoulderY - headR - k - 1, 5);
        put(cx + headR + k - 1, shoulderY - headR - k - 1, 5);
      }
    }

    // 1px dark outline outside the silhouette — what separates 1998 pre-rendered from a modern
    // render pasted on a background.
    const out = Uint8Array.from(d);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (d[y * w + x]) continue;
        if ((x > 0 && d[y * w + x - 1]) || (x < w - 1 && d[y * w + x + 1]) ||
            (y > 0 && d[(y - 1) * w + x]) || (y < h - 1 && d[(y + 1) * w + x])) {
          out[y * w + x] = Core.idx(0, 2);
        }
      }
    }
    return { w, h, data: out };
  }

  function creature(kind, facing) {
    const baked = BAKED.__ready && BAKED.__ready[kind];
    if (baked) {
      const f = baked.facings[clamp(facing || 0, 0, baked.facings.length - 1)];
      f.pxPerUnit = baked.pxPerUnit;
      return f;
    }
    const k = 'c:' + kind;
    if (!cache[k]) cache[k] = paintCreature(kind, 48, 64);
    return cache[k];
  }

  // World height a sprite should be drawn at, given the creature's real height. A trimmed frame is
  // only part of the model, so drawing it at the creature's full height inflates everything.
  function worldHeight(spr, creatureHeight) {
    if (!spr.pxPerUnit) return creatureHeight;
    return (spr.h / spr.pxPerUnit) * creatureHeight;
  }

  // ---------------------------------------------------------------- decor
  function paintDecor(kind) {
    const w = 40, h = 56;
    const clamp = Core.clamp;
    const d = new Uint8Array(w * h);
    const put = (x, y, ramp, sh) => {
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      d[y * w + x] = Core.shade(ramp << 4, sh);
    };
    const cx = w >> 1;

    if (kind === 'oak' || kind === 'pine' || kind === 'deadtree' || kind === 'ashstump') {
      // Trunk and canopy MUST overlap. The first version started the trunk below where the canopy
      // ended, which drew a floating crown and a detached post — the defect reads instantly as
      // "sprites are not grounded" and no amount of texture work hides it.
      const canopyBottom = kind === 'pine' ? Math.round(h * 0.72) : Math.round(h * 0.58);
      const trunkTop = kind === 'ashstump' ? Math.round(h * 0.78) : Math.round(canopyBottom * 0.72);
      const trunkW = kind === 'ashstump' ? 4 : 2;
      for (let y = trunkTop; y < h; y++) {
        const taper = trunkW + Math.round((y - trunkTop) / Math.max(1, h - trunkTop) * 1.6);
        for (let x = -taper; x <= taper; x++) put(cx + x, y, 4, clamp(8 - Math.abs(x + 1), 3, 12));
      }
      // Root flare: without a darkened, widening base the trunk ends in a flat cut and the tree
      // reads as floating above the ground.
      for (let y = h - 4; y < h; y++) {
        const flare = trunkW + 2 + (y - (h - 4));
        for (let x = -flare; x <= flare; x++) put(cx + x, y, 5, clamp(5 - Math.abs(x) / 2, 2, 7));
      }
      if (kind !== 'ashstump') {
        const leafRamp = kind === 'deadtree' ? 4 : 7;
        if (kind === 'pine') {
          for (let t = 0; t < 4; t++) {
            const cyy = Math.round(h * (0.10 + t * 0.16));
            const rr = 5 + t * 4;
            for (let y = -rr; y <= rr + 2; y++) {
              for (let x = -rr; x <= rr; x++) {
                if (Math.abs(x) + Math.abs(y) * 1.3 > rr) continue;
                put(cx + x, cyy + y, leafRamp,
                  clamp(11 - Math.round((x + rr) / (rr * 2 + 1) * 5) - Math.round((y + rr) / (rr * 2 + 1) * 2), 3, 13));
              }
            }
          }
        } else {
          // Four overlapping lobes of different size, then a per-pixel noise nibble at the rim.
          // A clean ellipse is what makes a tree read as a modern low-poly asset.
          const cyy = Math.round(h * 0.30);
          const lobes = [[0, 0, 13], [-8, 3, 9], [8, 2, 10], [-2, -7, 8], [4, 8, 7]];
          for (const [ox, oy, rr] of lobes) {
            for (let y = -rr; y <= rr; y++) {
              for (let x = -rr; x <= rr; x++) {
                const dd = Math.hypot(x, y * 1.12);
                if (dd > rr) continue;
                // Ragged rim: drop scattered pixels in the outer 22% so the edge is alpha-cut
                // foliage rather than a geometric arc.
                if (dd > rr * 0.78 && ((x * 7 + y * 13 + ox * 3) & 3) === 0) continue;
                if (kind === 'deadtree' && ((x * 3 + y * 5) & 3)) continue;
                const gx = x + ox, gy = y + oy;
                put(cx + gx, cyy + gy, leafRamp,
                  clamp(11 - Math.round((gx + 16) / 32 * 5) - Math.round((gy + 16) / 32 * 3)
                    + (((gx * 5 + gy * 3) & 3) === 0 ? 1 : 0), 3, 13));
              }
            }
          }
        }
      }
    } else if (kind === 'rock' || kind === 'standingstone') {
      const rh = kind === 'standingstone' ? Math.round(h * 0.8) : Math.round(h * 0.35);
      const rw = kind === 'standingstone' ? 5 : 11;
      for (let y = h - rh; y < h; y++) {
        const t = (y - (h - rh)) / rh;
        const ww = Math.round(rw * (kind === 'standingstone' ? 1 : 0.5 + t * 0.5));
        for (let x = -ww; x <= ww; x++) put(cx + x, y, 1, clamp(10 - Math.round((x + ww) / (ww * 2 + 1) * 5), 3, 13));
      }
    } else if (kind === 'reed' || kind === 'bush') {
      for (let i = 0; i < 26; i++) {
        const bx = cx - 9 + ((i * 7) % 19);
        const bh = 14 + ((i * 11) % 18);
        for (let y = h - bh; y < h; y++) put(bx, y, kind === 'reed' ? 6 : 7, 6 + ((i + y) & 3));
      }
    } else if (kind === 'brazier') {
      for (let y = h - 18; y < h; y++) for (let x = -3; x <= 3; x++) put(cx + x, y, 14, 6);
      for (let y = h - 30; y < h - 16; y++) {
        const ww = 7 - Math.abs(y - (h - 23));
        for (let x = -ww; x <= ww; x++) put(cx + x, y, 15, clamp(9 + ((x + y) & 3), 6, 15));
      }
    } else if (kind === 'fountain') {
      for (let y = h - 16; y < h; y++) for (let x = -14; x <= 14; x++) put(cx + x, y, 1, 8 - (Math.abs(x) >> 2));
      for (let y = h - 30; y < h - 14; y++) for (let x = -3; x <= 3; x++) put(cx + x, y, 8, 10);
    } else if (kind === 'chest') {
      for (let y = h - 20; y < h; y++) for (let x = -11; x <= 11; x++) put(cx + x, y, 4, 7 - (Math.abs(x) >> 3));
      for (let x = -11; x <= 11; x++) put(cx + x, h - 20, 13, 11);
      put(cx, h - 12, 13, 13);
    } else if (kind.indexOf('stall') === 0) {
      // A market stall: four posts, a striped awning, a trestle, and goods on it. This is the whole
      // content of the market shot, and for three rounds the market shot contained two blank walls.
      const variant = kind.indexOf(':') > 0 ? (parseInt(kind.split(':')[1], 10) || 0) : 0;
      const AW = 17, ay0 = h - 40;
      // Posts.
      for (const px2 of [-AW + 2, AW - 2]) {
        for (let y = ay0 + 6; y < h - 2; y++) { put(cx + px2, y, 4, 5); put(cx + px2 + 1, y, 4, 3); }
      }
      // Awning: sloping stripes, front edge scalloped.
      const stripe = [11, 2, 6][variant % 3];
      for (let x = -AW; x <= AW; x++) {
        const drop = Math.round(Math.abs(x) * 0.18);
        for (let y = ay0 + drop; y < ay0 + 8 + drop; y++) {
          const band = (((x + AW) / 4) | 0) & 1;
          put(cx + x, y, band ? stripe : 2, band ? 10 - (y - ay0 - drop) / 3 : 13 - (y - ay0 - drop) / 3);
        }
        // Scalloped valance.
        if (((x + AW) % 6) < 4) put(cx + x, ay0 + 8 + drop, 4, 3);
      }
      // Trestle table and goods.
      for (let x = -AW + 3; x <= AW - 3; x++) for (let y = h - 15; y < h - 11; y++) put(cx + x, y, 4, y === h - 15 ? 9 : 5);
      for (let i = 0; i < 6; i++) {
        const gx = -AW + 5 + i * 5;
        const ramp = [6, 15, 11, 2, 13, 3][(i + variant) % 6];
        for (let y = h - 20; y < h - 15; y++) for (let x = gx; x < gx + 4; x++) {
          const r2 = (x - gx - 1.5) * (x - gx - 1.5) + (y - (h - 18)) * (y - (h - 18));
          if (r2 < 5) put(cx + x, y, ramp, 9 + ((x + y) & 1));
        }
      }
      // Legs.
      for (const lx of [-AW + 4, AW - 5]) for (let y = h - 11; y < h - 1; y++) put(cx + lx, y, 4, 4);

    } else if (kind === 'herb') {
      // A clump of marshwort: broad basal leaves and three flower spikes. It has to read as
      // "pick me" at ten paces or the quest is invisible even once the item exists.
      for (let i = 0; i < 9; i++) {
        const a = -Math.PI / 2 + (i - 4) * 0.28;
        const len = 13 + ((i * 5) % 5);
        for (let t = 0; t < len; t++) {
          const bx = Math.round(Math.cos(a) * t * 1.15);
          const by = h - 2 + Math.round(Math.sin(a) * t);
          put(cx + bx, by, 7, 6 + (t > len - 4 ? 3 : 0) + ((i & 1) ? 1 : 0));
          if (t > 3 && t < len - 3) put(cx + bx + (i < 4 ? -1 : 1), by, 7, 4);
        }
      }
      for (const sx of [-5, 0, 5]) {
        for (let t = 0; t < 9; t++) {
          const yy = h - 16 - t;
          put(cx + sx + (t > 5 ? (sx > 0 ? 1 : sx < 0 ? -1 : 0) : 0), yy, 12, 9 + (t & 1) * 3);
          if (t > 2 && t < 8) {
            put(cx + sx - 1, yy, 12, 7);
            put(cx + sx + 1, yy, 12, 12);
          }
        }
      }

    } else if (kind === 'crate') {
      const S = 11;
      for (let y = h - S * 2; y < h; y++) {
        for (let x = -S; x <= S; x++) {
          const edge = (y === h - S * 2 || y === h - 1 || x === -S || x === S);
          put(cx + x, y, 4, edge ? 3 : 7 - (((x + y) >> 2) & 1));
        }
      }
      // Diagonal bracing.
      for (let i = 0; i < S * 2; i++) { put(cx - S + i, h - 1 - i, 4, 10); put(cx + S - i, h - 1 - i, 4, 10); }

    } else if (kind === 'barrel') {
      const S = 9, top = h - 24;
      for (let y = top; y < h; y++) {
        const bulge = Math.round(Math.sin((y - top) / 24 * Math.PI) * 2);
        for (let x = -S - bulge; x <= S + bulge; x++) {
          const stave = ((x + S) % 4) === 0;
          const hoop = (y === top + 3 || y === top + 19);
          put(cx + x, y, 4, hoop ? 11 : stave ? 3 : 6 - (Math.abs(x) > S ? 1 : 0));
        }
      }
      for (let x = -S; x <= S; x++) put(cx + x, top, 4, 9);

    } else if (kind === 'campfire') {
      // Ring of stones, charred logs, flame. The camp's centre of gravity.
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const sx = Math.round(Math.cos(a) * 13), sy = h - 4 + Math.round(Math.sin(a) * 4);
        for (let dy = -2; dy <= 1; dy++) for (let dx = -2; dx <= 2; dx++) {
          if (dx * dx + dy * dy > 5) continue;
          put(cx + sx + dx, sy + dy, 1, 5 + ((i + dx) & 1));
        }
      }
      for (const [lx, ly, len] of [[-8, h - 8, 16], [-6, h - 10, 13]]) {
        for (let i = 0; i < len; i++) put(cx + lx + i, ly - ((i * 3) / len | 0), 4, 2 + (i & 1));
      }
      for (let y = 0; y < 22; y++) {
        const t = y / 22;
        const wF = Math.round((1 - t) * 7) + 1;
        for (let x = -wF; x <= wF; x++) {
          const edge = Math.abs(x) >= wF - 1;
          put(cx + x + Math.round(Math.sin(t * 5) * 2), h - 12 - y, 15, edge ? 8 + (y & 1) : 13);
        }
      }

    } else if (kind === 'door' || kind.indexOf('door:') === 0) {
      // A DOOR, standing in the doorway. A cold player spent fifteen minutes in a town and entered
      // exactly one building, by accident: "every building is a featureless solid block of stone
      // or wood. There is no door-shaped thing to walk toward." A settlement you cannot navigate
      // by looking at it is not a settlement, it is a maze with no walls drawn.
      const DW = 15, DH = 40;                     // half-width, height of the leaf
      const top = h - DH, arch = 9;
      const inArch = (x, y) => {
        if (y >= top + arch) return Math.abs(x) <= DW;
        const dy = (top + arch) - y;
        return x * x + dy * dy * (DW / arch) * (DW / arch) <= DW * DW;
      };
      // Stone surround, one pixel proud of the leaf on every side.
      for (let y = top - 3; y < h; y++) {
        for (let x = -DW - 4; x <= DW + 4; x++) {
          if (inArch(x, y + 2)) continue;
          if (!inArch(x, y + 5) && y < top + 2) continue;
          put(cx + x, y, 13, 7 + ((x + y) & 1));
        }
      }
      // Planks, vertical, with a seam every four pixels and a warm interior light down the join.
      for (let y = top; y < h; y++) {
        for (let x = -DW; x <= DW; x++) {
          if (!inArch(x, y)) continue;
          const seam = ((x + DW) % 5) === 0;
          const grain = ((x * 7 + y * 3) & 7) === 0 ? 1 : 0;
          put(cx + x, y, 4, seam ? 3 : 7 - grain);
        }
      }
      // Two iron bands and a ring handle: the read that says "openable" at forty paces.
      for (const by of [top + arch + 6, h - 10]) {
        for (let x = -DW; x <= DW; x++) if (inArch(x, by)) { put(cx + x, by, 13, 3); put(cx + x, by + 1, 13, 5); }
      }
      for (let a = 0; a < 16; a++) {
        const ax = Math.round(Math.cos(a * Math.PI / 8) * 3) + DW - 5;
        const ay = Math.round(Math.sin(a * Math.PI / 8) * 3) + h - 20;
        put(cx + ax, ay, 13, 12);
      }
      // Threshold shadow, so the door sits IN the wall rather than on it.
      for (let x = -DW - 4; x <= DW + 4; x++) put(cx + x, h - 1, 0, 2);

    } else if (kind === 'sign' || kind.indexOf('sign:') === 0) {
      // Post and board.
      for (let y = h - 26; y < h; y++) for (let dx = -1; dx <= 1; dx++) put(cx + dx, y, 4, 6 - Math.abs(dx));
      for (let y = h - 42; y < h - 24; y++) for (let x = -12; x <= 12; x++) put(cx + x, y, 4, 10 - (Math.abs(x) >> 3));
      for (let x = -12; x <= 12; x++) { put(cx + x, h - 42, 4, 12); put(cx + x, h - 25, 4, 4); }

      // A PICTOGRAM, not a blank board. Three judges independently reported having to walk into
      // every door to learn what it was; MM6 taught you a town's layout by its signs.
      const trade = kind.indexOf(':') > 0 ? kind.split(':')[1] : null;
      const my = h - 40;
      const g = (gx, gy, ramp, sh) => put(cx + gx, my + gy, ramp, sh);
      const gbox = (gx, gy, gw, gh, ramp, sh) => {
        for (let yy = 0; yy < gh; yy++) for (let xx = 0; xx < gw; xx++) g(gx + xx, gy + yy, ramp, sh);
      };
      if (trade === 'weapon') { gbox(-1, 1, 2, 9, 14, 13); gbox(-4, 9, 8, 1, 13, 11); gbox(-1, 10, 2, 3, 4, 7); }
      else if (trade === 'armour') { gbox(-4, 2, 8, 9, 14, 12); gbox(-6, 3, 2, 5, 14, 9); gbox(4, 3, 2, 5, 14, 9); }
      else if (trade === 'general') { gbox(-5, 4, 10, 8, 5, 12); gbox(-2, 1, 4, 3, 5, 9); }
      else if (trade === 'magic') { gbox(-1, 2, 2, 11, 4, 8); gbox(-4, 0, 8, 3, 12, 13); }
      else if (trade === 'temple') { gbox(-1, 0, 2, 13, 0, 15); gbox(-5, 4, 10, 2, 0, 15); }
      else if (trade === 'tavern') { gbox(-4, 4, 8, 8, 13, 12); gbox(4, 5, 3, 4, 13, 9); gbox(-4, 2, 8, 2, 2, 14); }
      else if (trade === 'trainer') { gbox(-5, 5, 10, 2, 14, 13); gbox(-3, 2, 2, 8, 4, 7); gbox(1, 2, 2, 8, 4, 7); }
      else if (trade === 'guild') { gbox(-4, 1, 8, 10, 12, 10); gbox(-1, 4, 2, 4, 13, 14); }
    } else if (kind === 'stump') {
      for (let y = h - 12; y < h; y++) for (let x = -6; x <= 6; x++) put(cx + x, y, 4, 7);
    } else if (kind === 'questitem') {
      for (let y = h - 22; y < h - 6; y++) {
        const ww = 8 - Math.abs(y - (h - 14));
        for (let x = -ww; x <= ww; x++) put(cx + x, y, 13, clamp(11 + ((x + y) & 1) * 2, 8, 15));
      }
    }

    const out = Uint8Array.from(d);
    // Trees and shrubs get NO outline. A hard 1px rim around foliage reads as a rendered solid,
    // which is exactly the "low-poly asset pack" tell; hard-edged props keep theirs.
    const soft = /oak|pine|deadtree|bush|reed/.test(kind);
    if (!soft) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (d[y * w + x]) continue;
          if ((x > 0 && d[y * w + x - 1]) || (x < w - 1 && d[y * w + x + 1]) ||
              (y > 0 && d[(y - 1) * w + x]) || (y < h - 1 && d[(y + 1) * w + x])) out[y * w + x] = Core.idx(0, 2);
        }
      }
    }
    return { w, h, data: out };
  }

  function decor(kind, variant) {
    const key = variant ? kind + ':' + variant : kind;
    const k = 'd:' + key;
    if (!cache[k]) cache[k] = paintDecor(key);
    return cache[k];
  }

  const DECOR_HEIGHT = {
    oak: 6.5, pine: 8.0, deadtree: 5.5, ashstump: 2.4, reed: 1.6, bush: 1.2,
    rock: 1.8, standingstone: 4.2, brazier: 2.0, fountain: 2.4, chest: 1.1,
    sign: 2.6, stump: 0.8, questitem: 1.0, tent: 2.6, door: 3.1,
    stall: 3.0, crate: 1.1, barrel: 1.2, campfire: 1.9, herb: 1.0,
  };

  // ---------------------------------------------------------------- portraits
  // 64x72 character portraits. Class and sex drive the palette and the silhouette; the point is
  // that four party members are instantly distinguishable at a glance in the HUD.
  // A portrait must be a PERSON, not a template with a different hair colour. An art critic
  // magnified the party strip: "Alder and Dorn are pixel-identical faces with different hair grey;
  // Bree and Cass are pixel-identical with different robe colour. Same nose polygon, same two-dot
  // eyes, no mouths, no whites of eyes, one skin ramp. Four bodies wearing one head." This strip is
  // in every 3D shot, so one asset was doing eighteen frames' worth of damage.
  //
  // Everything below is drawn from the seeded stream, so a character's face is stable forever, and
  // every axis that makes a face recognisable at 64px is varied: skull width, jaw, brow, nose
  // length and bridge, eye spacing and colour, mouth, skin tone, hair style, beard, and the
  // headgear the class actually wears.
  function paintPortrait(seed, cls, sex) {
    const w = 64, h = 72;
    const d = new Uint8Array(w * h);
    const r = RNG.world('portrait:' + seed + ':' + cls + ':' + sex);
    const put = (x, y, ramp, sh) => { if (x >= 0 && y >= 0 && x < w && y < h) d[y * w + x] = Core.shade(ramp << 4, sh); };
    const cx = w >> 1;

    // ---- palette choices
    const skinBase = r.int(4);                       // 0 pale .. 3 dark
    const skinLo = [10, 9, 8, 6][0] === 0 ? 10 : 10; // flesh ramp; tone comes from the shade offset
    const skinShift = [3, 1, -1, -3][skinBase];
    const hairRamp = r.pick([4, 5, 13, 0, 3]);
    const hairDark = r.int(5) + 2;
    const eyeRamp = r.pick([1, 6, 4, 8]);
    const clothRamp = { knight: 14, templar: 13, ranger: 7, priest: 0, mage: 12, warden: 6 }[cls] || 11;

    // ---- skull geometry
    const wide = r.float(-2.2, 2.6);                 // cheek width
    const longFace = r.float(-2.0, 3.0);             // skull height
    const jaw = r.float(-2.0, 2.4);                  // jaw squareness
    const browY = r.int(3) - 1;
    const eyeGap = 5 + r.int(3);
    const noseLen = 4 + r.int(4);
    const noseW = r.int(2);
    const mouthW = 2 + r.int(3);
    const beard = sex === 'm' && r.chance(0.45) ? 1 + r.int(3) : 0;

    // The head must leave room ABOVE it for hair and headgear and BELOW it for shoulders. The
    // first pass sized the skull to nearly the whole 64x72 plate, so the hair was a six-pixel arc
    // at the crown and the helms had nowhere to sit.
    const HR = 13, faceCY = h - 38;
    const rx = HR - 2 + wide, ry = HR + 1 + longFace;
    const inHead = (x, y) => {
      // Ellipse for the cranium, widened toward a square jaw at the bottom.
      const jw = y > 4 ? (1 + (jaw / 14) * (y / ry)) : 1;
      return (x * x) / (rx * rx * jw * jw) + (y * y) / (ry * ry) <= 1;
    };

    // ---- background: a vignetted plate, no checkerboard
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const dx = (x - cx) / cx, dy = (y - h / 2) / (h / 2);
        const v = 1 - Math.min(1, dx * dx + dy * dy * 0.7);
        put(x, y, 1, 2 + Math.round(v * 3));
      }
    }

    // ---- shoulders and collar
    for (let y = h - 22; y < h; y++) {
      const ww = 16 + (y - (h - 22)) * 1.3;
      for (let x = -ww; x <= ww; x++) {
        const lit = clamp(10 - Math.round((x + ww) / (ww * 2 + 1) * 6), 3, 13);
        put(cx + x, y, clothRamp, lit);
      }
    }
    // Neck.
    for (let y = h - 28; y < h - 19; y++) {
      for (let x = -5; x <= 5; x++) put(cx + x, y, 10, clamp(6 + skinShift, 2, 14));
    }

    // ---- head
    for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
      for (let x = -Math.ceil(rx) - 2; x <= Math.ceil(rx) + 2; x++) {
        if (!inHead(x, y)) continue;
        // Key light from upper left, matching the sprite foundry's rig so faces and bodies agree.
        const lit = 12 - Math.round((x + rx) / (rx * 2) * 5) - Math.round((y + ry) / (ry * 2) * 3);
        put(cx + x, faceCY + y, 10, clamp(lit + skinShift, 2, 15));
      }
    }
    // Cheekbone and jaw shading, which is most of what makes a face read as a face.
    for (let y = 1; y < ry; y++) {
      for (const sgn of [-1, 1]) {
        const x = Math.round(sgn * (rx - 2 - y * 0.15));
        if (inHead(x, y)) put(cx + x, faceCY + y, 10, clamp(5 + skinShift, 2, 14));
      }
    }

    // ---- brow ridge
    for (let x = -eyeGap - 4; x <= eyeGap + 4; x++) {
      if (Math.abs(x) < 2) continue;
      if (!inHead(x, browY - 3)) continue;
      put(cx + x, faceCY + browY - 3, 10, clamp(4 + skinShift, 2, 12));
      put(cx + x, faceCY + browY - 4, hairRamp, hairDark);
    }

    // ---- eyes: white, iris, pupil. Two dark pips is the single strongest "unfinished" tell.
    for (const sgn of [-1, 1]) {
      const ex = sgn * eyeGap;
      for (let x = -2; x <= 2; x++) for (let y = -1; y <= 1; y++) {
        put(cx + ex + x, faceCY + browY + y, 0, 14);
      }
      put(cx + ex - 1, faceCY + browY, eyeRamp, 8);
      put(cx + ex, faceCY + browY, eyeRamp, 10);
      put(cx + ex, faceCY + browY, 0, 1);
      put(cx + ex + 1, faceCY + browY - 1, 0, 13);          // catchlight
      // Lower lid.
      put(cx + ex - 1, faceCY + browY + 2, 10, clamp(5 + skinShift, 2, 12));
      put(cx + ex, faceCY + browY + 2, 10, clamp(5 + skinShift, 2, 12));
    }

    // ---- nose
    for (let y = 0; y < noseLen; y++) {
      put(cx - 1 - noseW, faceCY + browY + 1 + y, 10, clamp(6 + skinShift, 2, 13));
      put(cx + 1, faceCY + browY + 1 + y, 10, clamp(11 + skinShift, 2, 15));
    }
    for (let x = -1 - noseW; x <= 1 + noseW; x++) {
      put(cx + x, faceCY + browY + noseLen + 1, 10, clamp(4 + skinShift, 2, 12));
    }

    // ---- mouth
    const my = faceCY + browY + noseLen + 5;
    for (let x = -mouthW; x <= mouthW; x++) {
      put(cx + x, my, 11, 5);
      put(cx + x, my - 1, 10, clamp(9 + skinShift, 2, 14));
      put(cx + x, my + 1, 10, clamp(7 + skinShift, 2, 13));
    }

    // ---- beard
    if (beard) {
      for (let y = my - 2; y < faceCY + ry; y++) {
        for (let x = -rx; x <= rx; x++) {
          if (!inHead(x, y - faceCY)) continue;
          if (y < my + 1 && Math.abs(x) < mouthW + 2) continue;      // leave the mouth
          if (((x * 3 + y * 5) & 7) < beard * 2) put(cx + x, y, hairRamp, hairDark + ((x + y) & 1));
        }
      }
    }

    // ---- hair, then class headgear over it
    // Hair HUGS THE SKULL: every point inside the head (grown by two) above the brow becomes hair,
    // plus side falls for the longer styles. Deriving it from a sine curve instead produced a
    // six-pixel arc floating at the crown that read as a smudge.
    const style = sex === 'f' ? 2 + r.int(2) : r.int(3);          // 0 short, 1 swept, 2 long, 3 very long
    const fall = [0, 0, 16, 24][style];
    const grow = 2;
    for (let y = -Math.ceil(ry) - grow; y <= browY - 4; y++) {
      for (let x = -Math.ceil(rx) - grow; x <= Math.ceil(rx) + grow; x++) {
        const outer = (x * x) / ((rx + grow) * (rx + grow)) + (y * y) / ((ry + grow) * (ry + grow)) <= 1;
        if (!outer) continue;
        if (style === 1 && y < -ry + 3 && x > rx - 6) continue;      // a swept parting
        put(cx + x, faceCY + y, hairRamp, clamp(hairDark + 4 - ((x * 2 + y) & 3), 2, 13));
      }
    }
    // Side falls, outside the face on both edges.
    for (let y = browY - 4; y < browY - 4 + fall; y++) {
      const t = (y - (browY - 4)) / Math.max(1, fall);
      const ww = Math.round(rx + grow - t * 1.5);
      for (const sgn of [-1, 1]) {
        for (let k = 0; k < 4; k++) {
          const x = sgn * (ww - k);
          if (Math.abs(x) < rx - 3) continue;
          put(cx + x, faceCY + y, hairRamp, clamp(hairDark + 3 - ((x + y) & 3), 2, 12));
        }
      }
    }

    if (cls === 'knight' || cls === 'templar') {
      // An open-faced helm with a nasal bar.
      for (let y = -ry - 1; y < -ry + 12; y++) {
        for (let x = -rx - 2; x <= rx + 2; x++) {
          if ((x * x) / ((rx + 2) * (rx + 2)) + (y * y) / ((ry + 2) * (ry + 2)) > 1) continue;
          put(cx + x, faceCY + y, 14, clamp(11 - Math.round((x + rx) / (rx * 2) * 5), 3, 14));
        }
      }
      for (let y = -ry + 8; y < browY + 2; y++) put(cx, faceCY + y, 14, 12);
      for (let x = -rx - 2; x <= rx + 2; x++) put(cx + x, faceCY - ry + 12, 14, 4);
    } else if (cls === 'priest') {
      for (let y = -ry - 4; y < -ry + 6; y++) {
        for (let x = -rx; x <= rx; x++) put(cx + x, faceCY + y, 13, clamp(11 - ((x + y) & 3), 4, 14));
      }
    } else if (cls === 'mage') {
      // A brimless cap with a band.
      for (let y = -ry - 3; y < -ry + 7; y++) {
        const ww = Math.round(rx * (1 - (y + ry + 3) / 22));
        for (let x = -ww; x <= ww; x++) put(cx + x, faceCY + y, 12, clamp(10 - ((x + y) & 3), 3, 13));
      }
      for (let x = -rx; x <= rx; x++) put(cx + x, faceCY - ry + 7, 13, 11);
    } else if (cls === 'ranger' || cls === 'warden') {
      // A hood: falls past the jaw on both sides.
      for (let y = -ry - 3; y < ry - 2; y++) {
        for (let x = -rx - 3; x <= rx + 3; x++) {
          const inner = (x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1;
          const outer = (x * x) / ((rx + 3) * (rx + 3)) + (y * y) / ((ry + 3) * (ry + 3)) <= 1;
          if (!outer) continue;
          if (inner && y > -ry + 6) continue;
          put(cx + x, faceCY + y, 7, clamp(8 - ((x + y) & 3), 2, 12));
        }
      }
    }

    return { w, h, data: d };
  }

  function portrait(idx, cls, sex) {
    const k = 'p:' + idx + cls + sex;
    if (!cache[k]) cache[k] = paintPortrait(idx, cls, sex);
    return cache[k];
  }

  // ---------------------------------------------------------------- item icons
  function paintIcon(id) {
    const w = 32, h = 32;
    const d = new Uint8Array(w * h);
    const it = Items.ITEMS[id] || {};
    const put = (x, y, ramp, sh) => { if (x >= 0 && y >= 0 && x < w && y < h) d[y * w + x] = Core.shade(ramp << 4, sh); };

    const kind = it.kind || 'misc';
    if (kind === 'weapon') {
      const sk = it.skill;
      if (sk === 'bow') {
        for (let a = -14; a <= 14; a++) put(10 + Math.round(Math.cos(a / 18) * 7), 16 + a, 4, 8);
        for (let y = 2; y < 30; y++) put(18, y, 0, 10);
      } else if (sk === 'axe') {
        for (let y = 4; y < 29; y++) put(20, y, 4, 7);                       // haft
        for (let y = 4; y < 16; y++) {
          const wdt = 8 - Math.abs(y - 10);
          for (let x = 0; x < wdt; x++) put(19 - x, y, 14, 12 - (x >> 1));   // blade
        }
      } else if (sk === 'mace') {
        for (let y = 12; y < 29; y++) put(16, y, 4, 7);                      // haft
        for (let y = 3; y < 13; y++) for (let x = -5; x <= 5; x++) {
          if (Math.hypot(x, y - 8) > 5.4) continue;
          put(16 + x, y, 14, 11 - Math.abs(x) / 2);                          // head
        }
        for (const [fx, fy] of [[-7, 8], [7, 8], [0, 1], [0, 15]]) put(16 + fx, fy, 14, 13);
      } else if (sk === 'staff') {
        for (let y = 1; y < 30; y++) for (let x = -1; x <= 1; x++) put(16 + x, y, 4, 8 - Math.abs(x));
        for (let x = -4; x <= 4; x++) put(16 + x, 4, 4, 6);                   // binding
        put(16, 1, 12, 13); put(15, 2, 12, 12); put(17, 2, 12, 12);
      } else if (sk === 'spear') {
        for (let y = 8; y < 30; y++) put(16, y, 4, 7);
        for (let y = 1; y < 9; y++) {
          const wdt = Math.max(0, 3 - Math.abs(y - 5));
          for (let x = -wdt; x <= wdt; x++) put(16 + x, y, 14, 12 - Math.abs(x));
        }
      } else if (sk === 'dagger') {
        for (let y = 8; y < 21; y++) for (let x = -1; x <= 1; x++) put(16 + x, y, 14, 12 - Math.abs(x));
        for (let x = 12; x <= 20; x++) put(x, 21, 13, 10);
        for (let y = 22; y < 27; y++) put(16, y, 4, 7);
      } else {                                                                // sword
        // Blade mass, a fuller, a shaped point and a real hilt. At 32px a two-pixel line is a
        // stick: an art critic could not tell a staff, a mace, a broadsword, a long sword, a club
        // and an axe apart in the shop list, and a veteran read the icons as "6x14 vertical sticks".
        const long = (it.dmg && (it.dmg.n * it.dmg.sides) >= 12);
        const half = long ? 4 : 3;
        const tip = long ? 2 : 5;
        for (let y = tip; y < 21; y++) {
          const ww = Math.min(half, y - tip);
          for (let x = -ww; x <= ww; x++) {
            // Lit left bevel, dark right bevel, bright fuller down the spine.
            const sh = x === 0 ? 14 : x < 0 ? 12 - Math.abs(x) : 7 - Math.abs(x);
            put(16 + x, y, 14, sh);
          }
        }
        for (let x = 8; x <= 24; x++) { put(x, 21, 13, 11); put(x, 22, 13, 7); }   // quilloned guard
        put(8, 20, 13, 12); put(24, 20, 13, 12);
        for (let y = 23; y < 28; y++) for (let x = -1; x <= 1; x++) put(16 + x, y, 4, 8 - Math.abs(x));
        for (let x = -2; x <= 2; x++) for (let y = 28; y <= 30; y++) {
          if (x * x + (y - 29) * (y - 29) > 5) continue;
          put(16 + x, y, 13, 12 - Math.abs(x));                                    // pommel
        }
      }
    } else if (kind === 'armour') {
      // Three genuinely different silhouettes, because plate, chain and leather priced 165g apart
      // must not be the same grey lozenge at three brightnesses.
      const ramp = it.skill === 'plate' ? 14 : it.skill === 'chain' ? 1 : 4;
      const plate = it.skill === 'plate';
      for (let y = 6; y < 27; y++) {
        const waist = plate ? 1 - Math.abs(y - 14) / 26 : 1;
        const ww = Math.max(1, Math.round((plate ? 11 : 9) * waist - (y > 22 ? (y - 22) : 0)));
        for (let x = -ww; x <= ww; x++) {
          let sh = clamp(11 - Math.round((x + ww) / (ww * 2 + 1) * 6), 3, 14);
          if (it.skill === 'chain' && ((x + y) & 1)) sh = clamp(sh - 3, 2, 14);   // mail texture
          if (plate && Math.abs(x) < 2 && y > 9) sh = clamp(sh + 2, 3, 15);       // centre ridge
          put(16 + x, y, ramp, sh);
        }
      }
      if (plate) {                                                    // pauldrons and a gorget
        for (const sgn of [-1, 1]) {
          for (let y = 5; y < 12; y++) for (let x = 0; x < 5; x++) {
            if ((x - 2) * (x - 2) + (y - 8) * (y - 8) > 12) continue;
            put(16 + sgn * (10 + x), y, 14, 13 - x);
          }
        }
        for (let x = -4; x <= 4; x++) put(16 + x, 5, 13, 12);
      } else if (it.skill === 'leather') {                            // straps and a buckle
        for (let y = 9; y < 24; y += 6) for (let x = -9; x <= 9; x++) put(16 + x, y, 13, 8);
        put(16, 15, 13, 14); put(15, 15, 13, 12); put(17, 15, 13, 12);
      }
    } else if (kind === 'potion') {
      for (let y = 10; y < 27; y++) {
        const ww = 7 - Math.abs(y - 20) / 4;
        for (let x = -ww; x <= ww; x++) put(16 + x, y, it.mana ? 12 : it.cure ? 6 : 11, 10);
      }
      for (let y = 5; y < 11; y++) for (let x = -2; x <= 2; x++) put(16 + x, y, 0, 9);
    } else if (kind === 'ring' || kind === 'amulet') {
      for (let a = 0; a < 64; a++) {
        const t = a / 64 * Math.PI * 2;
        put(16 + Math.round(Math.cos(t) * 9), 16 + Math.round(Math.sin(t) * 9), 13, 12);
      }
      put(16, 7, 12, 14);
    } else if (kind === 'quest') {
      for (let y = 8; y < 25; y++) for (let x = -8; x <= 8; x++) put(16 + x, y, 13, clamp(12 - ((x + y) & 3), 8, 15));
    } else {
      for (let y = 9; y < 24; y++) for (let x = -8; x <= 8; x++) put(16 + x, y, 4, 8);
    }

    const out = Uint8Array.from(d);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[y * w + x]) continue;
      if ((x > 0 && d[y * w + x - 1]) || (x < w - 1 && d[y * w + x + 1]) ||
          (y > 0 && d[(y - 1) * w + x]) || (y < h - 1 && d[(y + 1) * w + x])) out[y * w + x] = Core.idx(0, 2);
      // A soft drop shadow down-right of the silhouette. Steel on a brown shop plate has almost no
      // edge contrast on its own, and a shop list of near-identical grey shapes is what made six
      // weapons read as one icon.
      else if (x > 1 && y > 1 && d[(y - 2) * w + x - 2]) out[y * w + x] = Core.idx(0, 4);
    }
    return { w, h, data: out };
  }

  function icon(id) {
    const k = 'i:' + id;
    if (!cache[k]) cache[k] = paintIcon(id);
    return cache[k];
  }

  return {
    installBaked, prepareBaked, BAKED,
    creature, decor, DECOR_HEIGHT, portrait, icon, worldHeight,
    paintCreature, paintDecor, paintPortrait, paintIcon,
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Sprites;


/* ==================== 08_ui.js ==================== */
// 08_ui.js — the HUD and every screen.
// Owner: ui. Calls Core, Rules, Spellcraft, Items, Art, Sprites.
//
// GLUE CALLS RULES. Nothing here computes a price, a hit chance or a max HP; it asks Rules. If a
// formula appears in this file it is a bug by definition.
//
// Sized for touch. The framebuffer is 800x480 letterboxed to 650x390 on an iPhone 14 Pro Max in
// landscape, so a 44pt finger target is roughly 54 framebuffer pixels. Every tappable thing below
// is at least that, and text is drawn at scale 2 by default because scale 1 is unreadable on glass.

const UI = (() => {
  'use strict';

  const { clamp } = Core;
  const E = () => Engine;

  // Hit regions rebuilt every frame; the tap handler walks them newest-first.
  let regions = [];
  const reg = (id, x, y, w, h, data) => { regions.push({ id, x, y, w, h, data }); };
  const clearRegions = () => { regions = []; };
  function hit(x, y) {
    for (let i = regions.length - 1; i >= 0; i--) {
      const r = regions[i];
      if (x >= r.x && y >= r.y && x < r.x + r.w && y < r.y + r.h) return r;
    }
    return null;
  }

  const HUD = { x: 0, y: 352, w: 800, h: 128 };
  // Narrower portraits buy the width the command bar needs for labels a player can actually read.
  // 1x text does not survive the 0.8125 nearest downscale to the phone — measured, not assumed —
  // so every label the player must read is 2x now, and 2x labels need room.
  const PORTRAIT = { w: 64, h: 94, y: 356, pitch: 70, x0: 6 };

  // ---------------------------------------------------------------- hud
  function drawHUD(g, interactive) {
    const En = E();
    Art.panel(En, HUD.x, HUD.y, HUD.w, HUD.h, 13, true);
    En.hline(0, HUD.y, En.W, Core.idx(13, 11));

    // ---- party portraits
    g.party.members.forEach((ch, i) => {
      const x = PORTRAIT.x0 + i * PORTRAIT.pitch;
      const y = PORTRAIT.y;
      const active = g.active === i;
      const dead = Rules.isDead(ch);

      Art.panel(En, x - 2, y - 2, PORTRAIT.w + 4, PORTRAIT.h + 4, active ? 13 : 4, !active);
      const p = Sprites.portrait(ch.portrait, ch.cls, ch.sex);
      En.clip(x, y, PORTRAIT.w, 46);
      En.blitScaled(p, x, y, PORTRAIT.w, 52, dead ? -5 : 0);
      En.clipReset();

      // Name, then HP and SP bars. The bars are the only thing a player actually reads mid-fight,
      // so they get the width.
      Art.text(En, x + 2, y + 48, ch.name.slice(0, 5), Core.idx(0, dead ? 6 : 15), 2);
      // NUMBERS on the bars. A cold player spent fifteen minutes watching two coloured bars that
      // never moved and wrote: "I could not tell what my party is doing. To learn that Alder has
      // 31/31 HP I had to open a separate full-screen sheet." A bar shows a ratio; a player needs
      // the value, and the party bar is the only thing on screen during a fight.
      const hpMax = Math.max(1, Rules.maxHP(ch));
      Art.bar(En, x + 2, y + 66, PORTRAIT.w - 4, 13, ch.hp / hpMax, 11);
      Art.textCentredShadow(En, x + PORTRAIT.w / 2, y + 67, ch.hp + '/' + hpMax, Core.idx(0, 15), 2);
      const spMax = Rules.maxSP(ch);
      if (spMax > 0) {
        Art.bar(En, x + 2, y + 81, PORTRAIT.w - 4, 13, ch.sp / spMax, 12);
        Art.textCentredShadow(En, x + PORTRAIT.w / 2, y + 82, ch.sp + '/' + spMax, Core.idx(0, 15), 2);
      } else {
        // A flat plate where the SP bar would be, so the strip stays a grid rather than a ragged
        // edge. Level goes on it, and on the casters too — printing LV only for the one character
        // without spell points made a player assume "the others weren't levelled or weren't real".
        En.rect(x + 2, y + 81, PORTRAIT.w - 4, 13, Core.idx(13, 3));
      }
      // The level sits on the portrait's own corner. Beside a five-character name at 2x it had
      // nowhere to go and printed straight through it.
      const lvs = String(ch.level);
      En.rect(x + PORTRAIT.w - Art.textWidth(lvs, 2) - 5, y + 2, Art.textWidth(lvs, 2) + 4, 18, Core.idx(0, 2));
      Art.text(En, x + PORTRAIT.w - Art.textWidth(lvs, 2) - 3, y + 3, lvs, Core.idx(13, 15), 2);

      const cond = Rules.worstCondition(ch);
      if (cond) Art.text(En, x + 2, y + 28, cond.slice(0, 5).toUpperCase(), Core.idx(11, 13), 2);

      if (interactive) reg('pc', x - 2, y - 2, PORTRAIT.w + 4, PORTRAIT.h + 4, i);
    });

    // ---- message log
    const lx = PORTRAIT.x0 + 4 * PORTRAIT.pitch + 4;
    const lw = En.W - 6 - lx - (62 * 4 + 12 + 12);   // leaves room for the command bar
    Art.panel(En, lx, HUD.y + 6, lw, 74, 4, true);
    // Word-wrap rather than hard-truncate. Every shot in round r3 showed "Your party arri".
    const perLine = Math.floor((lw - 10) / (Art.CH_W * 2));
    // Fill the window from the NEWEST message backwards, whole messages only. Wrapping oldest-first
    // and then keeping the last four lines left the previous message's tail orphaned at the top and
    // cut the current one mid-sentence — a player read "ahead. / Nothing here. A / door is 4 paces
    // / ahead." and never saw the front of the sentence that mattered ("The water is too deep").
    const LINES = 4;
    const wrapMsg = (l) => {
      const c = l.kind === 'hit' ? Core.idx(11, 12) : l.kind === 'good' ? Core.idx(6, 12)
        : l.kind === 'sys' ? Core.idx(9, 11) : Core.idx(0, 13);
      const out = [];
      let line = '';
      for (const w of String(l.text).split(' ')) {
        if (line && (line + ' ' + w).length > perLine) { out.push([line, c]); line = w; }
        else line = line ? line + ' ' + w : w;
      }
      if (line) out.push([line, c]);
      return out;
    };
    const recent = Core.Log.tail(8);
    const shown = [];
    for (let i = recent.length - 1; i >= 0; i--) {
      const block = wrapMsg(recent[i]);
      if (shown.length && shown.length + block.length > LINES) break;
      shown.unshift(...block.slice(0, LINES));
      if (shown.length >= LINES) break;
    }
    shown.slice(0, LINES).forEach((row, i) => {
      Art.text(En, lx + 5, HUD.y + 11 + i * 17, row[0], row[1], 2);
    });

    // ---- gold, time, place
    // The clock is RIGHT-ALIGNED in the log panel. Fixed at lx+90 it collided with gold the moment
    // the party got rich: "493750g09:00".
    Art.text(En, lx + 5, HUD.y + 86, g.party.gold + 'g', Core.idx(13, 13), 2);
    const hh = Core.Clock.hhmm();
    Art.text(En, lx + lw - 8 - Art.textWidth(hh, 2), HUD.y + 86, hh, Core.idx(9, 12), 2);
    Art.text(En, lx + 5, HUD.y + 104, (g.map.town ? g.map.town.name : g.map.name).slice(0, 11), Core.idx(2, 14), 2);
    // A burning torch must be visible somewhere. "You will burn all twelve without knowing" —
    // lighting one printed a log line, consumed the item, and then nothing said it was lit or how
    // long it had left. Shortest-remaining first, and it turns red as it runs out.
    if (g.buffList) {
      g.buffList().slice(0, 2).forEach((bf, i) => {
        const bx2 = lx + 128 + i * 84;
        if (bx2 + 80 > lx + lw) return;
        Art.panel(En, bx2, HUD.y + 102, 80, 20, 13, true);
        Art.text(En, bx2 + 4, HUD.y + 104, bf.name.slice(0, 5).toUpperCase() + ' ' + bf.mins,
          Core.idx(bf.mins < 15 ? 11 : 6, 15), 1);
      });
    }

    // ---- buttons, two rows of three, each a comfortable finger target
    // Pictorial, not typographic. Six three-letter text labels in flat rectangles is the fastest
    // possible way to read as placeholder tooling, and "MNU" is a debug string.
    // Pictorial AND named. A player pressed all six to find out what they were and still could not
    // identify two of them: "none of them is a map" — the map was there, its icon was not legible.
    // A 1998 command bar could afford to be purely pictorial because you played it for forty hours;
    // a phone game gets fifteen minutes.
    // Three across, two down. Two columns of six left no room under the icon for its name, so the
    // labels printed over the pictograms. The 800px HUD has the width for a proper command bar.
    const BW = 62, BH = 55, BX = En.W - (BW * 4 + 12) - 4;
    const btns = [['sheet', 'PARTY'], ['inv', 'PACK'], ['book', 'MAGIC'],
      ['map', 'MAP'], ['journal', 'QUEST'], ['rest', 'CAMP'], ['menu', 'MENU']];
    btns.forEach(([id, label], i) => {
      const bx = BX + (i % 4) * (BW + 4);
      const by = HUD.y + 4 + Math.floor(i / 4) * (BH + 4);
      Art.button(En, bx, by, BW, BH, null, g.pressed === id, 2);
      Art.hudIcon(En, id, bx + 19, by + 2, 2);
      const lw3 = Art.textWidth(label, 2);
      En.rect(Math.round(bx + BW / 2 - lw3 / 2) - 3, by + BH - 21, lw3 + 6, 19, Core.idx(13, 3));
      Art.textCentred(En, bx + BW / 2, by + BH - 19, label, Core.idx(0, 15), 2);
      if (interactive) reg('btn', bx, by, BW, BH, id);
    });
  }

  // ---------------------------------------------------------------- touch controls
  // Drawn in the CARVED CHROME either side of the viewport, never over the world. Movement under
  // the left thumb, verbs under the right, which is also where they fall when the phone is held in
  // landscape. Nothing here overlaps a single pixel of the 3D view.
  function drawTouchControls(g) {
    const En = E(), L = En.CHROME_L, R = En.CHROME_R;

    // ---- movement cluster, bottom of the left column
    const bw = 80, bh = 34, gap = 3;
    const mx = L.x + 4;
    const my = L.y + L.h - (bh * 4 + gap * 3) - 6;
    const half = (bw - gap) >> 1;
    // STRAFE, because MM6 taught you to sidestep in the first dungeon and this build wedges you
    // into corners constantly. A veteran: "when you wedge yourself in a corner your only recourse
    // is to back out the way you came." Turn on the middle row, sidestep on the row below it.
    const moves = [
      ['fwd', mx, my, bw, bh, 'up'],
      ['turnL', mx, my + bh + gap, half, bh, 'left'],
      ['turnR', mx + half + gap, my + bh + gap, half, bh, 'right'],
      ['strafeL', mx, my + (bh + gap) * 2, half, bh, 'sideL'],
      ['strafeR', mx + half + gap, my + (bh + gap) * 2, half, bh, 'sideR'],
      ['back', mx, my + (bh + gap) * 3, bw, bh, 'down'],
    ];
    for (const [id, x, y, w, h, glyph] of moves) {
      const down = !!g.keys[id] || (g.keyLatch && g.keyLatch[id] > 0);
      Art.button(En, x, y, w, h, null, down, 2);
      Art.arrowGlyph(En, x + w / 2, y + h / 2 - (glyph === 'left' || glyph === 'right' ? 3 : 0),
        glyph, Core.idx(13, down ? 15 : 13));
      // The turn buttons say TURN. Belt and braces after a player lost a whole session to believing
      // they were strafe controls.
      if (glyph === 'left' || glyph === 'right') {
        Art.textCentred(En, x + w / 2, y + h - 11, 'TURN', Core.idx(13, down ? 15 : 11), 1);
      } else if (glyph === 'sideL' || glyph === 'sideR') {
        Art.textCentred(En, x + w / 2, y + h - 11, 'STEP', Core.idx(13, down ? 15 : 11), 1);
      }
      reg('move', x, y, w, h, id);
    }
    Art.textCentred(En, L.x + L.w / 2, my - 21, 'MOVE', Core.idx(13, 12), 2);

    // ---- verbs, bottom of the right column
    // FIXED SLOTS. The verbs used to be stacked from the bottom up and re-laid-out whenever combat
    // started or ended, so ATK and USE shared a screen position: a player spamming ATK killed a rat
    // and their next tap — same pixel, no warning — opened a tavern. Nothing may move under a
    // thumb that is already pressing it. Every verb has one home; unavailable ones are drawn
    // greyed rather than removed.
    const vx = R.x + 4;
    const fighting = g.combat.active || g.turnBased;
    const slot = (i) => R.y + R.h - 8 - (i + 1) * bh - i * gap;
    const verb = (id, label, live, row) => {
      const y = slot(row);
      Art.button(En, vx, y, bw, bh, label, live && g.pressed === id, 2);
      if (!live) {
        // A dimming wash, so a dead verb reads as unavailable rather than as missing.
        for (let yy = y + 1; yy < y + bh - 1; yy += 2) En.hline(vx + 1, yy, bw - 2, Core.idx(0, 3));
      }
      if (live) reg(id, vx, y, bw, bh, id);
    };
    // USE IS ALWAYS LIVE. Making it conditional on "no enemy nearby" locked the player out of every
    // building in a town where monsters roam: a veteran stood on the exact tile that had opened the
    // tavern ten minutes earlier, pressed the same button, and got "Dorn hits the Grey Wolf for 4"
    // because a rat had wandered within twelve units. "You are wounded, you run for the temple, and
    // the temple stops existing because a rat followed you." A verb that vanishes when you need it
    // most is worse than no verb.
    verb('use', 'USE', true, 0);
    verb('act', 'ATK', fighting, 1);
    verb('cast', 'CAST', fighting, 2);
    verb('wait', 'WAIT', fighting, 3);
    const ty = slot(4);
    Art.button(En, vx, ty, bw, bh, g.turnBased ? 'REAL' : 'TURN', g.turnBased, 2);
    reg('turnbased', vx, ty, bw, bh, 1);
    Art.textCentred(En, R.x + R.w / 2, ty - 21, 'ACT', Core.idx(13, 12), 2);
  }


  // Who is up, and what is in front of you. A veteran played forty minutes and wrote: "no enemy
  // health, no enemy name on screen, no target indicator, no indication of which of your four is
  // swinging... a 1998 player cannot make a single tactical decision here."
  function combatReadout(g) {
    const En = E(), V = En.VIEW;
    const foe = g.nearestFoe ? g.nearestFoe(14) : null;
    if (foe) {
      const name = foe.name || 'Enemy';
      const w = Math.max(150, Art.textWidth(name, 2) + 24);
      const x = V.x + ((V.w - w) >> 1), y = V.y + 6;
      Art.panel(En, x, y, w, 40, 13, true);
      Art.textCentred(En, x + w / 2, y + 3, name, Core.idx(0, 15), 2);
      Art.bar(En, x + 8, y + 21, w - 16, 14, foe.hp / Math.max(1, foe.maxHp), 11);
      Art.textCentredShadow(En, x + w / 2, y + 21, foe.hp + '/' + foe.maxHp, Core.idx(0, 15), 2);
    }
    if (!g.turnBased) return;
    // Turn banner: whose turn, which round, and who is still to act.
    const bw2 = 210, bx = V.x + V.w - bw2 - 6, by = V.y + 6;
    Art.panel(En, bx, by, bw2, 46, 13, true);
    const who = g.party.members[g.active];
    Art.text(En, bx + 8, by + 2, 'ROUND ' + (g.tbRound || 1), Core.idx(13, 14), 2);
    Art.text(En, bx + 8, by + 22, who ? who.name.toUpperCase() : '', Core.idx(0, 15), 2);
    g.party.members.forEach((c, i) => {
      const px2 = bx + bw2 - 12 - (3 - i) * 12;
      En.rect(px2, by + 5, 9, 9, Core.idx(g.acted && g.acted[i] ? 0 : 6, g.acted && g.acted[i] ? 5 : 12));
    });
  }

  // ---------------------------------------------------------------- screens
  // Panels cover the HUD portraits, and several screens are per-character. Give them their own
  // selector rather than relying on a strip the panel is sitting on top of.
  function pcSelector(g, x, y) {
    const En = E();
    g.party.members.forEach((ch, i) => {
      const bx = x + i * 92;
      const on = g.active === i;
      Art.button(En, bx, y, 88, 30, ch.name.slice(0, 7).toUpperCase(), on, 2);
      if (Rules.isDead(ch)) En.frameRect(bx, y, 88, 30, Core.idx(11, 12));
      reg('pc', bx, y, 88, 30, i);
    });
    return y + 36;
  }

  function screenFrame(title, w, h) {
    const En = E();
    const x = (E().W - w) >> 1, y = (E().H - h) >> 1;
    Art.panel(En, x, y, w, h, 13, false);
    Art.panel(En, x + 6, y + 6, w - 12, h - 12, 4, true);
    Art.textCentred(En, x + w / 2, y + 14, title, Core.idx(13, 14), 2);
    En.hline(x + 14, y + 34, w - 28, Core.idx(13, 9));
    // Close button, large enough to hit without aiming.
    Art.button(En, x + w - 52, y + 8, 44, 26, 'X', false, 2);
    reg('close', x + w - 52, y + 8, 44, 26, 1);
    return { x, y, w, h, inner: y + 42 };
  }

  function charSheet(g) {
    const En = E();
    const f = screenFrame('CHARACTER', 600, 430);
    pcSelector(g, f.x + 20, f.y + 44);
    const ch = g.party.members[g.active];
    const p = Sprites.portrait(ch.portrait, ch.cls, ch.sex);
    En.blitScaled(p, f.x + 20, f.inner + 40, 96, 108, 0);

    let y = f.inner + 40;
    Art.text(En, f.x + 130, y, ch.name, Core.idx(13, 14), 2); y += 22;
    Art.text(En, f.x + 130, y, Rules.CLASSES[ch.cls].name + '  Level ' + ch.level, Core.idx(0, 13), 2); y += 20;
    Art.text(En, f.x + 130, y, 'XP ' + ch.xp + ' / ' + Rules.xpForLevel(ch.level + 1), Core.idx(2, 12), 2); y += 20;
    Art.text(En, f.x + 130, y, 'HP ' + ch.hp + '/' + Rules.maxHP(ch) +
      '   SP ' + ch.sp + '/' + Rules.maxSP(ch), Core.idx(0, 13), 2); y += 20;
    Art.text(En, f.x + 130, y, 'AC ' + g.acOf(ch) + '   Skill pts ' + ch.skillPts, Core.idx(0, 13), 2);

    // Stats in two columns.
    y = f.inner + 164;
    Rules.STATS.forEach((s, i) => {
      const cx = f.x + 24 + (i % 2) * 260;
      const cy = y + Math.floor(i / 2) * 22;
      const v = Rules.effStat(ch, s);
      const b = Rules.statBonus(v);
      Art.text(En, cx, cy, Rules.STAT_NAME[s], Core.idx(0, 11), 2);
      Art.text(En, cx + 150, cy, String(v), Core.idx(13, 14), 2);
      Art.text(En, cx + 192, cy, (b >= 0 ? '+' : '') + b, Core.idx(b >= 0 ? 6 : 11, 12), 2);
    });

    // Skills, scrollable-free: only trained ones are listed, which is always few enough to fit.
    y = f.inner + 164 + 92;
    Art.text(En, f.x + 24, y, 'SKILLS', Core.idx(13, 13), 2); y += 20;
    const trained = Object.keys(ch.skills).filter((k) => ch.skills[k].mastery > 0);
    trained.slice(0, 12).forEach((k, i) => {
      const cx = f.x + 24 + (i % 3) * 190;
      const cy = y + Math.floor(i / 3) * 22;
      Art.text(En, cx, cy, Rules.SKILLS[k].name.slice(0, 9) + ' ' + ch.skills[k].lvl +
        Rules.MASTERY_NAME[ch.skills[k].mastery].slice(0, 1), Core.idx(0, 13), 2);
    });
  }

  function inventory(g) {
    const En = E();
    const f = screenFrame('INVENTORY', 740, 440);
    pcSelector(g, f.x + 20, f.y + 44);
    const ch = g.party.members[g.active];

    // Paperdoll on the left: slots as boxes, equipped items as icons.
    // Each well is NAMED, in words, under the well. Three-letter codes were reported twice: "the
    // equipment slots are labelled HLM, AMU, CLK, GNT, BLT, OFF, BOW, BTS, RNG — I can guess helm
    // and gauntlets, I have no idea what OFF or BTS are." The 800px frame has the room now.
    // TWO FLANKING COLUMNS with the figure between them. A three-column grid puts wells straight
    // over the body, and a paperdoll whose figure is hidden behind its own slots is just a grid
    // again — which is what an art critic said the first version was: "there is no body, no figure,
    // no armour silhouette, just twelve labelled boxes. The entire point of the paperdoll is the
    // figure; it is missing."
    const CW = 170;                                  // gap between the two columns
    const SLOTS = [
      ['helm', 0, 0, 'HELM'], ['amulet', CW, 0, 'AMULET'],
      ['cloak', 0, 56, 'CLOAK'], ['gaunt', CW, 56, 'GLOVES'],
      ['armour', 0, 112, 'ARMOUR'], ['offhand', CW, 112, 'SHIELD'],
      ['weapon', 0, 168, 'WEAPON'], ['bow', CW, 168, 'BOW'],
      ['belt', 0, 224, 'BELT'], ['ring1', CW, 224, 'RING'],
      ['boots', 0, 280, 'BOOTS'],
    ];
    const px0 = f.x + 22, py0 = f.inner + 34;

    // A BODY behind the slots. The entire point of a paperdoll is the figure, and twelve labelled
    // boxes in a loose cross is not one.
    // The figure sits BEHIND and DARKER than the wells, a silhouette rather than a diagram. Drawn
    // at full value it covered the slot names it is meant to sit behind.
    {
      const bx = px0 + 23 + CW / 2, by = py0 + 12;
      const S = 2.2;                                 // the figure fills the gap between the columns
      const lim = (x, y, w2, h2, sh) => En.rect(Math.round(bx + x * S), Math.round(by + y * S),
        Math.round(w2 * S), Math.round(h2 * S), Core.idx(4, sh));
      // A recessed alcove for the figure to stand in.
      En.rect(bx - 52, by - 6, 104, 296, Core.idx(0, 2));
      En.frameRect(bx - 52, by - 6, 104, 296, Core.idx(13, 7));
      lim(-8, 0, 16, 17, 9);                        // head
      lim(-5, 16, 10, 5, 7);                        // neck
      lim(-15, 20, 30, 38, 8);                      // torso
      lim(-24, 23, 9, 32, 5);                       // arms, set back from the torso
      lim(15, 23, 9, 32, 4);
      lim(-13, 57, 11, 38, 6);                      // legs
      lim(2, 57, 11, 38, 5);
      lim(-15, 94, 13, 7, 3);                       // feet
      lim(2, 94, 13, 7, 3);
      lim(-7, 2, 14, 6, 6);                         // hair line, so the head has a top
      // A light from the upper left, so the figure has a form rather than being a flat cutout.
      En.rect(Math.round(bx - 15 * S), Math.round(by + 20 * S), Math.round(6 * S), Math.round(38 * S), Core.idx(4, 11));
      En.rect(Math.round(bx - 8 * S), Math.round(by), Math.round(6 * S), Math.round(17 * S), Core.idx(4, 12));
    }

    for (const [slot, ox, oy, label] of SLOTS) {
      const x = px0 + ox, y = py0 + oy;
      const it = ch.equip[slot];
      // A visible RECESSED well, whether or not something is in it. Painted the same brown as the
      // panel behind it, an empty slot reads as a hole and its name floats unattached.
      En.rect(x, y, 46, 46, Core.idx(0, it ? 4 : 2));
      En.hline(x, y, 46, Core.idx(0, 1)); En.vline(x, y, 46, Core.idx(0, 1));
      En.hline(x, y + 45, 46, Core.idx(13, 8)); En.vline(x + 45, y, 46, Core.idx(13, 8));
      En.frameRect(x - 1, y - 1, 48, 48, Core.idx(13, it ? 12 : 7));
      if (it) En.blitScaled(Sprites.icon(it.id), x + 3, y + 3, 40, 40, 0);
      // A knocked-out plate behind the label. At 1x on a textured panel the glyphs lost strokes —
      // a critic read AMULET as "FMULCT", GLOVES as "FLNUFS" and CLOAK as "C ?K".
      const lw2 = Art.textWidth(label, 1);
      En.rect(Math.round(x + 23 - lw2 / 2) - 2, y + 46, lw2 + 4, 10, Core.idx(0, 2));
      Art.textCentred(En, x + 23, y + 47, label, Core.idx(13, it ? 15 : 13), 1);
      reg('equip', x, y, 46, 46, slot);
    }

    // Pack grid on the right.
    const gx = f.x + 320, gy = f.inner + 58;
    Art.text(En, gx, gy - 20, 'PACK  ' + ch.pack.length + '/30', Core.idx(13, 14), 2);
    for (let i = 0; i < 30; i++) {
      const x = gx + (i % 6) * 58, y = gy + Math.floor(i / 6) * 52;
      Art.panel(En, x, y, 54, 48, 4, true);
      const st = ch.pack[i];
      if (st) {
        En.blitScaled(Sprites.icon(st.id), x + 11, y + 8, 32, 32, 0);
        if ((st.qty || 1) > 1) Art.text(En, x + 3, y + 36, String(st.qty), Core.idx(13, 14), 1);
        if (Items.isQuest(st)) En.frameRect(x, y, 54, 48, Core.idx(13, 13));
        reg('item', x, y, 54, 48, i);
      }
    }

    const sel = g.selectedItem;
    if (sel !== null && ch.pack[sel]) {
      const st = ch.pack[sel];
      // The detail bar starts where the paperdoll column ENDS. Spanning the full panel width put
      // it straight over the BOOTS well and half of BELT, so selecting an item hid two slots.
      const dx0 = f.x + 240;
      Art.panel(En, dx0, f.y + f.h - 62, f.x + f.w - 14 - dx0, 48, 4, true);
      Art.text(En, dx0 + 8, f.y + f.h - 56, Items.displayName(st), Core.idx(13, 14), 2);
      const it = Items.def(st);
      const line = (it.dmg ? 'Dmg ' + it.dmg.n + 'd' + it.dmg.sides + (it.dmg.plus ? '+' + it.dmg.plus : '') + '  ' : '') +
        (it.ac ? 'AC ' + it.ac + '  ' : '') + (it.heal ? 'Heals ' + it.heal + '  ' : '') + 'Value ' + Items.unitValue(st) + 'g each';
      Art.text(En, dx0 + 8, f.y + f.h - 36, line, Core.idx(0, 12), 2);
      // USE is the verb the game was missing entirely: eight healing potions the party could not
      // drink, offered only EQUIP and DROP.
      const usable = it && (it.kind === 'potion' || it.kind === 'food' || (it.kind === 'tool' && it.light));
      if (usable) {
        Art.button(En, f.x + f.w - 290, f.y + f.h - 56, 84, 38, 'USE', false, 2);
        reg('usepack', f.x + f.w - 290, f.y + f.h - 56, 84, 38, sel);
      } else if (it && it.slot) {
        Art.button(En, f.x + f.w - 290, f.y + f.h - 56, 84, 38, 'EQUIP', false, 2);
        reg('doequip', f.x + f.w - 290, f.y + f.h - 56, 84, 38, sel);
      }
      Art.button(En, f.x + f.w - 108, f.y + f.h - 56, 84, 38, 'DROP', false, 2);
      reg('drop', f.x + f.w - 108, f.y + f.h - 56, 84, 38, sel);
    }
  }

  function spellbook(g) {
    const En = E();
    const f = screenFrame('SPELLBOOK', 600, 430);
    pcSelector(g, f.x + 20, f.y + 44);
    const ch = g.party.members[g.active];

    // ONLY the schools this class can ever use. A Knight whose own description says "No magic at
    // all" was shown nine schools, four tiers each, every entry marked "not learned" — thirty-six
    // promises the class can never keep.
    const usable = Spellcraft.SCHOOL_IDS.filter((sc) => Rules.classCap(ch.cls, sc) > 0);
    if (!usable.length) {
      Art.text(En, f.x + 24, f.inner + 40, ch.name + ' works no magic.', Core.idx(13, 14), 2);
      Art.text(En, f.x + 24, f.inner + 66, Rules.CLASSES[ch.cls].name + 's never learn a spell.', Core.idx(0, 13), 2);
      Art.text(En, f.x + 24, f.inner + 92, 'Pick a caster from the tabs above.', Core.idx(0, 12), 2);
      return;
    }
    // School tabs down the left.
    usable.forEach((s, i) => {
      const x = f.x + 16, y = f.inner + 40 + i * 38;
      const cap = Rules.classCap(ch.cls, s);
      const on = g.bookSchool === s;
      // ORDER MATTERS. The hatch used to be drawn AFTER the label, so its 2px-pitch scanlines ran
      // straight through the letterforms at the same pitch as the font stroke: EARTH read "FARTH",
      // MIND read "MINU", BODY read "BUUY". Plate first, then hatch, then a knocked-out solid
      // panel behind the glyphs, then the glyphs.
      Art.button(En, x, y, 96, 34, null, on, 2);
      if (!on) En.frameRect(x, y, 96, 34, Core.idx(13, 10));
      if (cap === 0) {
        // Unavailable schools are HATCHED, not dimmed — dim is indistinguishable from unselected.
        for (let yy = y + 1; yy < y + 33; yy += 3) En.hline(x + 1, yy, 94, Core.idx(0, 3));
      }
      const label = Spellcraft.SCHOOLS[s].name.toUpperCase().slice(0, 6);
      const lw = Art.textWidth(label, 2);
      En.rect(x + 4, y + 7, lw + 4, 20, Core.idx(13, on ? 6 : 3));
      Art.text(En, x + 6, y + 9, label, Core.idx(0, on ? 15 : 14), 2);
      reg('school', x, y, 96, 34, s);
    });

    const school = g.bookSchool || 'fire';
    const all = Spellcraft.bySchool(school);
    const page = g.bookPage || 0;
    const ids = all.slice(page * 4, page * 4 + 4);
    Art.button(En, f.x + f.w - 150, f.y + f.h - 46, 60, 34, '<', false, 2);
    reg('bookpage', f.x + f.w - 150, f.y + f.h - 46, 60, 34, -1);
    Art.button(En, f.x + f.w - 84, f.y + f.h - 46, 60, 34, '>', false, 2);
    reg('bookpage', f.x + f.w - 84, f.y + f.h - 46, 60, 34, 1);
    Art.text(En, f.x + f.w - 250, f.y + f.h - 38, 'TIER ' + (page * 4 + 1) + '-' + Math.min(11, page * 4 + 4), Core.idx(13, 13), 2);
    ids.forEach((id, i) => {
      const sp = Spellcraft.SPELLS[id];
      const x = f.x + 130, y = f.inner + 40 + i * 76;
      const known = ch.spells && ch.spells[id];
      const can = Spellcraft.canCast(ch, id, { underground: g.map.kind === 'dungeon' });
      Art.panel(En, x, y, f.w - 160, 68, can.ok ? 13 : 4, !can.ok);
      Art.text(En, x + 10, y + 8, sp.name, Core.idx(13, can.ok ? 14 : 9), 2);
