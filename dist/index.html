  function bridge(m, x0, y0, x1, y1, deckH) {
    const steps = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0)));
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const x = Math.round(lerp(x0, x1, t)), y = Math.round(lerp(y0, y1, t));
      for (let w = -1; w <= 1; w++) {
        addSpan(m, x + (y0 === y1 ? 0 : w), y + (y0 === y1 ? w : 0), deckH - 0.55, deckH, MAT.stonewall);
      }
    }
    // Viewed from side-on and a little back, which is the only angle a bridge reads from.
    const mx = Math.round((x0 + x1) / 2), my = Math.round((y0 + y1) / 2);
    const alongY = Math.abs(y1 - y0) > Math.abs(x1 - x0);
    landmark(m, 'bridge', alongY ? mx + 9 : mx, alongY ? my : my + 9, alongY ? Math.PI : -Math.PI / 2, mx, my);
  }

  // A gate arch: solid overhead, walkable underneath. `lo` must leave the party's 1.6 headroom.
  function gateArch(m, x, y, dir, groundH, townX, townY) {
    const lo = groundH + 2.6, hi = groundH + 6.4;
    for (let w = -1; w <= 1; w++) {
      addSpan(m, x + (dir === 'ns' ? w : 0), y + (dir === 'ns' ? 0 : w), lo, hi, MAT.stonewall);
    }
    // Stand back OUTSIDE the wall and look through the opening, so the arch is the subject.
    const out = 7;
    // Stand OUTSIDE the wall, on the line from the town centre through the gate, and look back at
    // it. Offsetting along a fixed axis instead put the camera on the wall ring itself — every one
    // of the four gate poses resolved to an impassable cell, and the "east gate at dusk" shot came
    // back as a stone face receding into the distance with no gate anywhere in it.
    if (townX === undefined) return;
    const ox = x - townX, oy = y - townY;
    const ol = Math.hypot(ox, oy) || 1;
    const back = out + 6;
    const px = Math.round(x + (ox / ol) * back), py = Math.round(y + (oy / ol) * back);
    landmark(m, 'gate', px, py, Math.atan2(y - py, x - px), x, y);
  }

  // A cave mouth: an overhang above a tunnel entrance, so a dungeon portal reads as a dark opening
  // in rock instead of a door standing in a field.
  function caveMouth(m, x, y, groundH) {
    for (let dy = -2; dy <= 0; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        addSpan(m, x + dx, y + dy, groundH + 2.4, groundH + 9 + Math.abs(dx), MAT.cliff);
      }
    }
    landmark(m, 'cave', x, y + 10, -Math.PI / 2, x, y);
  }

  // ---------------------------------------------------------------- settlements
  function building(m, x, y, w, h, storeys, wallMat, rng) {
    const gh = H(m, x + w / 2, y + h / 2);
    flatten(m, Math.round(x + w / 2), Math.round(y + h / 2), Math.ceil(w / 2) + 1, Math.ceil(h / 2) + 1, gh, 2);
    for (let cy = y; cy < y + h; cy++) {
      for (let cx = x; cx < x + w; cx++) {
        if (!inb(m, cx, cy)) continue;
        const edge = cx === x || cy === y || cx === x + w - 1 || cy === y + h - 1;
        if (edge) {
          m.cells[cy * m.w + cx] = wallMat | SOLID;
          m.storeys[cy * m.w + cx] = storeys;
        } else {
          m.cells[cy * m.w + cx] = MAT.wood;
        }
      }
    }
    return { x, y, w, h, storeys, gh };
  }

  // Lay out a settlement: plaza, ring of buildings, shop fronts, wall and gates for a city.
  function settlement(m, cx, cy, size, regionId, rng) {
    const plazaR = size === 'city' ? 6 : size === 'village' ? 4 : 3;
    const gh = H(m, cx, cy);
    flatten(m, cx, cy, plazaR + 2, plazaR + 2, gh, 5);

    for (let y = cy - plazaR; y <= cy + plazaR; y++) {
      for (let x = cx - plazaR; x <= cx + plazaR; x++) {
        if (inb(m, x, y)) m.cells[y * m.w + x] = MAT.plaza;
      }
    }
    m.decor.push({ kind: 'fountain', x: cx + 0.5, y: cy + 0.5, z: gh });

    const nShops = size === 'city' ? 8 : size === 'village' ? 5 : 3;
    const shops = [];
    const ring = plazaR + 4;
    for (let i = 0; i < nShops; i++) {
      const a = (i / nShops) * Math.PI * 2 + rng.float(-0.12, 0.12);
      const bx = Math.round(cx + Math.cos(a) * (ring + rng.int(3)));
      const by = Math.round(cy + Math.sin(a) * (ring + rng.int(3)));
      const bw = 5 + rng.int(3), bh = 4 + rng.int(3);
      // Storey variation is what stops a town reading as a grid of identical boxes.
      const st = size === 'city' ? 1 + rng.int(3) : 1 + rng.int(2);
      const mat = rng.pick([MAT.timberwall, MAT.plaster, MAT.brickwall, MAT.stonewall]);
      const b = building(m, bx - (bw >> 1), by - (bh >> 1), bw, bh, st, mat, rng);
      const kind = SHOP_KINDS[i % SHOP_KINDS.length];
      shops.push({ kind, x: bx, y: by, b });
      // A door cell facing the plaza, with a sign.
      const dx = Math.sign(cx - bx), dy = Math.sign(cy - by);
      const doorX = bx + (Math.abs(dx) > Math.abs(dy) ? dx * ((bw >> 1)) : 0);
      const doorY = by + (Math.abs(dx) > Math.abs(dy) ? 0 : dy * ((bh >> 1)));
      m.portals.push({
        x: doorX, y: doorY, to: 'shop:' + kind, kind: 'door',
        tx: doorX + dx, ty: doorY + dy, tang: 0, shop: kind, region: regionId,
      });
      // Sign BESIDE the door, not on top of it: both stand on the ground, and stacked at the same
      // spot the taller door simply erased the sign that says what the shop sells.
      m.decor.push({
        kind: 'sign', shop: kind,
        x: doorX + 0.5 + (Math.abs(dx) > Math.abs(dy) ? dx * 0.35 : 1.1),
        y: doorY + 0.5 + (Math.abs(dx) > Math.abs(dy) ? 1.1 : dy * 0.35),
      });
      // The door itself, drawn. Leaving the doorway as a bare gap in a wall made every building a
      // featureless block; a player walked a town twice and found one entrance by accident.
      m.decor.push({ kind: 'door', x: doorX + 0.5, y: doorY + 0.5, z: b.gh, shop: kind });
      setCell(m, doorX, doorY, MAT.wood);
    }

    // A MARKET ROW along one edge of the plaza. Three review rounds asked for the market shot and
    // got two blank walls: "there is no market." A town square with nothing being sold in it is a
    // courtyard, and MM6 taught its towns by what was standing in them.
    if (size !== 'hamlet') {
      const mrY = cy - plazaR + 1;
      const nStall = size === 'city' ? 6 : 4;
      for (let i = 0; i < nStall; i++) {
        const sx = cx - ((nStall - 1) * 1.6) / 2 + i * 1.6;
        const gh2 = H(m, sx, mrY);
        m.decor.push({ kind: 'stall', x: sx, y: mrY + 0.5, z: gh2, variant: i % 3 });
        if (i % 2 === 0) m.decor.push({ kind: 'crate', x: sx + 0.7, y: mrY + 1.4, z: gh2 });
        else m.decor.push({ kind: 'barrel', x: sx + 0.7, y: mrY + 1.4, z: gh2 });
      }
      // Looked at along the row from one end and a few cells back, so the awnings overlap into a
      // real market read instead of one stall filling the frame.
      // Stand INSIDE the plaza, on the far side, looking back along the row. Outside the plaza is
      // a ring of buildings, and the first attempt put the camera inside one of them.
      const mcx = cx - plazaR + 1, mcy = cy + plazaR - 2;
      landmark(m, 'market', mcx, mcy, Math.atan2(mrY - mcy, (cx + 2) - mcx));
    }
    // Corner of the plaza looking across it into the ring of buildings: the widest read a town has.
    landmark(m, 'plaza', cx - plazaR + 1, cy + plazaR - 1, Math.atan2(-1.4, 1));

    // Houses that are pure dressing: a settlement of only shops reads as a strip mall.
    const nHouses = size === 'city' ? 16 : size === 'village' ? 8 : 4;
    for (let i = 0; i < nHouses; i++) {
      const a = rng.float(0, Math.PI * 2), d = ring + 2 + rng.int(Math.max(1, (size === 'city' ? 2 : 14)));
      const bx = Math.round(cx + Math.cos(a) * d), by = Math.round(cy + Math.sin(a) * d);
      if (!inb(m, bx - 3, by - 3) || !inb(m, bx + 4, by + 4)) continue;
      let clear = true;
      for (let y = by - 4; y <= by + 4 && clear; y++) {
        for (let x = bx - 4; x <= bx + 4; x++) if (isSolid(cellAt(m, x, y))) { clear = false; break; }
      }
      if (!clear) continue;
      const hw = 4 + rng.int(3), hh = 4 + rng.int(2);
      const hb = building(m, bx - 2, by - 2, hw, hh, 1 + rng.int(2),
        rng.pick([MAT.timberwall, MAT.plaster]), rng);
      // Houses get a drawn door too, standing against the plaza-facing wall. They open on nothing —
      // they are dressing — but a town whose houses have no doors reads as a stack of crates, and
      // the doors are most of what tells a player which way the town centre is.
      const hdx = cx - bx, hdy = cy - by;
      const hx = Math.abs(hdx) > Math.abs(hdy) ? bx - 2 + (hdx > 0 ? hw + 0.05 : -0.05) : bx - 2 + hw / 2;
      const hy = Math.abs(hdx) > Math.abs(hdy) ? by - 2 + hh / 2 : by - 2 + (hdy > 0 ? hh + 0.05 : -0.05);
      if (inb(m, Math.floor(hx), Math.floor(hy)) && !isSolid(cellAt(m, Math.floor(hx), Math.floor(hy)))) {
        m.decor.push({ kind: 'door', x: hx, y: hy, z: hb ? hb.gh : H(m, hx, hy) });
      }
    }

    // City wall with gate arches. The gates are the s03 shot.
    if (size === 'city') {
      const wr = ring + 4;   // gate lands at x = cx + 14, which is what s03/s04 are framed against
      for (let y = cy - wr; y <= cy + wr; y++) {
        for (let x = cx - wr; x <= cx + wr; x++) {
          if (!inb(m, x, y)) continue;
          const onEdge = Math.abs(Math.abs(x - cx) - wr) < 1 || Math.abs(Math.abs(y - cy) - wr) < 1;
          const inside = Math.abs(x - cx) <= wr && Math.abs(y - cy) <= wr;
          if (onEdge && inside) {
            m.cells[y * m.w + x] = MAT.stonewall | SOLID;
            m.storeys[y * m.w + x] = 2;
          }
        }
      }
      // Four gates, each an ARCH: walk under, wall solid overhead.
      const gates = [[cx + wr, cy, 'ns'], [cx - wr, cy, 'ns'], [cx, cy + wr, 'ew'], [cx, cy - wr, 'ew']];
      for (const [gx, gy, dir] of gates) {
        for (let w = -1; w <= 1; w++) {
          const px = gx + (dir === 'ns' ? 0 : w), py = gy + (dir === 'ns' ? w : 0);
          setCell(m, px, py, MAT.road);
          setStoreys(m, px, py, 0);
        }
        gateArch(m, gx, gy, dir, H(m, gx, gy), cx, cy);
        m.decor.push({ kind: 'brazier', x: gx + 0.5, y: gy + 0.5, z: H(m, gx, gy) });
      }
      m.gates = gates.map(([x, y]) => ({ x, y }));
    }

    return { cx, cy, shops, plazaR };
  }

  // ---------------------------------------------------------------- outdoor region
  function buildRegion(id) {
    const r = REGIONS[id];
    const rng = RNG.world('region:' + id);
    const m = blankMap(id, r.name, 'outdoor', RW, RH);
    m.region = id;
    m.terrain = makeTerrain(id, RW, RH);
    m.sea = r.sea;
    m.level = r.level;
    m.biome = r.biome;
    m.spawnTable = r.spawn.slice();

    // Ground material from height and biome. Water is "below level", never a painted tile.
    const base = { temperate: MAT.grass, coast: MAT.sand, highland: MAT.gravel, volcanic: MAT.ash,
      marsh: MAT.marsh, snow: MAT.snow, forest: MAT.moss, barrow: MAT.grass, blighted: MAT.ash }[r.biome];
    for (let y = 0; y < RH; y++) {
      for (let x = 0; x < RW; x++) {
        const h = H(m, x + 0.5, y + 0.5);
        let mat = base;
        if (h < r.sea) mat = MAT.water;
        else if (h < r.sea + 1.2 && (r.biome === 'coast' || r.biome === 'marsh')) mat = MAT.sand;
        else if (h > 16) mat = r.biome === 'snow' || r.biome === 'highland' ? MAT.snow : MAT.rock;
        else if (h > 9) mat = MAT.rock;
        m.cells[y * RW + x] = mat;
      }
    }

    // Cliff walls where the slope is impassable: terrain fences the valley instead of an invisible
    // wall the player bumps into.
    for (let y = 0; y < RH; y++) {
      for (let x = 0; x < RW; x++) {
        const h = H(m, x + 0.5, y + 0.5);
        const hx = Math.abs(H(m, x + 1.5, y + 0.5) - h);
        const hy = Math.abs(H(m, x + 0.5, y + 1.5) - h);
        if (Math.max(hx, hy) > MAX_CLIMB * 2.2 && h > r.sea) {
          m.cells[y * RW + x] = MAT.cliff | SOLID;
          m.storeys[y * RW + x] = 1;
        }
      }
    }

    // Edge exits to neighbouring regions, at the middle of each shared edge.
    const nb = neighbours(id);
    const exits = [];
    for (const n of nb) {
      const p = n.dir === 'e' ? [RW - 2, RH >> 1] : n.dir === 'w' ? [1, RH >> 1]
        : n.dir === 's' ? [RW >> 1, RH - 2] : [RW >> 1, 1];
      const back = { e: 'w', w: 'e', n: 's', s: 'n' }[n.dir];
      const tp = back === 'e' ? [RW - 5, RH >> 1] : back === 'w' ? [4, RH >> 1]
        : back === 's' ? [RW >> 1, RH - 5] : [RW >> 1, 4];
      // Carve a pass through the rim so the exit is reachable.
      flatten(m, p[0], p[1], 3, 3, Math.min(H(m, p[0], p[1]), 2.0), 7);
      exits.push({ dir: n.dir, x: p[0], y: p[1], to: n.id, tx: tp[0], ty: tp[1] });
      m.portals.push({
        x: p[0], y: p[1], to: n.id, kind: 'edge',
        tx: tp[0], ty: tp[1], tang: n.dir === 'e' ? 0 : n.dir === 'w' ? Math.PI : n.dir === 's' ? Math.PI / 2 : -Math.PI / 2,
        locked: REGIONS[n.id].gated || null,
      });
    }

    // Settlement, then roads from it to every exit.
    let town = null;
    if (r.town) {
      town = settlement(m, RW >> 1, RH >> 1, r.townSize, id, rng);
      m.town = { name: r.town, x: town.cx, y: town.cy, size: r.townSize, shops: town.shops };
      for (const e of exits) road(m, [[town.cx, town.cy], [e.x, e.y]], r.townSize === 'city' ? 2 : 1);
    } else {
      // No town: still connect the exits to each other so the region is traversable.
      for (let i = 0; i < exits.length; i++) {
        road(m, [[exits[i].x, exits[i].y], [RW >> 1, RH >> 1]], 1);
      }
    }

    // Dungeon entrances, each a cave mouth in a cliff face.
    const mine = DUNGEON_IDS.filter((d) => DUNGEONS[d].region === id);
    m.dungeons = [];
    mine.forEach((did, i) => {
      const spec = DUNGEONS[did];
      const a = (i / Math.max(1, mine.length)) * Math.PI * 2 + 0.7;
      const dist = 38 + rng.int(14);
      const dx = spec.ex !== undefined ? spec.ex : clamp(Math.round((RW >> 1) + Math.cos(a) * dist), 8, RW - 9);
      const dy = spec.ey !== undefined ? spec.ey : clamp(Math.round((RH >> 1) + Math.sin(a) * dist), 8, RH - 9);
      const gh = H(m, dx, dy);
      flatten(m, dx, dy, 3, 3, gh, 4);
      for (let y = dy - 1; y <= dy + 1; y++) for (let x = dx - 2; x <= dx + 2; x++) setCell(m, x, y, MAT.gravel);
      caveMouth(m, dx, dy, gh);
      m.portals.push({ x: dx, y: dy, to: did, kind: 'stairs', tx: 3, ty: 3, tang: 0 });
      m.decor.push({ kind: 'brazier', x: dx - 1.5, y: dy + 0.5, z: gh });
      m.decor.push({ kind: 'brazier', x: dx + 2.5, y: dy + 0.5, z: gh });
      m.dungeons.push({ id: did, x: dx, y: dy });
      if (town) road(m, [[town.cx, town.cy], [dx, dy]], 1, MAT.dirt);
    });

    // A ravine with a bridge over it. The s06 shot, and the thing that makes a heightfield
    // demonstrably more than a hill generator.
    if (r.biome !== 'marsh' && r.biome !== 'coast') {
      const ry = (RH >> 1) - 8;   // s06 looks north from y=62.5 onto this
      const s = RW + 1;
      // The ravine spans only x 66..90 and TAPERS at both ends. A ravine that crosses the whole
      // map would swallow s04's wilderness camera, and a ravine that stops dead reads as a bug.
      const RX0 = 66, RX1 = 90;
      for (let x = RX0; x <= RX1; x++) {
        const edge = Math.min(x - RX0, RX1 - x) / 9;
        const taper = clamp(edge, 0, 1);
        if (taper <= 0.01) continue;
        for (let dy = -4; dy <= 4; dy++) {
          const y = ry + dy;
          if (y < 1 || y >= RH) continue;
          const t = 1 - Math.abs(dy) / 4.5;
          const vi = y * s + x;
          m.terrain[vi] = lerp(m.terrain[vi], -7.5, t * t * taper);
          if (Math.abs(dy) <= 2 && taper > 0.5) m.cells[y * RW + x] = MAT.rock;
        }
      }
      const bx = 84;   // s06 stands at x=84.5
      bridge(m, bx, ry - 5, bx, ry + 5, 1.2);
      m.bridge = { x: bx, y: ry };
    }

    // Scatter decor by biome. Density is what makes a region feel inhabited rather than empty.
    const treeKind = { forest: 'pine', temperate: 'oak', snow: 'deadtree', marsh: 'reed',
      volcanic: 'ashstump', barrow: 'standingstone', coast: 'rock', highland: 'rock', blighted: 'deadtree' }[r.biome];
    const nDecor = 460;
    for (let i = 0; i < nDecor; i++) {
      const x = rng.float(2, RW - 2), y = rng.float(2, RH - 2);
      const cx = Math.floor(x), cy = Math.floor(y);
      const c = m.cells[cy * RW + cx];
      if (isSolid(c)) continue;
      const mt = matOf(c);
      if (mt === MAT.water || mt === MAT.road || mt === MAT.plaza || mt === MAT.wood) continue;
      // Nothing scatters INSIDE a settlement. Testing the cell material alone let a full-grown oak
      // land on the one dirt tile between two market stalls, where it filled the middle of the
      // town's flagship shot with a trunk. A town is built ground; whatever grows there was planted.
      if (town && Math.hypot(x - town.cx, y - town.cy) < (r.townSize === 'city' ? 16 : 12)) continue;
      const h = H(m, x, y);
      if (h < r.sea + 0.3) continue;
      m.decor.push({ kind: rng.chance(0.82) ? treeKind : rng.pick(['rock', 'bush', 'stump']), x, y, z: h });
    }

    // Monster spawn points, kept off roads and out of the settlement. The safe radius used to be
    // 34 cells, which on a 128-cell region is most of the walk a new player ever takes: a cold
    // tester spent fifteen minutes and "never met a single enemy, never fought anything, never saw
    // a number change except the clock." A town should be safe; the field outside it should not.
    const SAFE_R = 19;
    const nSpawn = 40 + r.level * 2;
    for (let i = 0; i < nSpawn; i++) {
      const x = rng.float(4, RW - 4), y = rng.float(4, RH - 4);
      const cx = Math.floor(x), cy = Math.floor(y);
      if (isSolid(m.cells[cy * RW + cx])) continue;
      if (matOf(m.cells[cy * RW + cx]) === MAT.water) continue;
      const fromTown = town ? Math.hypot(x - town.cx, y - town.cy) : 99;
      if (fromTown < SAFE_R) continue;
      // A GRADED FRONTIER. The full spawn table within a short walk of the gate killed a rested
      // level-1 party in 8.9 seconds with nothing ever entering the frame — the region's level-3
      // wolves were spawning where its level-1 rats belong. Inside 32 cells you meet the weakest
      // thing in the table and nothing else.
      const kind = fromTown < 32 ? r.spawn[0] : rng.pick(r.spawn);
      m.entities.push({
        eid: 'e' + id + '_' + i, kind, x, y, z: H(m, x, y),
        ang: rng.float(0, Math.PI * 2), state: 'idle', home: { x, y },
      });
    }
    // A picket of the weakest thing in the table, in the band just outside the walls, so the first
    // walk out of the gate meets SOMETHING. The first fight is the moment the game starts existing.
    if (town) {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + rng.float(-0.2, 0.2);
        const d = SAFE_R + rng.float(3, 11);
        const x = town.cx + Math.cos(a) * d, y = town.cy + Math.sin(a) * d;
        const cx = Math.floor(x), cy = Math.floor(y);
        if (cx < 2 || cy < 2 || cx >= RW - 2 || cy >= RH - 2) continue;
        if (isSolid(m.cells[cy * RW + cx])) continue;
        if (matOf(m.cells[cy * RW + cx]) === MAT.water) continue;
        m.entities.push({
          eid: 'p' + id + '_' + i, kind: r.spawn[0], x, y, z: H(m, x, y),
          ang: rng.float(0, Math.PI * 2), state: 'idle', home: { x, y },
        });
      }
    }

    // ---- harvestable marshwort, for the one quest whose objective did not exist
    // A full assisted playthrough cleared all thirteen dungeons, opened every chest and swept every
    // cell of every map with the interact verb: "no marshwort-like item exists anywhere in the
    // world". The quest asked for four bundles of something that was never placed. Herbs regrow,
    // so the quest cannot be locked out by a player who harvests carelessly.
    if (r.biome === 'marsh' || r.biome === 'temperate' || r.biome === 'forest') {
      const want = r.biome === 'marsh' ? 14 : 4;
      let made = 0;
      for (let t = 0; t < 900 && made < want; t++) {
        const x = rng.float(6, RW - 6), y = rng.float(6, RH - 6);
        const cx2 = Math.floor(x), cy2 = Math.floor(y);
        const c = m.cells[cy2 * RW + cx2];
        if (isSolid(c)) continue;
        const mt = matOf(c);
        if (mt !== MAT.marsh && mt !== MAT.grass) continue;
        const h2 = H(m, x, y);
        if (h2 < m.sea - 0.2 || h2 > m.sea + 3.2) continue;
        m.decor.push({ kind: 'herb', x, y, z: h2, item: 'herb_bundle' });
        made++;
      }
    }

    // ---- a bandit camp, in a clearing away from the town and the road
    // The camp shot came back with "a hill, trees, a tent, a horizon" and no camp, because there
    // was no camp: the generator placed a lone tent prop and nothing else. A camp is a fire, a ring
    // of tents facing it, gear on the ground, and people.
    {
      let placed = false;
      for (let attempt = 0; attempt < 60 && !placed; attempt++) {
        const a = rng.float(0, Math.PI * 2), d = rng.float(30, 52);
        const cxp = Math.round(RW / 2 + Math.cos(a) * d), cyp = Math.round(RH / 2 + Math.sin(a) * d);
        if (cxp < 8 || cyp < 8 || cxp > RW - 8 || cyp > RH - 8) continue;
        let ok = true;
        for (let y = cyp - 4; y <= cyp + 4 && ok; y++) {
          for (let x = cxp - 4; x <= cxp + 4; x++) {
            const c = m.cells[y * RW + x];
            if (isSolid(c) || matOf(c) === MAT.water) { ok = false; break; }
          }
        }
        if (!ok) continue;
        const gh2 = H(m, cxp, cyp);
        flatten(m, cxp, cyp, 5, 5, gh2, 2);
        for (let x = cxp - 4; x <= cxp + 4; x++) {
          for (let y = cyp - 4; y <= cyp + 4; y++) {
            if (Math.hypot(x - cxp, y - cyp) <= 4 && !isSolid(m.cells[y * RW + x])) {
              m.cells[y * RW + x] = MAT.dirt;
            }
          }
        }
        m.decor.push({ kind: 'campfire', x: cxp + 0.5, y: cyp + 0.5, z: gh2 });
        for (let i = 0; i < 3; i++) {
          const ta = (i / 3) * Math.PI * 2 + 0.6;
          m.decor.push({ kind: 'tent', x: cxp + 0.5 + Math.cos(ta) * 2.6, y: cyp + 0.5 + Math.sin(ta) * 2.6, z: gh2 });
        }
        m.decor.push({ kind: 'crate', x: cxp + 2.2, y: cyp - 1.6, z: gh2 });
        m.decor.push({ kind: 'barrel', x: cxp - 2.4, y: cyp + 1.2, z: gh2 });
        for (let i = 0; i < 3; i++) {
          const ta = (i / 3) * Math.PI * 2;
          m.entities.push({
            eid: 'camp' + id + '_' + i, kind: r.spawn.indexOf('bandit') >= 0 ? 'bandit' : r.spawn[0],
            x: cxp + 0.5 + Math.cos(ta) * 1.6, y: cyp + 0.5 + Math.sin(ta) * 1.6,
            z: gh2, ang: ta + Math.PI, state: 'idle', home: { x: cxp, y: cyp },
          });
        }
        landmark(m, 'camp', cxp, cyp + 9, -Math.PI / 2, cxp, cyp);
        placed = true;
      }
    }

    // ---- shoreline, for regions that have a sea to stand beside
    {
      let best = null, bestScore = -1;
      for (let y = 6; y < RH - 6; y += 3) {
        for (let x = 6; x < RW - 6; x += 3) {
          if (matOf(m.cells[y * RW + x]) === MAT.water) continue;
          if (isSolid(m.cells[y * RW + x])) continue;
          // Count water in a ring: a good shoreline pose has open sea in front and land behind.
          let wet = 0;
          for (let k = 0; k < 8; k++) {
            const ax = x + Math.round(Math.cos(k * Math.PI / 4) * 7);
            const ay = y + Math.round(Math.sin(k * Math.PI / 4) * 7);
            if (ax < 0 || ay < 0 || ax >= RW || ay >= RH) continue;
            if (matOf(m.cells[ay * RW + ax]) === MAT.water) wet++;
          }
          if (wet < 3 || wet > 6) continue;
          // Prefer the widest expanse: sample far out along the water direction.
          let open = 0, ox2 = 0, oy2 = 0;
          for (let k = 0; k < 8; k++) {
            const dxk = Math.cos(k * Math.PI / 4), dyk = Math.sin(k * Math.PI / 4);
            let run = 0;
            for (let t = 3; t < 40; t += 2) {
              const ax = Math.round(x + dxk * t), ay = Math.round(y + dyk * t);
              if (ax < 0 || ay < 0 || ax >= RW || ay >= RH) break;
              if (matOf(m.cells[ay * RW + ax]) !== MAT.water) break;
              run = t;
            }
            if (run > open) { open = run; ox2 = dxk; oy2 = dyk; }
          }
          if (open > bestScore) { bestScore = open; best = { x, y, ang: Math.atan2(oy2, ox2) }; }
        }
      }
      if (best && bestScore >= 12) landmark(m, 'coast', best.x, best.y, best.ang);
    }

    // ---- a stretch of open road, looked at along its length
    {
      for (let t = 0; t < 400; t++) {
        const x = Math.round(rng.float(10, RW - 10)), y = Math.round(rng.float(10, RH - 10));
        if (matOf(m.cells[y * RW + x]) !== MAT.road) continue;
        if (town && Math.hypot(x - town.cx, y - town.cy) < 16) continue;
        // Which way does the road run from here?
        let dirX = 0, dirY = 0;
        for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          let run = 0;
          for (let k = 1; k < 12; k++) {
            const nx = x + ax * k, ny = y + ay * k;
            if (nx < 0 || ny < 0 || nx >= RW || ny >= RH) break;
            if (matOf(m.cells[ny * RW + nx]) !== MAT.road) break;
            run = k;
          }
          if (run > 7) { dirX = ax; dirY = ay; break; }
        }
        if (!dirX && !dirY) continue;
        landmark(m, 'road', x - dirX * 5, y - dirY * 5, Math.atan2(dirY, dirX));
        break;
      }
    }

    // AUTHORED OVERRIDE, APPLIED LAST — ARCHITECTURE.md's rule, and this is exactly what it is for.
    // Every road out of town and every dirt track to a dungeon is drawn FROM the fountain, so three
    // or four of them crossed the plaza and repainted it as bare earth: the town's flagship shot
    // showed a market row standing on a mud crossroads. Roads still grade the terrain through the
    // square (removing that stranded the party behind an unclimbable lip and the campaign test
    // caught it within a minute) — they just do not get to keep the surface.
    if (town) {
      for (let y = town.cy - town.plazaR; y <= town.cy + town.plazaR; y++) {
        for (let x = town.cx - town.plazaR; x <= town.cx + town.plazaR; x++) {
          if (inb(m, x, y) && !isSolid(m.cells[y * RW + x])) m.cells[y * RW + x] = MAT.plaza;
        }
      }
    }

    m.fogStart = r.biome === 'marsh' ? 8 : 16;
    m.fogEnd = r.biome === 'marsh' ? 34 : 62;
    return m;
  }

  const MAX_CLIMB = 0.75;

  // ---------------------------------------------------------------- dungeons
  // Rooms joined by corridors, then a guaranteed path check. A dungeon whose boss room is not
  // reachable is a softlock, so connectivity is asserted, not hoped for.
  function buildDungeon(did) {
    const d = DUNGEONS[did];
    const rng = RNG.world('dungeon:' + did);
    const m = blankMap(did, d.name, 'dungeon', d.w, d.h);
    m.level = d.level;
    m.theme = d.theme;
    m.region = d.region;
    m.light = 0.12;
    m.fogStart = 4; m.fogEnd = 15;

    const wallMat = { crypt: MAT.stonewall, cave: MAT.cliff, mine: MAT.timberwall,
      forge: MAT.obsidian, ice: MAT.ice, keep: MAT.marble }[d.theme] || MAT.stonewall;
    const floorMat = { crypt: MAT.tile, cave: MAT.gravel, mine: MAT.dirt,
      forge: MAT.ash, ice: MAT.snow, keep: MAT.marble }[d.theme] || MAT.tile;
    // A ceiling distinct from BOTH floor and wall. Without three separable values a corridor is a
    // grey rectangle with no silhouette at all.
    m.ceilMat = { crypt: MAT.obsidian, cave: MAT.obsidian, mine: MAT.timberwall,
      forge: MAT.obsidian, ice: MAT.ice, keep: MAT.obsidian }[d.theme] || MAT.obsidian;

    m.cells.fill(wallMat | SOLID);
    m.storeys.fill(1);

    const rooms = [];
    const tries = 90;
    for (let i = 0; i < tries && rooms.length < 12; i++) {
      const rw = 4 + rng.int(6), rh = 4 + rng.int(5);
      const rx = 1 + rng.int(d.w - rw - 2), ry = 1 + rng.int(d.h - rh - 2);
      let overlap = false;
      for (const o of rooms) {
        if (rx < o.x + o.w + 1 && rx + rw + 1 > o.x && ry < o.y + o.h + 1 && ry + rh + 1 > o.y) { overlap = true; break; }
      }
      if (overlap) continue;
      rooms.push({ x: rx, y: ry, w: rw, h: rh, cx: rx + (rw >> 1), cy: ry + (rh >> 1) });
    }

    for (const r of rooms) {
      for (let y = r.y; y < r.y + r.h; y++) {
        for (let x = r.x; x < r.x + r.w; x++) m.cells[y * d.w + x] = floorMat;
      }
    }

    // Corridors: connect every room to the previous one, so the graph is a guaranteed chain, then
    // add a few extra links for loops.
    const carve = (x0, y0, x1, y1) => {
      let x = x0, y = y0;
      while (x !== x1) { m.cells[y * d.w + x] = floorMat; x += Math.sign(x1 - x); }
      while (y !== y1) { m.cells[y * d.w + x] = floorMat; y += Math.sign(y1 - y); }
      m.cells[y * d.w + x] = floorMat;
    };
    // A SPINE corridor along y=9, entrance to far wall. Two reasons: a dungeon of rooms joined by
    // dogleg corridors has no long sightline anywhere, which is why s13 framed a wall two cells
    // from the camera; and a spine is simply better dungeon design than a shapeless mesh.
    const SPINE_Y = 9;
    for (let x = 2; x < d.w - 2; x++) m.cells[SPINE_Y * d.w + x] = floorMat;
    for (const r of rooms) {
      // Every room hangs off the spine, so nothing is reachable only through a chain of others.
      let y = r.cy;
      const step = Math.sign(SPINE_Y - r.cy);
      while (y !== SPINE_Y) { m.cells[y * d.w + r.cx] = floorMat; y += step; }
    }
    for (let i = 1; i < rooms.length; i++) carve(rooms[i - 1].cx, rooms[i - 1].cy, rooms[i].cx, rooms[i].cy);
    for (let i = 0; i < 3 && rooms.length > 3; i++) {
      const a = rng.pick(rooms), b = rng.pick(rooms);
      if (a !== b) carve(a.cx, a.cy, b.cx, b.cy);
    }

    // Entrance in room 0, beside the stairs rather than on them.
    const first = rooms[0];
    m.entry = { x: first.cx, y: first.cy };
    for (let y = 1; y <= 3; y++) for (let x = 1; x <= 3; x++) m.cells[y * d.w + x] = floorMat;
    carve(2, 2, first.cx, first.cy);
    m.portals.push({
      x: 2, y: 2, to: d.region, kind: 'stairs',
      // Landing coordinates are MANDATORY and sit BESIDE the reciprocal portal, never on it:
      // missing coords softlock, and landing on the return trigger bounces the player straight back.
      tx: 0, ty: 0, tang: 0, exitToRegion: true, dungeon: did,
    });

    // Boss room is the one furthest from the entrance.
    let boss = rooms[rooms.length - 1], bestD = -1;
    for (const r of rooms) {
      const dd = Math.hypot(r.cx - 2, r.cy - 2);
      if (dd > bestD) { bestD = dd; boss = r; }
    }
    m.bossRoom = boss;
    m.entities.push({
      eid: did + '_boss', kind: d.boss, x: boss.cx + 0.5, y: boss.cy + 0.5, z: 0,
      ang: 0, state: 'idle', boss: true, home: { x: boss.cx, y: boss.cy },
    });

    // Populate. Density scales with dungeon level.
    const pop = 8 + Math.round(d.level * 1.3);
    const table = REGIONS[d.region].spawn;
    for (let i = 0; i < pop; i++) {
      const r = rng.pick(rooms);
      if (r === rooms[0]) continue;
      m.entities.push({
        eid: did + '_e' + i, kind: rng.pick(table),
        x: r.x + 0.5 + rng.int(r.w), y: r.y + 0.5 + rng.int(r.h), z: 0,
        ang: rng.float(0, Math.PI * 2), state: 'idle', home: { x: r.cx, y: r.cy },
      });
    }

    // Chests, and the quest item if this dungeon holds one.
    for (let i = 0; i < 3 + rng.int(4); i++) {
      const r = rng.pick(rooms);
      m.decor.push({ kind: 'chest', x: r.x + 0.5 + rng.int(r.w), y: r.y + 0.5 + rng.int(r.h), z: 0,
        tier: clamp(Math.round(d.level / 3), 1, 5), opened: false, id: did + '_c' + i });
    }
    for (let i = 0; i < 4 + rng.int(5); i++) {
      const r = rng.pick(rooms);
      m.decor.push({ kind: 'brazier', x: r.x + 0.5 + rng.int(r.w), y: r.y + 0.5 + rng.int(r.h), z: 0 });
    }

    m.rooms = rooms;
    return m;
  }

  // Quest items live in specific dungeons, placed on the boss room floor so the main chain is
  // always completable by playing rather than by luck.
  const QUEST_ITEM_SITES = {
    barrow_seal: ['barrow'],
    mine_ledger: ['mine'],
    crown_shard: ['barrowdeep', 'stonecircle', 'icetomb'],
    ash_key: ['forge'],
  };

  // What a quest item DEMANDS before it can be taken. The Smith says "the Ember Forge can reforge
  // the shards into a key", and the whole Shards of the Crown quest exists to gather them — but the
  // key could be picked up off the forge floor with no shards at all, which made an entire step of
  // the main chain optional and meaningless.
  const QUEST_ITEM_REQUIRES = {
    ash_key: { item: 'crown_shard', count: 3,
      why: 'The forge is cold. It needs three shards of the Crown to wake.' },
  };

  // ---------------------------------------------------------------- assembly
  function build(seed) {
    RNG.setSeed(seed === undefined ? 7 : seed);
    const maps = {};
    for (const id of REGION_IDS) maps[id] = buildRegion(id);
    for (const id of DUNGEON_IDS) maps[id] = buildDungeon(id);

    // Wire dungeon exits back to the cave mouth they came from, BESIDE it, never on it.
    for (const did of DUNGEON_IDS) {
      const d = DUNGEONS[did];
      const rm = maps[d.region];
      const site = rm.dungeons.find((x) => x.id === did);
      const p = maps[did].portals.find((x) => x.exitToRegion);
      if (site && p) { p.tx = site.x; p.ty = site.y + 2; p.tang = Math.PI / 2; }
    }

    // Place quest items.
    for (const item of Object.keys(QUEST_ITEM_SITES)) {
      for (const did of QUEST_ITEM_SITES[item]) {
        const m = maps[did];
        if (!m || !m.bossRoom) continue;
        m.decor.push({
          kind: 'questitem', item, id: did + '_q_' + item,
          x: m.bossRoom.cx + 0.5, y: m.bossRoom.cy + 1.5, z: 0, taken: false,
        });
      }
    }

    // NPCs: quest givers in their region's settlement, plus wanderers.
    // Every giver must stand on OPEN GROUND the party can walk to. The old placement for a region
    // with no town laid its refugees out in a straight line east of the harrowgate plaza — which
    // walks into the ring of buildings after a few of them, and the giver of the FINAL quest ended
    // up inside one. A full playthrough that cleared all thirteen dungeons and turned in every
    // other quest never saw q_crown at all, so the game could not be won.
    const placeGiver = (m, qid, role) => {
      for (let ring = 0; ring < 4; ring++) {
        const rad = 5.5 + ring * 1.8;
        for (let k = 0; k < 24; k++) {
          const a = (m.npcs.length * 0.7 + k) * (Math.PI * 2 / 24) + 0.4;
          const nx = m.town.x + Math.cos(a) * rad, ny = m.town.y + Math.sin(a) * rad;
          if (!passable(m, nx, ny, H(m, nx, ny))) continue;
          let clash = false;
          for (const n of m.npcs) if (Math.hypot(n.x - nx, n.y - ny) < 1.6) { clash = true; break; }
          if (clash) continue;
          m.npcs.push({ id: 'npc_' + qid, role, quest: qid, x: nx, y: ny, z: H(m, nx, ny) });
          return true;
        }
      }
      return false;
    };
    for (const qid of QUEST_IDS) {
      const q = QUESTS[qid];
      const m = maps[q.region];
      // A region with no town hosts its giver in the capital instead of nowhere.
      const host = (m && m.town) ? m : maps.harrowgate;
      if (!placeGiver(host, qid, q.giver)) {
        // Never silently drop a quest giver: an unplaceable one is an unwinnable campaign.
        host.npcs.push({ id: 'npc_' + qid, role: q.giver, quest: qid,
          x: host.town.x + 0.5, y: host.town.y + 2.5, z: H(host, host.town.x, host.town.y) });
      }
    }

    return { seed: RNG.seed, maps, regions: REGIONS, dungeons: DUNGEONS, quests: QUESTS };
  }

  // ---------------------------------------------------------------- queries
  // The walk surface at a point: terrain, or a span's top when the party is on it.
  function walkHeight(m, x, y, currentZ) {
    const g = H(m, x, y);
    const s = spanAt(m, Math.floor(x), Math.floor(y));
    if (!s) return g;
    // On the deck if already at or above it; otherwise underneath on the ground.
    if (currentZ !== undefined && currentZ >= s.hi - 0.9) return s.hi;
    return g;
  }

  // Can the party stand at (x,y) coming from height z? Blocks solids, deep water, cliffs that are
  // too steep, and anything without headroom under a span.
  // The party is a BODY, not a point. Testing the centre alone let a player stand at x = 3.999
  // with a solid cell beginning at x = 4.0: the wall face is a thousandth of a cell from the eye
  // and fills the entire viewport, which a first-time player reported as "I walked face-first into
  // a stone wall and the game let me stand inside it... I could not tell if I was stuck, inside a
  // building, or if the renderer had died." Keep a real body clear of solid cells.
  // 0.26 leaves 0.48 of clearance in a one-cell doorway, which is enough to walk through.
  // 0.36, not 0.26. At a 73-degree FOV a wall face a quarter-cell from the eye fills the entire
  // viewport, and two cold players independently reported walking into a building and having the
  // screen become one flat texture with no way to tell whether they were stuck or the renderer had
  // died. 0.36 still leaves 0.28 of clearance in a one-cell doorway.
  const BODY = 0.36;

  function passable(m, x, y, fromZ) {
    if (!pointOk(m, x, y, fromZ)) return false;
    // Only the solid test needs the body radius. Height and water are sampled continuously and
    // already vary smoothly, so probing them at the rim would just make slopes unclimbable.
    if (blockedSolid(m, x + BODY, y, fromZ) || blockedSolid(m, x - BODY, y, fromZ)
      || blockedSolid(m, x, y + BODY, fromZ) || blockedSolid(m, x, y - BODY, fromZ)) return false;
    return true;
  }

  function blockedSolid(m, x, y, fromZ) {
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) return true;
    const cx = Math.floor(x), cy = Math.floor(y);
    if (!isSolid(cellAt(m, cx, cy))) return false;
    const s = spanAt(m, cx, cy);
    return !(s && fromZ !== undefined && fromZ >= s.hi - 0.9);
  }

  function pointOk(m, x, y, fromZ) {
    if (x < 0.4 || y < 0.4 || x > m.w - 0.4 || y > m.h - 0.4) return false;
    const cx = Math.floor(x), cy = Math.floor(y);
    const c = cellAt(m, cx, cy);
    const s = spanAt(m, cx, cy);
    const onDeck = s && fromZ !== undefined && fromZ >= s.hi - 0.9;
    if (isSolid(c) && !onDeck) return false;
    if (m.kind === 'dungeon') return true;
    const h = H(m, x, y);
    if (!onDeck) {
      if (h < m.sea - 0.6) return false;                       // deep water
      if (fromZ !== undefined && h - fromZ > MAX_CLIMB) return false;   // too steep to climb
      // Headroom: moving UNDER a span needs the party's full height.
      if (s && s.lo - h < 1.6) return false;
    }
    return true;
  }

  // The nearest spot with real clearance around (x, y). Used by anything that PLACES the party —
  // a portal landing, a debug jump, a shot-list landmark. Two of the twenty-two captured shots
  // shipped as a flat grey smear because the landmark pose resolved inside a wall, and an art
  // critic ranked them the two weakest frames in the set for exactly that reason.
  function clearSpot(m, x, y, z, maxR) {
    if (passable(m, x, y, z)) return { x, y };
    const R = maxR === undefined ? 6 : maxR;
    for (let r = 0.5; r <= R; r += 0.5) {
      for (let k = 0; k < 16; k++) {
        const a = (k / 16) * Math.PI * 2;
        const nx = x + Math.cos(a) * r, ny = y + Math.sin(a) * r;
        if (passable(m, nx, ny, z === undefined ? H(m, nx, ny) : z)) return { x: nx, y: ny };
      }
    }
    return { x, y };
  }

  return {
    MAT, SOLID, isSolid, matOf, MAT_RAMP, MAX_CLIMB, clearSpot,
    REGIONS, REGION_IDS, DUNGEONS, DUNGEON_IDS, QUESTS, QUEST_IDS, SHOP_KINDS, QUEST_ITEM_REQUIRES,
    RW, RH, neighbours,
    hash2, vnoise, fbm, ridged,
    blankMap, cellAt, setCell, H, flatten, road, addSpan, spanAt, bridge, gateArch, caveMouth,
    buildRegion, buildDungeon, build, walkHeight, passable, QUEST_ITEM_SITES,
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = World;


/* ==================== 05_engine.js ==================== */
// 05_engine.js — framebuffer, raster primitives, presentation, and the 3D renderer.
// Owner: engine. Calls Core and World.
//
// This round implements the framebuffer/raster/present layer, which is stable and will not change,
// plus a test card. The heightfield march (per-column terrain stepping with overhead spans) lands
// in R2 and replaces `render3D`'s placeholder body. See ARCHITECTURE.md §7 for its contract.

const Engine = (() => {
  'use strict';

  const { PAL32, shade, clamp } = Core;

  // ---------------------------------------------------------------- framebuffer
  // 800x480 (5:3), not 640x480 (4:3). On an iPhone 14 Pro Max in landscape the canvas gets an
  // 844x390 viewport; a 4:3 framebuffer letterboxes to 520x390 and throws away 324 pixels — 38%
  // of the screen — as black bar, which a reviewer measured and reported. 5:3 fills 650 of the 844
  // instead of 520, and the extra width goes to the 3D view, which lands the viewport aspect close
  // to MM6's own. The cost is 25% more pixels per frame; the march is per-column, so it scales.
  const W = 800, H = 480;

  // One byte per pixel: a PALETTE INDEX, not a colour. Nothing in this engine ever holds RGB.
  const buf = new Uint8Array(W * H);

  // Depth per column, written by the wall/terrain pass and read by the sprite pass so billboards
  // composite correctly against geometry.
  const zb = new Float32Array(W);

  // Clip rectangle. The 3D pass clips to the viewport hole; UI clips to whatever it is drawing.
  let cx0 = 0, cy0 = 0, cx1 = W, cy1 = H;

  function clip(x, y, w, h) {
    cx0 = clamp(x, 0, W); cy0 = clamp(y, 0, H);
    cx1 = clamp(x + w, 0, W); cy1 = clamp(y + h, 0, H);
  }
  function clipReset() { cx0 = 0; cy0 = 0; cx1 = W; cy1 = H; }

  function clear(pi) { buf.fill(pi | 0); }

  function px(x, y, pi) {
    if (x < cx0 || x >= cx1 || y < cy0 || y >= cy1) return;
    buf[y * W + x] = pi;
  }

  // Unclipped, uncheked write. Only for inner loops that have already bounds-checked.
  function pxFast(x, y, pi) { buf[y * W + x] = pi; }

  function hline(x, y, len, pi) {
    if (y < cy0 || y >= cy1) return;
    let a = x < cx0 ? cx0 : x;
    let b = x + len > cx1 ? cx1 : x + len;
    if (b <= a) return;
    buf.fill(pi, y * W + a, y * W + b);
  }

  function vline(x, y, len, pi) {
    if (x < cx0 || x >= cx1) return;
    let a = y < cy0 ? cy0 : y;
    let b = y + len > cy1 ? cy1 : y + len;
    for (let yy = a; yy < b; yy++) buf[yy * W + x] = pi;
  }

  function rect(x, y, w, h, pi) {
    for (let yy = y; yy < y + h; yy++) hline(x, yy, w, pi);
  }

  function frameRect(x, y, w, h, pi) {
    hline(x, y, w, pi); hline(x, y + h - 1, w, pi);
    vline(x, y, h, pi); vline(x + w - 1, y, h, pi);
  }

  // Blit an indexed sprite. Index 0 is transparent and is the ONLY transparent index.
  // `lit` is the shade level applied through the ramp: the same arithmetic every surface uses.
  function blit(spr, dx, dy, lit) {
    const sw = spr.w, sh = spr.h, d = spr.data;
    for (let y = 0; y < sh; y++) {
      const ty = dy + y;
      if (ty < cy0 || ty >= cy1) continue;
      const row = y * sw, trow = ty * W;
      for (let x = 0; x < sw; x++) {
        const pi = d[row + x];
        if (pi === 0) continue;                       // transparent
        const tx = dx + x;
        if (tx < cx0 || tx >= cx1) continue;
        buf[trow + tx] = lit === undefined ? pi : shade(pi, (pi & 0x0f) + lit);
      }
    }
  }

  // Scaled blit with nearest sampling — how a billboard sprite reaches the screen at distance.
  function blitScaled(spr, dx, dy, dw, dh, lit, mirror) {
    if (dw <= 0 || dh <= 0) return;
    const sw = spr.w, sh = spr.h, d = spr.data;
    const xs = sw / dw, ys = sh / dh;
    const x0 = dx < cx0 ? cx0 : dx, x1 = dx + dw > cx1 ? cx1 : dx + dw;
    const y0 = dy < cy0 ? cy0 : dy, y1 = dy + dh > cy1 ? cy1 : dy + dh;
    for (let ty = y0; ty < y1; ty++) {
      const sy = ((ty - dy) * ys) | 0;
      const srow = sy * sw, trow = ty * W;
      for (let tx = x0; tx < x1; tx++) {
        let sx = ((tx - dx) * xs) | 0;
        if (mirror) sx = sw - 1 - sx;
        const pi = d[srow + sx];
        if (pi === 0) continue;
        buf[trow + tx] = lit === undefined ? pi : shade(pi, (pi & 0x0f) + lit);
      }
    }
  }

  // ---------------------------------------------------------------- presentation
  let img = null, img32 = null;

  function present(ctx) {
    if (!img) {
      img = ctx.createImageData(W, H);
      img32 = new Uint32Array(img.data.buffer);
    }
    for (let i = 0, n = W * H; i < n; i++) img32[i] = PAL32[buf[i]];
    ctx.putImageData(img, 0, 0);
  }

  // ---------------------------------------------------------------- test card
  // Renders before any world exists. Its real job is to prove three things early: the palette ramps
  // are monotonic, index 0 survives the pipeline, and the letterbox scaling is integer/nearest.
  function testCard() {
    clipReset();
    clear(Core.idx(0, 1));

    // 16 ramps x 16 shades, as a grid. Any non-monotonic ramp is visible instantly here.
    const cw = 34, ch = 18, ox = 32, oy = 46;
    for (let r = 0; r < 16; r++) {
      for (let s = 0; s < 16; s++) {
        rect(ox + s * cw, oy + r * ch, cw - 1, ch - 1, (r << 4) | s);
      }
    }

    // Frame around the grid, and a marker column showing shade() clamping on ramp 0.
    frameRect(ox - 2, oy - 2, 16 * cw + 3, 16 * ch + 3, Core.idx(13, 11));

    // Alignment marks at the exact corners of the 3D viewport, so a capture can be checked for
    // off-by-one scaling without measuring pixels by eye.
    const V = VIEW;
    frameRect(V.x, V.y, V.w, V.h, Core.idx(15, 12));
    rect(V.x, V.y, 3, 3, Core.idx(0, 15));
    rect(V.x + V.w - 3, V.y + V.h - 3, 3, 3, Core.idx(0, 15));

    // HUD band boundary.
    hline(0, HUD.y, W, Core.idx(13, 8));
  }

  // ---------------------------------------------------------------- layout
  // Design decisions calibrated to the 800x480 frame. NOT measurements of MM6 — real measured
  // numbers belong in critique/MM6_REFERENCE.md, which needs reference material this build does
  // not have. See ARCHITECTURE.md §11.
  // The 3D view is INSET, with carved chrome to its left and right that holds the touch controls.
  // Three separate reviews reported the same thing and the art critic ranked it first of five:
  // "get the movement D-pad and the USE/ATK/CST buttons out of the 3D viewport — translucent
  // buttons floating inside the world is mobile-game grammar that did not exist in 1998, and it is
  // why nine of these shots have nowhere for the eye to go: the near ground plane is covered by
  // UI." It also costs nothing in art. The world gets narrower; it stops being a phone game.
  const CHROME_W = 92;
  const VIEW = { x: CHROME_W + 8, y: 8, w: W - 2 * (CHROME_W + 8), h: 344 };
  const CHROME_L = { x: 0, y: 0, w: CHROME_W, h: 352 };
  const CHROME_R = { x: W - CHROME_W, y: 0, w: CHROME_W, h: 352 };
  const HUD = { x: 0, y: 352, w: W, h: 128 };

  // Projection scale, from the vertical FOV implied by a 70 degree horizontal FOV at VIEW's
  // aspect. Computed once; the march and the sprite pass both read it.
  // Vertical FOV is the one that decides how much ground and sky a frame holds, and MM6 framed
  // with about 46 degrees of it. On the 616x344 viewport that means ~73 degrees horizontal — which
  // is also, not coincidentally, roughly what MM6 used on its own wide viewport.
  const FOV_H = 73 * Math.PI / 180;
  const FOV_V = 2 * Math.atan(Math.tan(FOV_H / 2) * (VIEW.h / VIEW.w));
  const PROJ = VIEW.h / (2 * Math.tan(FOV_V / 2));

  // ================================================================ the 3D pass
  // A per-column heightfield march. This REPLACES the floor caster rather than sitting beside it:
  // one loop produces terrain, buildings, roofs and spans, because they are all the same thing —
  // an interval of solid matter over a cell.
  //
  // A flat grid of full-height walls reads as Wolfenstein, not MM6, and no texture quality repairs
  // that. Everything below exists to make the ground itself have shape.

  const STOREY = 3.20;
  const CEIL = 3.20;          // dungeon ceiling height
  const EYE = 1.30;
  const MAX_STEPS = 150;

  // Ordered-dither fog. Palette indices cannot be blended arithmetically across ramps, so distance
  // fade is a dithered REPLACEMENT with the sky index — which is exactly what 1998 did, and why
  // fog dissolves geometry into the sky instead of into black.
  const FOG_BAYER = [
    0.0078, 0.5078, 0.1328, 0.6328, 0.0391, 0.5391, 0.1641, 0.6641,
    0.7578, 0.2578, 0.8828, 0.3828, 0.7891, 0.2891, 0.9141, 0.4141,
    0.1953, 0.6953, 0.0703, 0.5703, 0.2266, 0.7266, 0.1016, 0.6016,
    0.9453, 0.4453, 0.8203, 0.3203, 0.9766, 0.4766, 0.8516, 0.3516,
    0.0547, 0.5547, 0.1797, 0.6797, 0.0234, 0.5234, 0.1484, 0.6484,
    0.8047, 0.3047, 0.9297, 0.4297, 0.7734, 0.2734, 0.8984, 0.3984,
    0.2422, 0.7422, 0.1172, 0.6172, 0.2109, 0.7109, 0.0859, 0.5859,
    0.9922, 0.4922, 0.8672, 0.3672, 0.9609, 0.4609, 0.8359, 0.3359,
  ];

  // Per-column span bands already drawn, so a bridge deck can occupy rows ABOVE ground that is
  // already filled. Front-to-back with a single "filled to y" marker breaks exactly here; this is
  // the one place the cheap trick does not survive contact.
  const bandY0 = new Int16Array(16);
  const bandY1 = new Int16Array(16);

  // ------------------------------------------------------------------ fog
  // Fog is a TRUE COLOUR BLEND toward the horizon, quantised to the palette afterwards — not a
  // stencil. Every previous attempt (threshold-swap, then shade-walk plus a crossover dither) put
  // an ordered lattice on the screen, and three separate cold reviews called it out by name: "I
  // can trace unbroken vertical columns of blue pixels straight across the black, crossing wall,
  // floor and void without deviating." A framebuffer-wide screen door is a post-process from a
  // different decade. So: lerp RGB, find the nearest palette entry, cache the answer.
  //
  // The cache is what makes this affordable. 17 fog steps x 256 source colours per target colour,
  // built once per distinct horizon colour and kept for the life of the page. A sky band holds
  // only a handful of distinct indices, so the whole day cycle costs a few dozen tables.
  const FOG_STEPS = 17;
  const fogLuts = new Map();

  function fogLut(target) {
    let lut = fogLuts.get(target);
    if (lut) return lut;
    lut = new Uint8Array(256 * FOG_STEPS);
    const tr = Core.PAL[target * 3], tg = Core.PAL[target * 3 + 1], tb = Core.PAL[target * 3 + 2];
    for (let i = 0; i < 256; i++) {
      const r = Core.PAL[i * 3], g = Core.PAL[i * 3 + 1], b = Core.PAL[i * 3 + 2];
      for (let q = 0; q < FOG_STEPS; q++) {
        const t = q / (FOG_STEPS - 1);
        lut[i * FOG_STEPS + q] = Core.palIdx(
          Math.round(r + (tr - r) * t), Math.round(g + (tg - g) * t), Math.round(b + (tb - b) * t));
      }
    }
    fogLuts.set(target, lut);
    return lut;
  }

  // The one legitimate use of the Bayer matrix that survives: dithering the fog PARAMETER between
  // two adjacent LUT steps, so a slow gradient does not band. This dithers the blend; it does not
  // punch holes in the image.
  function fogShade(texel, light, fog, band, y, fogRow, fogJit, phase) {
    const pi = Core.shade(texel & 0xf0, (texel & 0x0f) + light);
    if (!band || fog <= 0.01) return pi;
    // The band is 8 wide, dithered; a fogged surface must sample the SAME column phase as the sky
    // it is fading into, or a far object straddling a former band seam fogs to two colours.
    const target = band[((y - VIEW.y) << 3) | phase];
    if (fog >= 0.999) return target;
    let q = fog * (FOG_STEPS - 1) + (FOG_BAYER[fogRow + (y & 7)] + fogJit) - 0.5;
    q = q < 0 ? 0 : (q > FOG_STEPS - 1 ? FOG_STEPS - 1 : q) | 0;
    return fogLut(target)[pi * FOG_STEPS + q];
  }

  // A dungeon has no sky. Distance in a sealed corridor resolves to BLACK, and the unmarched part
  // of a column is void, not daylight. Feeding the outdoor sky band to both put a bright pale-blue
  // panel at the end of every barrow corridor — an art critic reported it as "the skybox is
  // leaking into a sealed dungeon", which is exactly what it was.
  let voidBandCache = null;
  function voidBand() {
    if (!voidBandCache || voidBandCache.length !== VIEW.h * 8) {
      voidBandCache = new Uint8Array(VIEW.h * 8);      // index 0 is true black, same 8-wide stride
    }
    return voidBandCache;
  }

  function render3D(cam, world) {
    const map = cam.map;
    if (!map) { testCard(); return; }

    clip(VIEW.x, VIEW.y, VIEW.w, VIEW.h);

    const dungeon = map.kind === 'dungeon';
    const horizon = VIEW.y + (VIEW.h >> 1) + (cam.horizon || 0);
    // The camera may never sit at or below the surface it stands on. When it did, the ground
    // projected ABOVE the horizon and the entire frame turned inside out — a first-time player
    // reported "trees hanging upside down from the top of the sky, trunks pointing up, canopies
    // below them" and concluded the renderer had come apart. It had not; the eye was underwater.
    let eyeZ = cam.z + EYE;
    if (dungeon) {
      if (eyeZ > CEIL - 0.25) eyeZ = CEIL - 0.25;
      if (eyeZ < 0.35) eyeZ = 0.35;
    } else {
      const standing = World.H(map, cam.x, cam.y);
      const floorZ = (standing > map.sea ? standing : map.sea) + 0.30;
      if (eyeZ < floorZ) eyeZ = floorZ;
    }
    const cosA = Math.cos(cam.ang), sinA = Math.sin(cam.ang);
    const halfFov = Math.tan(FOV_H / 2);

    const skyBand = dungeon ? voidBand() : (Art.skyBand ? Art.skyBand() : null);
    const light = map.light === undefined ? 1 : map.light;
    // NO SUN UNDERGROUND. A sealed barrow was being tinted by the outdoor clock, so at 05:08 the
    // inside of a burial mound glowed sunrise orange: "MM6 dungeons have their own lighting; that's
    // what makes inside feel like inside." Indoors the torch pool is the only light there is.
    const sun = dungeon ? 0 : (Art.sunShade ? Art.sunShade(light) : 0);
    const fogStart = map.fogStart, fogEnd = map.fogEnd;

    for (let sx = 0; sx < VIEW.w; sx++) {
      const px = VIEW.x + sx;

      // Sky first: everything the march does not cover stays sky, so a column that reaches the
      // horizon needs no separate pass.
      if (skyBand) {
        const phase = sx & 7;
        for (let y = 0; y < VIEW.h; y++) buf[(VIEW.y + y) * W + px] = skyBand[y * 8 + phase];
      } else {
        for (let y = 0; y < VIEW.h; y++) buf[(VIEW.y + y) * W + px] = Core.idx(0, 1);
      }

      const camX = ((sx + 0.5) / VIEW.w) * 2 - 1;
      const rdx = cosA - sinA * camX * halfFov;
      const rdy = sinA + cosA * camX * halfFov;
      const rl = Math.hypot(rdx, rdy);
      const dx = rdx / rl, dy = rdy / rl;

      let ybuf = VIEW.y + VIEW.h;       // filled upward from the bottom of the viewport
      let ytop = VIEW.y;                // and DOWNWARD from the top, for dungeon ceilings
      let nBands = 0;
      let dist = 0.30;
      let step = dungeon ? 0.035 : 0.055;
      zb[px] = 1e9;

      for (let s = 0; s < MAX_STEPS && ybuf > ytop; s++) {
        // Step size grows with distance: ~150 steps then reach ~200 cells, and far detail collapses
        // into haze exactly where we want it anyway.
        dist += step;
        step *= dungeon ? 1.020 : 1.028;
        if (dist > fogEnd + 12) break;

        const wx = cam.x + dx * dist, wy = cam.y + dy * dist;
        const cx = Math.floor(wx), cy = Math.floor(wy);
        if (cx < 0 || cy < 0 || cx >= map.w || cy >= map.h) break;

        const ci = cy * map.w + cx;
        const cell = map.cells[ci];
        const solid = (cell & 128) !== 0;
        const mat = cell & 0x7f;

        const gh = dungeon ? 0 : World.H(map, wx, wy);
        const invD = PROJ / dist;

        // Fog: how much of this sample is eaten by distance.
        const fog = clamp((dist - fogStart) / Math.max(1, fogEnd - fogStart), 0, 1);
        const fogRow = (sx & 7) * 8;
        // Break the Bayer lattice: without this the threshold is periodic in screen space and a
        // large evenly-fogged face reads as a visible grid rather than as haze.
        const fogJit = (((sx * 1103515245 + s * 12345) >>> 16) & 31) / 512;

        // ---- ground / water surface
        const isWater = mat === World.MAT.water;
        const surfH = isWater ? map.sea : gh;
        const yG = (horizon + (eyeZ - gh) * invD) | 0;
        if (!solid && yG < ybuf) {
          const yS = isWater ? ((horizon + (eyeZ - surfH) * invD) | 0) : yG;
          const top = yS < VIEW.y ? VIEW.y : yS;
          if (top < ybuf) {
            // PER-ROW ground cast. This is the defect an art critic diagnosed better than I did:
            // "the ground plane is 1-pixel vertical streaks that are the same width at the bottom
            // of the frame as at the horizon, so nothing foreshortens." The march took ONE texel
            // per step and filled the whole vertical run with it, smearing a single sample down
            // dozens of screen rows. A plane rendered that way is wallpaper, not ground.
            //
            // Each screen row below the horizon sees the ground at its OWN distance:
            //     y = horizon + (eyeZ - h) * PROJ / d   =>   d = (eyeZ - h) * PROJ / (y - horizon)
            // so solve per row and sample there. Near rows advance slowly in world space (large
            // texels), rows near the horizon advance fast (small texels). That IS perspective.
            const slope = dungeon ? 0 : Art.slopeShade(map, wx, wy);
            const baseLight = sun + slope + (dungeon ? dungeonLight(cam, wx, wy, map) + 2 : 0);
            const rise = eyeZ - surfH;
            const fogSpan = Math.max(1, fogEnd - fogStart);
            for (let y = top; y < ybuf; y++) {
              const rows = y - horizon;
              // Ground above eye level projects ABOVE the horizon, where the row-to-distance
              // solve flips sign; fall back to the march distance rather than mirroring the world.
              let rd = dist;
              if (rows > 0 && rise > 0.02) {
                rd = rise * PROJ / rows;
                if (rd < 0.30) rd = 0.30; else if (rd > dist + 6) rd = dist + 6;
              }
              const rx = cam.x + dx * rd, ry = cam.y + dy * rd;
              // Distance LOD, now genuinely per row: the far ground would otherwise point-sample a
              // high-frequency texture and alias into noise at the SAME apparent scale as the
              // foreground, which is the other half of why it read as a vertical curtain.
              const texel = Art.groundTexel(mat, rx, ry, map, Art.lodFor(rd));
              const rfog = clamp((rd - fogStart) / fogSpan, 0, 1);
              buf[y * W + px] = fogShade(texel, baseLight, rfog, skyBand, y, fogRow, fogJit, sx & 7);
            }
            ybuf = top;
          }

          // Dungeon ceiling, filled DOWNWARD from the top of the column.
          if (dungeon) {
            const yC = (horizon + (eyeZ - CEIL) * invD) | 0;
            const bot = yC > ybuf ? ybuf : yC;
            if (bot > ytop) {
              const ct = Art.groundTexel(map.ceilMat === undefined ? mat : map.ceilMat, wx, wy, map, Art.lodFor(dist));
              const light = dungeonLight(cam, wx, wy, map) - 4;
              for (let y = ytop; y < bot; y++) buf[y * W + px] = fogShade(ct, light, fog, skyBand, y, fogRow, fogJit, sx & 7);
              ytop = bot;
            }
          }
        }

        // ---- solid cell: extrude a prism from the terrain. Buildings, cliffs, dungeon walls and
        // variable storey heights all come out of this one branch.
        if (solid) {
          const storeys = map.storeys[ci] || 1;
          const topH = gh + storeys * STOREY;
          const yT = (horizon + (eyeZ - topH) * invD) | 0;
          const top = yT < VIEW.y ? VIEW.y : yT;
          if (top < ybuf) {
            // Wall u from whichever axis this face is more aligned to.
            // u must run the same way on both faces of an axis, or adjacent walls mirror into a
            // chevron. Flip on the far side so the texture reads continuously around a corner.
            const face = Math.abs(dx) > Math.abs(dy) ? 1 : 0;
            let u = face ? (wy - cy) : (wx - cx);
            if (face ? dx > 0 : dy < 0) u = 1 - u;
            const lightDelta = sun - (face ? 1 : 0) + (dungeon ? dungeonLight(cam, wx, wy, map) : 0);
            const lod = Art.lodFor(dist);
            // LIT WINDOWS after dark. Both an art critic and a veteran reported the same thing from
            // opposite directions: "not one emissive pixel" and "a market town at 23:00 with no lit
            // window, no lantern, no warm pool". Night was a global multiply, and a global multiply
            // is a filter, not a time of day. A window is a hole in a wall with a fire behind it,
            // and it must ignore the sun term entirely or it goes out with everything else.
            const lampLit = !dungeon && sun <= -1 && Art.isBuilding(mat);
            const lampSeed = lampLit ? (Core.hashStr('win' + cx + ':' + cy + ':' + face) >>> 0) : 0;
            for (let y = top; y < ybuf; y++) {
              // v from the screen row back to world height, so texture does not swim with distance.
              const wh = eyeZ - (y - horizon) / invD;
              const v = (topH - wh) / STOREY;
              if (lampLit) {
                const lit = Art.windowTexel(u, v, lampSeed, storeys);
                if (lit) { buf[y * W + px] = lit; continue; }
              }
              const tx = Art.wallTexel(mat, u, v, face, lod);
              // Shade WITHIN the texel's own ramp. Re-deriving a delta from a reference texel
              // cancelled the global sun term, which is why night came out brighter than noon.
              buf[y * W + px] = fogShade(tx, lightDelta, fog, skyBand, y, fogRow, fogJit, sx & 7);
            }
            ybuf = top;
          }
          if (zb[px] > dist) zb[px] = dist;
          // A solid prism occludes everything lower behind it; keep marching only for taller
          // terrain and spans above.
        }

        // ---- overhead spans: bridges, gate arches, aqueducts, cave mouths. ONE primitive.
        const sp = map.spans.get(cy * 4096 + cx);
        if (sp) {
          const yHi = (horizon + (eyeZ - sp.hi) * invD) | 0;
          const yLo = (horizon + (eyeZ - sp.lo) * invD) | 0;
          let a = yHi < VIEW.y ? VIEW.y : yHi;
          let b = yLo > VIEW.y + VIEW.h ? VIEW.y + VIEW.h : yLo;
          // NOT clipped to ybuf. A bridge deck or a gate arch sits in rows the ground pass has
          // already filled, and clipping to the ground marker erases exactly the thing overhead
          // spans exist to draw. ARCHITECTURE.md §6.2 predicted this in writing.
          if (b > a) {
            const spanLight = sun - 1 + (dungeon ? dungeonLight(cam, wx, wy, map) : 0);
            const spanLod = Art.lodFor(dist);
            for (let y = a; y < b; y++) {
              // Skip rows an earlier, nearer band already claimed.
              let taken = false;
              for (let k = 0; k < nBands; k++) if (y >= bandY0[k] && y < bandY1[k]) { taken = true; break; }
              if (taken) continue;
              const wh = eyeZ - (y - horizon) / invD;
              const stx = Art.wallTexel(sp.tex, (wx - cx), (sp.hi - wh) / STOREY, 0, spanLod);
              buf[y * W + px] = fogShade(stx, spanLight, fog, skyBand, y, fogRow, fogJit, sx & 7);
            }
            if (nBands < 16) { bandY0[nBands] = a; bandY1[nBands] = b; nBands++; }
            if (zb[px] > dist) zb[px] = dist;
          }
        }
      }
    }

    clipReset();
  }

  // Torch radius indoors. A dungeon lit by a global ambient reads as a lit room with the lights
  // off; the falloff around the party is most of what makes a corridor feel like a corridor.
  function dungeonLight(cam, wx, wy, map) {
    const d = Math.hypot(wx - cam.x, wy - cam.y);
    const radius = cam.torch || 7.5;
    // A torch POOL: bright at the party's feet, near black at the edge of the radius. The previous
    // curve floored at -2, which left a whole dungeon evenly lit and blew s15 to 218/255 mean.
    // Floor at -11, not -14. A first quest into a barrow the party could not see AT ALL — black
    // at midnight and black at noon — is a dead end, not atmosphere. Dark enough that a torch is
    // worth carrying; light enough that the walls exist without one.
    const t = clamp(1 - d / radius, 0, 1);
    return Math.round(t * t * 13) - 11;
  }

  // ---------------------------------------------------------------- sprites
  // Billboards composited against zb. Feet sit at the WALK SURFACE — terrain height, or a span's
  // deck when the entity is on one — never a constant ground plane.
  function drawSprite(cam, spr, wx, wy, wz, hWorld, opts) {
    const dxw = wx - cam.x, dyw = wy - cam.y;
    const cosA = Math.cos(-cam.ang), sinA = Math.sin(-cam.ang);
    const tx = dxw * cosA - dyw * sinA;
    const ty = dxw * sinA + dyw * cosA;
    if (tx < 0.25) return false;                        // behind the camera

    const halfFov = Math.tan(FOV_H / 2);
    const sx = VIEW.x + (VIEW.w / 2) * (1 + (ty / tx) / halfFov);
    const invD = PROJ / tx;
    const horizon = VIEW.y + (VIEW.h >> 1) + (cam.horizon || 0);
    const eyeZ = cam.z + EYE;

    const hPix = hWorld * invD;
    const wPix = hPix * (spr.w / spr.h);
    const yFeet = horizon + (eyeZ - wz) * invD;
    const x0 = Math.round(sx - wPix / 2), y0 = Math.round(yFeet - hPix);

    if (x0 + wPix < VIEW.x || x0 > VIEW.x + VIEW.w) return false;

    // Column-wise depth test so a sprite half-behind a wall is half-drawn, not all or nothing.
    clip(VIEW.x, VIEW.y, VIEW.w, VIEW.h);
    const lit = opts && opts.lit !== undefined ? opts.lit : 0;
    const mirror = opts && opts.mirror;
    let drawn = 0;
    const xs = spr.w / Math.max(1, wPix), ys = spr.h / Math.max(1, hPix);
    const xa = Math.max(VIEW.x, x0), xb = Math.min(VIEW.x + VIEW.w, Math.round(x0 + wPix));
    const ya = Math.max(VIEW.y, y0), yb = Math.min(VIEW.y + VIEW.h, Math.round(y0 + hPix));

    // A CONTACT SHADOW under the feet, before the sprite. Without one every creature decals onto
    // the ground and hovers — an art critic checked the pixels directly beneath a guard's boots and
    // found them identical to open pavement, and called it out on all 22 shots at once. This is the
    // cheapest possible fix for the single most universal "not grounded" tell there is: darken the
    // ground the sprite stands on, in an ellipse, in its own ramp.
    if (!opts || !opts.noShadow) {
      const footY = Math.round(y0 + hPix) - 1;
      const shW = Math.max(2, Math.round(wPix * 0.42));
      const shH = Math.max(1, Math.round(shW * 0.30));
      const scx = Math.round(x0 + wPix / 2);
      for (let dy = -shH; dy <= shH; dy++) {
        const yy = footY + dy;

        const span = Math.round(shW * Math.sqrt(Math.max(0, 1 - (dy * dy) / (shH * shH + 0.01))));
        for (let dx = -span; dx <= span; dx++) {
          const xx = scx + dx;

          if (zb[xx] < tx) continue;
          const under = buf[yy * W + xx];

          // the surface rather than a grey blob painted on top of it.

    ';': ['.....', '.....', '..##.', '..##.', '.....', '..##.', '..##.', '..#..', '.#...'],

    M: ['#...#', '##.##', '#.#.#', '#.#.#', '#...#', '#...#', '#...#', '.....', '.....'],

    C: ['.###.', '#...#', '#....', '#....', '#....', '#...#', '.###.', '.....', '.....'],
    G: ['.###.', '#...#', '#....', '#.###', '#...#', '#...#', '.###.', '.....', '.....'],
    L: ['#....', '#....', '#....', '#....', '#....', '#....', '#####', '.....', '.....'],
    T: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..', '.....', '.....'],
    Y: ['#...#', '#...#', '.#.#.', '..#..', '..#..', '..#..', '..#..', '.....', '.....'],
    K: ['#...#', '#..#.', '#.#..', '##...', '#.#..', '#..#.', '#...#', '.....', '.....'],
    E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####', '.....', '.....'],
    F: ['#####', '#....', '#....', '####.', '#....', '#....', '#....', '.....', '.....'],
    D: ['####.', '#...#', '#...#', '#...#', '#...#', '#...#', '####.', '.....', '.....'],
    I: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '#####', '.....', '.....'],
    1: ['..#..', '.##..', '..#..', '..#..', '..#..', '..#..', '.###.', '.....', '.....'],

  };

  const GLYPH_H = 9;

  const FONT = (() => {
    const parts = FONT_HEX.replace(/\s/g, '').split('|');
    const out = new Uint16Array(parts.length * 5);
    for (let i = 0; i < parts.length; i++) {
      for (let c = 0; c < 5; c++) out[i * 5 + c] = parseInt(parts[i].substr(c * 2, 2), 16) || 0;
    }

      const idx = ch.charCodeAt(0) - 32;
      const rows = DESCENDERS[ch];

        let bits = 0;

  // the other half of why the log read as a terminal rather than as a game.
  const ADVANCE = (() => {
    const adv = new Uint8Array(FONT.length / 5);
    for (let i = 0; i < adv.length; i++) {
      let last = -1;
      for (let c = 0; c < 5; c++) if (FONT[i * 5 + c]) last = c;

  function charCols(ch) {

  }

  //

    let cx = x;
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      const gi = (code < 32 || code > 126) ? -1 : code - 32;
      if (gi >= 0) {

          for (let r = 0; r < GLYPH_H; r++) {

          const joint = bx < 1 || by < 1;
          shade = joint ? 4 : 9 + n * 1.6;

          shade = 8 + n * 1.8 + fine * 2.2;
        } else if (mat === M.sand) {

          shade = 6 + n * 3;
        } else if (mat === M.ash) {
          shade = 5 + n * 2.6 + fine * 1.2;

          shade = (bx < 1 || by < 1) ? 4 : 9 + n * 1.2;
        } else {

  // Box-filtered pyramid, built lazily per texture. Averaging PALETTE INDICES is meaningless, so
  // each level averages the RGB the indices stand for and re-quantises through the same palette.
  const MIPS = new Map();

  function mipsFor(mat) {

    let cur = base, size = S;
    while (size > 8) {
      const half = size >> 1;
      const next = new Uint8Array(half * half);
      for (let y = 0; y < half; y++) {
        for (let x = 0; x < half; x++) {
          let r = 0, g = 0, b = 0;
          for (let dy = 0; dy < 2; dy++) {
            for (let dx = 0; dx < 2; dx++) {
              const pi = cur[(y * 2 + dy) * size + (x * 2 + dx)];
              r += Core.PAL[pi * 3]; g += Core.PAL[pi * 3 + 1]; b += Core.PAL[pi * 3 + 2];

          }
          next[y * half + x] = Core.palIdx(r >> 2, g >> 2, b >> 2);

      }
      next.size = half;
      m.push(next);
      cur = next; size = half;
    }

    return m;
  }

  // Which mip level a sample at this distance should use. Roughly one level per doubling.
  function lodFor(dist) {

    if (dist < 20) return 1;
    if (dist < 36) return 2;
    if (dist < 64) return 3;
    return 4;
  }

  function levelOf(mat, lod) {
    const m = mipsFor(mat);
    return m[lod < m.length ? lod : m.length - 1];

  // material and nothing else in the engine changes — which is the whole point of routing every
  // texel through texFor().
  function installBaked(mat, indices, size) {

    BAKED[mat].size = size;
    MIPS.delete(mat);   // a stale pyramid would keep showing the procedural texture at distance
  }

  // into each PNG's PLTE, so a decoded RGB maps back to exactly one index.
  async function installBakedTextures(blob) {
    if (!blob || !blob.tex) return 0;
    let n = 0;
    for (const name of Object.keys(blob.tex)) {
      const mat = World.MAT[name];
      if (mat === undefined) continue;
      const img = new Image();
      try {
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/png;base64,' + blob.tex[name]; });
      } catch (e) { continue; }

      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, img.width, img.height).data;
      const idx = new Uint8Array(img.width * img.height);
      for (let i = 0, p = 0; i < idx.length; i++, p += 4) idx[i] = Core.palIdx(d[p], d[p + 1], d[p + 2]);
      installBaked(mat, idx, img.width);

  }

  const texSize = (t) => t.size || TS;

  // Texture scale is a WORLD measurement: two tiles per cell on the ground, one per storey on a
  // wall. `lod` picks the mip so distant samples do not alias into same-scale noise.
  // GROUND FREQUENCY. This sampled two full texture repeats per world cell — at a 64-texel tile
  // that is 128 texels across a cell, so a cell spanning 200 screen pixels still packed sub-pixel
  // detail and the surface aliased into per-pixel noise at EVERY distance. An art critic measured
  // it: mean horizontal run length 1.20 at the camera and 1.10 at the horizon, i.e. a flat field
  // of RGB static with no scale and no perspective, "visual sandpaper" under the best sprites in
  // the set. Half a repeat per cell gives 32 texels per cell, so magnification near the camera is
  // real and the foreshortening the per-row cast computes is finally visible.
  const GROUND_REPEAT = 0.5;

  function groundTexel(mat, wx, wy, map, lod) {
    const t = levelOf(mat, lod || 0);
    const S = t.size || TS, Mk = S - 1;
    const u = (((wx * GROUND_REPEAT * S) | 0) + (S << 6)) & Mk;
    const v = (((wy * GROUND_REPEAT * S) | 0) + (S << 6)) & Mk;
    return t[v * S + u];
  }

  const BUILDING = { 17: 1, 18: 1, 19: 1, 16: 1 };   // timber, brick, plaster, stone
  const isBuilding = (mat) => !!BUILDING[mat];

  // A lit window: a framed opening with a warm interior and a mullion cross, drawn straight into
  // the framebuffer so the sun term never touches it. Which storeys are lit, and which of the two
  // window columns, comes from the cell hash — so a street has some rooms awake and some not, and
  // it is the same street every night.
  function windowTexel(u, v, seed, storeys) {
    const st = Math.floor(v);                        // which storey of this wall
    if (st < 0 || st >= (storeys || 1)) return 0;
    const fv = v - st;
    if (fv < 0.30 || fv > 0.72) return 0;
    // Two windows per cell face.
    const col = u < 0.5 ? 0 : 1;
    const fu = col ? (u - 0.5) * 2 : u * 2;
    if (fu < 0.26 || fu > 0.74) return 0;
    const bit = (seed >>> ((st * 2 + col) & 15)) & 1;
    if (!bit) return 0;                              // that room is dark
    // Frame, then glow, then a mullion cross.
    const edge = fu < 0.32 || fu > 0.68 || fv < 0.35 || fv > 0.67;
    if (edge) return Core.idx(4, 2);
    if (Math.abs(fu - 0.5) < 0.035 || Math.abs(fv - 0.51) < 0.028) return Core.idx(4, 3);
    const warm = 12 + (((u * 97 + v * 61) | 0) & 1);
    return Core.idx(15, warm);
  }

  function wallTexel(mat, u, v, face, lod) {
    const t = levelOf(mat, lod || 0);
    const S = t.size || TS, Mk = S - 1;
    // `& Mk` on a negative value does not wrap the way a modulo would, and v goes negative above
    // the party's eye line. Bias into positive space first.
    const ui = (((u * S) | 0) + (S << 6)) & Mk;
    const vi = (((v * S) | 0) + (S << 6)) & Mk;
    return t[vi * S + ui];
  }

  // Slope shading from the terrain gradient against the key direction (upper-left, matching the
  // sprite rig). Hills read as hills because of this and almost nothing else.
  function slopeShade(map, wx, wy) {
    const h0 = World.H(map, wx, wy);
    const hx = World.H(map, wx + 0.9, wy) - h0;
    const hy = World.H(map, wx, wy + 0.9) - h0;
    return clamp(Math.round((-hx * 1.6 - hy * 1.1)), -4, 4);
  }

  // ---------------------------------------------------------------- sky
  // A vertical band per viewport row for the current hour. Regenerated only when the hour bucket
  // or horizon changes: it is a per-frame read, not a per-frame build.
  let skyCache = null, skyKey = '';

  const SKY_KEYS = {
    night:     { top: [9, 1], hor: [9, 4],  sun: -5 },
    dawn:      { top: [9, 5], hor: [15, 9], sun: -2 },
    morning:   { top: [9, 8], hor: [9, 12], sun: 0 },
    noon:      { top: [9, 10], hor: [9, 14], sun: 1 },
    afternoon: { top: [9, 9], hor: [9, 13], sun: 0 },
    dusk:      { top: [9, 4], hor: [15, 8], sun: -2 },
  };

  function skyBand(horizonOverride) {
    const E = Engine;
    const phase = Clock.phase();
    const horizon = (E.VIEW.h >> 1) + (horizonOverride || 0);
    const k = phase + ':' + horizon;
    if (skyCache && skyKey === k) return skyCache;

    // DITHERED, and 8 pixels wide. The gradient is a lerp between two shades of one ramp, and
    // rounding it to an integer shade gives four or five values over 172 rows — which is four or
    // five FLAT RECTANGLES with razor seams. An art critic measured them: "in s10 at x=150 the sky
    // steps at y=24, y=59, y=94, y=129, exactly 35px apart, 465px wide, with zero dither at any
    // boundary. No 1998 sky ever did that." They appear in eleven of twenty-two shots.
    //
    // The band is now indexed [row * 8 + (x & 7)], so the fractional part of the shade is resolved
    // by an ordered threshold across the column: a boundary becomes a two-value checker a few rows
    // deep instead of a line. This is the legitimate use of a Bayer matrix — dithering a
    // quantisation error — as opposed to punching holes in an image with one.
    const spec = SKY_KEYS[phase] || SKY_KEYS.noon;
    const band = new Uint8Array(E.VIEW.h * 8);
    const TH = [0.0625, 0.5625, 0.1875, 0.6875, 0.4375, 0.9375, 0.3125, 0.8125];
    for (let y = 0; y < E.VIEW.h; y++) {
      const t = clamp(y / Math.max(1, horizon), 0, 1);
      const ramp = t > 0.86 ? spec.hor[0] : spec.top[0];
      const exact = lerp(spec.top[1], spec.hor[1], t);
      const lo = Math.floor(exact), frac = exact - lo;
      for (let x = 0; x < 8; x++) {
        band[y * 8 + x] = Core.shade(ramp << 4, frac > TH[(x + (y & 1) * 4) & 7] ? lo + 1 : lo);
      }
    }
    skyCache = band; skyKey = k;
    return band;
  }

  // Global light contribution from the sun, as a shade delta. This is how time of day reaches every
  // surface without any asset being generated twice.
  function sunShade(mapLight) {
    const d = Clock.daylight();
    // FLOOR at -3, not -5. A first-time player hit true black at midnight with no light source and
    // could not tell a night cycle from a crash. Night should be dark and navigable — moonlight,
    // not an absence of image.
    const base = Math.round(lerp(-3, 2, d));
    return Math.round(base * (mapLight === undefined ? 1 : mapLight));
  }

  // ---------------------------------------------------------------- ui ornament
  // Bevelled panel: two-tone border plus a darker plate. Cheap, and it is what makes a 1998 UI read
  // as moulded rather than as flat rectangles.
  function panel(E, x, y, w, h, ramp, dark) {
    const r = ramp === undefined ? 4 : ramp;
    E.rect(x, y, w, h, Core.idx(r, dark ? 3 : 5));
    E.hline(x, y, w, Core.idx(r, 10));
    E.vline(x, y, h, Core.idx(r, 10));
    E.hline(x, y + h - 1, w, Core.idx(r, 2));
    E.vline(x + w - 1, y, h, Core.idx(r, 2));
    E.frameRect(x + 1, y + 1, w - 2, h - 2, Core.idx(r, dark ? 2 : 4));
  }

  // A raised button. `down` swaps the bevel, which is the entire visual language of "pressed".
  function button(E, x, y, w, h, label, down, scale) {
    const r = 13;
    E.rect(x, y, w, h, Core.idx(r, down ? 4 : 7));
    E.hline(x, y, w, Core.idx(r, down ? 3 : 12));
    E.vline(x, y, h, Core.idx(r, down ? 3 : 12));
    E.hline(x, y + h - 1, w, Core.idx(r, down ? 12 : 3));
    E.vline(x + w - 1, y, h, Core.idx(r, down ? 12 : 3));
    if (label) {
      const s = scale || 2;
      textCentred(E, x + w / 2, y + ((h - 7 * s) >> 1) + (down ? 1 : 0), label, Core.idx(0, 14), s);
    }
  }
