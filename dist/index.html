<script>
"use strict";
window.__BAKED__ = null;

/* ==================== 00_core.js ==================== */
// 00_core.js — RNG registry, palette, clock, bus, log, small utils.
// Owner: core. Depends on nothing.
//
// Two things in this file are load-bearing for the entire project:
//   1. The palette is 16 ramps x 16 shades, so shading is ARITHMETIC on an index. Every wall,
//      sprite and floor shades through the same operation, which is most of why the output reads
//      as one art department rather than a pile of separate assets.
//   2. Every random number in the game comes from a NAMED SEEDED STREAM here. There is no
//      Math.random in src/ and a test greps for it.

const Core = (() => {
  'use strict';

  // ---------------------------------------------------------------- utils
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => t * t * (3 - 2 * t);

  // FNV-1a. Used to derive stream seeds from names, so a stream's identity is its name.
  function hashStr(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  // ---------------------------------------------------------------- RNG
  // SplitMix32. Explicit 32-bit state so a stream can be dumped and restored exactly.
  function Stream(seed) {
    this.s = seed >>> 0;
  }
  Stream.prototype.next = function () {
    this.s = (this.s + 0x9e3779b9) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 16), 0x21f0aaad);
    t = Math.imul(t ^ (t >>> 15), 0x735a2d97);
    t = t ^ (t >>> 15);
    return (t >>> 0) / 4294967296;
  };
  // int in [0, n)
  Stream.prototype.int = function (n) { return Math.floor(this.next() * n); };
  // int in [lo, hi] inclusive
  Stream.prototype.range = function (lo, hi) { return lo + Math.floor(this.next() * (hi - lo + 1)); };
  Stream.prototype.float = function (lo, hi) { return lo + this.next() * (hi - lo); };
  Stream.prototype.chance = function (p) { return this.next() < p; };
  Stream.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  // Fisher-Yates, in place, deterministic.
  Stream.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  // Sum of n uniforms - the bell curve 1998 RPGs actually used for damage spread.
  Stream.prototype.dice = function (n, sides) {
    let v = 0;
    for (let i = 0; i < n; i++) v += 1 + Math.floor(this.next() * sides);
    return v;
  };

  const RNG = {
    seed: 1,
    _world: Object.create(null),   // layout streams: derived from seed, NEVER serialised
    _live: Object.create(null),    // live streams: advance in play, ALWAYS serialised

    setSeed(n) {
      this.seed = n >>> 0;
      this._world = Object.create(null);
      this._live = Object.create(null);
    },

    // Layout randomness. Reproducible from the seed alone, so it is rebuilt on load rather
    // than stored. Terrain, map dressing, shop stock.
    world(name) {
      let s = this._world[name];
      if (!s) s = this._world[name] = new Stream((this.seed ^ hashStr('w:' + name)) >>> 0);
      return s;
    },

    // Live randomness. Combat rolls, loot, wandering spawns. Position is part of the save;
    // a save that does not restore these is a determinism bug.
    live(name) {
      let s = this._live[name];
      if (!s) s = this._live[name] = new Stream((this.seed ^ hashStr('l:' + name)) >>> 0);
      return s;
    },

    // Stable key order so the dump is diffable.
    dump() {
      const out = { seed: this.seed, live: {} };
      for (const k of Object.keys(this._live).sort()) out.live[k] = this._live[k].s;
      return out;
    },

    restore(d) {
      this.setSeed(d.seed);
      for (const k of Object.keys(d.live || {})) this._live[k] = new Stream(d.live[k] >>> 0);
    },
  };

  // ---------------------------------------------------------------- palette
  // 16 ramps x 16 shades. index = (ramp << 4) | shade. Shade 0 darkest, 15 lightest.
  // INDEX 0 IS TRANSPARENT AND IS THE ONLY TRANSPARENT INDEX. Every quantiser and every
  // bake step passes it through verbatim; remapping it once turned the UI frame's viewport
  // hole into an opaque black plate and blacked out the whole game.
  const TRANSPARENT = 0;

  // [dark, light] or [dark, mid, light]. Mid lets a ramp bend through a hue (flame through
  // orange) instead of interpolating straight to white.
  const RAMPS = [
    [[8, 8, 10], [128, 130, 136], [248, 248, 252]],       //  0 key / grey   (0 = transparent)
    [[24, 26, 34], [110, 118, 134], [198, 206, 220]],      //  1 cold stone
    [[34, 28, 20], [148, 128, 96], [234, 216, 180]],       //  2 warm stone / sandstone
    [[30, 14, 10], [140, 68, 48], [216, 130, 96]],         //  3 brick / clay
    [[24, 15, 8], [116, 80, 44], [190, 146, 94]],          //  4 timber
    [[22, 17, 11], [104, 84, 58], [176, 148, 108]],        //  5 earth / dirt
    [[13, 23, 11], [74, 112, 50], [156, 194, 104]],        //  6 grass
    [[6, 14, 9], [40, 78, 40], [92, 146, 78]],             //  7 foliage
    [[5, 13, 26], [40, 92, 130], [130, 190, 222]],         //  8 water
    [[20, 28, 50], [96, 134, 186], [204, 226, 248]],       //  9 sky
    [[32, 19, 14], [150, 104, 78], [242, 210, 180]],       // 10 flesh
    [[28, 7, 9], [132, 34, 34], [220, 92, 82]],            // 11 cloth red
    [[17, 10, 32], [84, 58, 132], [164, 132, 224]],        // 12 cloth violet
    [[30, 20, 5], [148, 112, 32], [250, 216, 116]],        // 13 gold / brass
    [[16, 18, 24], [112, 124, 142], [216, 226, 238]],      // 14 steel
    [[38, 10, 2], [198, 84, 12], [255, 236, 156]],         // 15 flame
  ];

  const PAL = new Uint8Array(256 * 3);
  (function buildPalette() {
    for (let r = 0; r < 16; r++) {
      const spec = RAMPS[r];
      const dark = spec[0];
      const mid = spec.length === 3 ? spec[1] : null;
      const light = spec[spec.length - 1];
      for (let s = 0; s < 16; s++) {
        const t = s / 15;
        let c;
        if (mid) {
          // Two-segment interpolation through the mid colour at t = 0.5.
          c = t < 0.5
            ? [lerp(dark[0], mid[0], t * 2), lerp(dark[1], mid[1], t * 2), lerp(dark[2], mid[2], t * 2)]
            : [lerp(mid[0], light[0], (t - 0.5) * 2), lerp(mid[1], light[1], (t - 0.5) * 2), lerp(mid[2], light[2], (t - 0.5) * 2)];
        } else {
          c = [lerp(dark[0], light[0], t), lerp(dark[1], light[1], t), lerp(dark[2], light[2], t)];
        }
        const i = ((r << 4) | s) * 3;
        PAL[i] = c[0] | 0; PAL[i + 1] = c[1] | 0; PAL[i + 2] = c[2] | 0;
      }
    }
    // Index 0 is the transparent slot. Its RGB is never drawn, but keep it black rather than
    // leaving it as ramp 0's darkest so a bug that draws it is obvious rather than subtle.
    PAL[0] = 0; PAL[1] = 0; PAL[2] = 0;
  })();

  // RGBA bytes for the whole palette, for fast framebuffer expansion.
  const PAL32 = new Uint32Array(256);
  (function buildPal32() {
    for (let i = 0; i < 256; i++) {
      PAL32[i] = (255 << 24) | (PAL[i * 3 + 2] << 16) | (PAL[i * 3 + 1] << 8) | PAL[i * 3];
    }
  })();

  // Apply a light level to a palette index. THE central operation of the renderer.
  // Ramp 0 clamps to shade 1 because shade 0 of ramp 0 is the transparent slot.
  function shade(pi, s) {
    const ramp = pi & 0xf0;
    const lo = ramp === 0 ? 1 : 0;
    return ramp | (s < lo ? lo : s > 15 ? 15 : s);
  }

  // Darken/brighten by a delta, preserving ramp.
  function shadeBy(pi, d) { return shade(pi, (pi & 0x0f) + d); }

  const rampOf = (pi) => (pi >> 4) & 0x0f;
  const shadeOf = (pi) => pi & 0x0f;
  const idx = (ramp, s) => shade(ramp << 4, s);

  // Nearest palette index for an RGB triple. Weighted for perceived luminance, which matters
  // because an unweighted match sends skin tones into the steel ramp.
  function palIdx(r, g, b) {
    let best = 1, bestD = Infinity;
    for (let i = 1; i < 256; i++) {
      const dr = r - PAL[i * 3], dg = g - PAL[i * 3 + 1], db = b - PAL[i * 3 + 2];
      const d = dr * dr * 0.30 + dg * dg * 0.59 + db * db * 0.11;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  // 4x4 ordered dither matrix (Bayer). Values centred on zero.
  const BAYER4 = [
    -0.5000, 0.0000, -0.3750, 0.1250,
    0.2500, -0.2500, 0.3750, -0.1250,
    -0.3125, 0.1875, -0.4375, 0.0625,
    0.4375, -0.0625, 0.3125, -0.1875,
  ];

  // Quantise RGBA bytes to palette indices with ordered dithering.
  // NOTHING enters the build as RGB: foundry output, generated art and procedural art all
  // come through here. `alphaCut` below which a pixel becomes index 0 (transparent).
  function palDither(rgba, w, h, alphaCut) {
    const cut = alphaCut === undefined ? 128 : alphaCut;
    const out = new Uint8Array(w * h);
    const cache = new Map();
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const p = (y * w + x) * 4;
        if (rgba[p + 3] < cut) { out[y * w + x] = TRANSPARENT; continue; }
        const d = BAYER4[(y & 3) * 4 + (x & 3)] * 18;
        const r = clamp(rgba[p] + d, 0, 255) | 0;
        const g = clamp(rgba[p + 1] + d, 0, 255) | 0;
        const b = clamp(rgba[p + 2] + d, 0, 255) | 0;
        // Cache on a coarse key: exact lookup is 255 comparisons per pixel otherwise.
        const key = ((r >> 2) << 12) | ((g >> 2) << 6) | (b >> 2);
        let pi = cache.get(key);
        if (pi === undefined) { pi = palIdx(r, g, b); cache.set(key, pi); }
        out[y * w + x] = pi;
      }
    }
    return out;
  }

  // ---------------------------------------------------------------- clock
  // ONE time representation: integer game minutes since the world epoch. Hour, day and phase
  // are derived by function and are never stored as fields.
  //
  // Advanced by integer milliseconds through an accumulator kept in integer "micro-minutes",
  // so a scripted session at a fixed timestep is exact rather than nearly-exact.
  const MIN_PER_DAY = 1440;
  const GAME_MIN_PER_REAL_SEC = 6;   // a full day is 4 real minutes

  const Clock = {
    t: 9 * 60,        // world starts at 09:00 on day 0
    micro: 0,
    paused: false,

    advance(dtMs) {
      if (this.paused) return 0;
      this.micro += (dtMs | 0) * GAME_MIN_PER_REAL_SEC;
      const add = (this.micro / 1000) | 0;
      if (add > 0) { this.micro -= add * 1000; this.t += add; }
      return add;
    },

    // Jump forward by whole game minutes (resting, travel).
    skip(minutes) { this.t += minutes | 0; return this.t; },

    get day() { return (this.t / MIN_PER_DAY) | 0; },
    get tod() { return this.t % MIN_PER_DAY; },          // minutes since midnight
    get hour() { return (this.tod / 60) | 0; },
    get minute() { return this.tod % 60; },

    // Set time of day, preserving the day number. Used by the shot list so every capture is
    // at exactly the stated hour.
    setTod(minutes) {
      const m = ((minutes | 0) % MIN_PER_DAY + MIN_PER_DAY) % MIN_PER_DAY;
      this.t = this.day * MIN_PER_DAY + m;
      this.micro = 0;
      return this.t;
    },

    // Named phase, used by the sky, the lightmap and the music director.
    phase() {
      const m = this.tod;
      if (m < 270) return 'night';
      if (m < 390) return 'dawn';
      if (m < 660) return 'morning';
      if (m < 900) return 'noon';
      if (m < 1080) return 'afternoon';
      if (m < 1200) return 'dusk';
      return 'night';
    },

    // 0 at midnight, 1 at noon. Drives ambient light and sky blending.
    daylight() {
      const m = this.tod;
      const x = Math.cos(((m - 720) / MIN_PER_DAY) * Math.PI * 2);
      return clamp((x + 0.25) / 1.15, 0, 1);
    },

    hhmm() {
      const h = this.hour, m = this.minute;
      return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    },

    dump() { return { t: this.t, micro: this.micro }; },
    restore(d) { this.t = d.t | 0; this.micro = d.micro | 0; this.paused = false; },
  };

  // ---------------------------------------------------------------- bus
  const Bus = {
    _h: Object.create(null),
    on(ev, fn) { (this._h[ev] || (this._h[ev] = [])).push(fn); return fn; },
    off(ev, fn) {
      const a = this._h[ev]; if (!a) return;
      const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1);
    },
    emit(ev, arg) {
      const a = this._h[ev]; if (!a) return;
      for (let i = 0; i < a.length; i++) a[i](arg);
    },
    clear() { this._h = Object.create(null); },
  };

  // ---------------------------------------------------------------- log
  // Ring buffer of player-facing messages. `kind` drives colour in the HUD strip.
  const Log = {
    lines: [],
    max: 200,
    push(text, kind) {
      this.lines.push({ text: String(text), kind: kind || 'info', t: Clock.t });
      if (this.lines.length > this.max) this.lines.splice(0, this.lines.length - this.max);
      Bus.emit('log', text);
    },
    tail(n) { return this.lines.slice(-n); },
    clear() { this.lines.length = 0; },
  };

  return {
    clamp, lerp, smooth, hashStr,
    Stream, RNG,
    PAL, PAL32, RAMPS, TRANSPARENT,
    shade, shadeBy, rampOf, shadeOf, idx, palIdx, palDither,
    Clock, MIN_PER_DAY, Bus, Log,
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Core;


/* ==================== 01_rules.js ==================== */
// 01_rules.js — the pure rules layer.
// Owner: rules. Calls Core only.
//
// Every function here is a pure function over plain data: no rendering, no DOM, no globals, no
// hidden state. Randomness is passed IN as a stream, never reached for, so a test can hand it a
// seeded stream and get an exact answer.
//
// GLUE CALLS RULES. If a damage or price calculation appears anywhere in 08_ui.js or 09_game.js,
// that is the mistake this layer exists to prevent.

const Rules = (() => {
  'use strict';

  const { clamp } = Core;

  // ---------------------------------------------------------------- stats
  const STATS = ['mig', 'int', 'per', 'end', 'acc', 'spd', 'lck'];
  const STAT_NAME = {
    mig: 'Might', int: 'Intellect', per: 'Personality', end: 'Endurance',
    acc: 'Accuracy', spd: 'Speed', lck: 'Luck',
  };

  // The stat -> bonus curve. Deliberately flat in the middle and steep at the top: it is what
  // makes a 19 feel like an achievement at creation and a 40 feel like a build at level 30.
  const STAT_BREAKS = [
    [1, -6], [2, -5], [4, -4], [6, -3], [7, -2], [8, -1], [10, 0], [12, 1], [14, 2], [16, 3],
    [17, 4], [19, 5], [21, 6], [25, 7], [30, 8], [35, 9], [40, 10], [50, 11], [60, 12],
    [75, 13], [100, 14], [125, 15], [175, 16], [200, 17],
  ];

  function statBonus(v) {
    if (v <= 0) return -6;
    let b = -6;
    for (let i = 0; i < STAT_BREAKS.length; i++) {
      if (v >= STAT_BREAKS[i][0]) b = STAT_BREAKS[i][1]; else break;
    }
    return b;
  }

  // ---------------------------------------------------------------- skills
  const SKILL_KINDS = { WEAPON: 'weapon', ARMOUR: 'armour', MAGIC: 'magic', MISC: 'misc' };

  const SKILLS = {
    sword:  { name: 'Sword',  kind: 'weapon' },
    axe:    { name: 'Axe',    kind: 'weapon' },
    spear:  { name: 'Spear',  kind: 'weapon' },
    mace:   { name: 'Mace',   kind: 'weapon' },
    dagger: { name: 'Dagger', kind: 'weapon' },
    staff:  { name: 'Staff',  kind: 'weapon' },
    bow:    { name: 'Bow',    kind: 'weapon' },
    unarmed:{ name: 'Unarmed',kind: 'weapon' },

    leather:{ name: 'Leather', kind: 'armour' },
    chain:  { name: 'Chain',   kind: 'armour' },
    plate:  { name: 'Plate',   kind: 'armour' },
    shield: { name: 'Shield',  kind: 'armour' },
    dodge:  { name: 'Dodging', kind: 'armour' },

    fire:   { name: 'Fire',   kind: 'magic' },
    water:  { name: 'Water',  kind: 'magic' },
    air:    { name: 'Air',    kind: 'magic' },
    earth:  { name: 'Earth',  kind: 'magic' },
    spirit: { name: 'Spirit', kind: 'magic' },
    mind:   { name: 'Mind',   kind: 'magic' },
    body:   { name: 'Body',   kind: 'magic' },
    light:  { name: 'Light',  kind: 'magic' },
    dark:   { name: 'Dark',   kind: 'magic' },

    bodybuilding: { name: 'Bodybuilding', kind: 'misc' },
    meditation:   { name: 'Meditation',   kind: 'misc' },
    merchant:     { name: 'Merchant',     kind: 'misc' },
    repair:       { name: 'Repair',       kind: 'misc' },
    identify:     { name: 'Identify',     kind: 'misc' },
    disarm:       { name: 'Disarm Trap',  kind: 'misc' },
    perception:   { name: 'Perception',   kind: 'misc' },
    learning:     { name: 'Learning',     kind: 'misc' },
    alchemy:      { name: 'Alchemy',      kind: 'misc' },
  };

  const MASTERY = { NONE: 0, NOVICE: 1, EXPERT: 2, MASTER: 3 };
  const MASTERY_NAME = ['—', 'Novice', 'Expert', 'Master'];

  // What a mastery tier multiplies the raw skill level by when it feeds a formula. Expert and
  // Master are worth training for; a master at skill 8 beats a novice at skill 20.
  const MASTERY_MULT = [0, 1.0, 1.6, 2.4];

  // Effective skill: the single number every formula consumes.
  function skillPower(ch, key) {
    const s = ch.skills && ch.skills[key];
    if (!s || s.mastery === 0) return 0;
    return s.lvl * MASTERY_MULT[s.mastery];
  }

  function skillLevel(ch, key) {
    const s = ch.skills && ch.skills[key];
    return s ? s.lvl : 0;
  }
  function mastery(ch, key) {
    const s = ch.skills && ch.skills[key];
    return s ? s.mastery : 0;
  }
  function hasSkill(ch, key) { return mastery(ch, key) > 0; }

  // ---------------------------------------------------------------- classes
  // `caps` is the highest mastery this class may ever reach in a skill. A class that cannot reach
  // Master in its own weapon is not a class, it is a handicap — so each has a clear identity.
  const CLASSES = {
    knight: {
      name: 'Knight', hpDie: 9, spDie: 0, hpBase: 20, spBase: 0,
      prime: 'mig',
      caps: {
        sword: 3, axe: 3, spear: 3, mace: 3, dagger: 2, staff: 2, bow: 2, unarmed: 2,
        leather: 3, chain: 3, plate: 3, shield: 3, dodge: 2,
        bodybuilding: 3, merchant: 2, repair: 3, identify: 2, disarm: 2, perception: 2, learning: 2,
      },
      start: ['sword', 'leather'],
      blurb: 'No magic at all, and the best armour and weapon skills in the party. The wall the rest of the party stands behind.',
    },
    templar: {
      name: 'Templar', hpDie: 8, spDie: 2, hpBase: 16, spBase: 6,
      prime: 'per',
      caps: {
        sword: 3, axe: 2, spear: 2, mace: 3, dagger: 2, staff: 2, bow: 2, unarmed: 2,
        leather: 3, chain: 3, plate: 3, shield: 3, dodge: 2,
        spirit: 2, mind: 2, body: 2,
        bodybuilding: 3, meditation: 2, merchant: 2, repair: 2, identify: 2, disarm: 2, perception: 2, learning: 2,
      },
      start: ['sword', 'chain', 'spirit'],
      blurb: 'Plate armour and the self schools. Slower to come online than a Knight and still standing when the Knight is not.',
    },
    ranger: {
      name: 'Ranger', hpDie: 7, spDie: 2, hpBase: 14, spBase: 6,
      prime: 'acc',
      caps: {
        sword: 2, axe: 2, spear: 3, mace: 2, dagger: 3, staff: 2, bow: 3, unarmed: 2,
        leather: 3, chain: 3, plate: 1, shield: 2, dodge: 3,
        fire: 2, water: 2, air: 2, earth: 2,
        bodybuilding: 2, meditation: 2, merchant: 2, repair: 2, identify: 3, disarm: 3, perception: 3, learning: 3, alchemy: 2,
      },
      start: ['bow', 'leather', 'perception'],
      blurb: 'The only Master of the bow, and the party eyes: Perception and Disarm Trap at Master.',
    },
    priest: {
      name: 'Priest', hpDie: 6, spDie: 4, hpBase: 12, spBase: 12,
      prime: 'per',
      caps: {
        sword: 1, axe: 1, spear: 2, mace: 3, dagger: 2, staff: 3, bow: 1, unarmed: 2,
        leather: 3, chain: 3, plate: 1, shield: 3, dodge: 2,
        spirit: 3, mind: 3, body: 3, light: 3,
        bodybuilding: 2, meditation: 3, merchant: 2, repair: 1, identify: 2, disarm: 1, perception: 2, learning: 3, alchemy: 3,
      },
      start: ['mace', 'leather', 'body'],
      blurb: 'Master of Spirit, Mind, Body and Light. Nothing else in the game brings a dead character back.',
    },
    mage: {
      name: 'Mage', hpDie: 4, spDie: 5, hpBase: 8, spBase: 16,
      prime: 'int',
      caps: {
        sword: 1, axe: 1, spear: 1, mace: 1, dagger: 3, staff: 3, bow: 2, unarmed: 1,
        leather: 3, chain: 1, plate: 1, shield: 1, dodge: 3,
        fire: 3, water: 3, air: 3, earth: 3, dark: 3,
        meditation: 3, merchant: 3, identify: 3, perception: 2, learning: 3, alchemy: 3,
      },
      start: ['dagger', 'leather', 'fire'],
      blurb: 'Master of all four elements and of Dark. Dies to a stiff breeze until roughly level eight.',
    },
    warden: {
      name: 'Warden', hpDie: 5, spDie: 4, hpBase: 10, spBase: 14,
      prime: 'int',
      caps: {
        sword: 1, axe: 2, spear: 2, mace: 3, dagger: 2, staff: 3, bow: 2, unarmed: 2,
        leather: 3, chain: 2, plate: 1, shield: 2, dodge: 2,
        fire: 2, water: 2, air: 2, earth: 2, spirit: 2, mind: 2, body: 2,
        bodybuilding: 2, meditation: 3, merchant: 3, identify: 2, perception: 3, learning: 2, alchemy: 3,
      },
      start: ['staff', 'leather', 'earth'],
      blurb: 'Expert in nearly every school and Master of none. The party that is short one specialist takes a Warden.',
    },
  };

  const CLASS_IDS = Object.keys(CLASSES);

  function classCap(clsId, skill) {
    const c = CLASSES[clsId];
    if (!c) return 0;
    return c.caps[skill] || 0;
  }
  function canLearn(ch, skill) { return classCap(ch.cls, skill) > 0; }

  // ---------------------------------------------------------------- derived
  function maxHP(ch) {
    const c = CLASSES[ch.cls];
    const endB = statBonus(effStat(ch, 'end'));
    const bb = skillPower(ch, 'bodybuilding');
    return Math.max(1, Math.round(c.hpBase + (c.hpDie + endB) * ch.level + bb));
  }

  function maxSP(ch) {
    const c = CLASSES[ch.cls];
    if (c.spDie === 0 && c.spBase === 0) return 0;
    // Casters key SP off their prime stat: Intellect for arcane, Personality for divine.
    const key = (c.prime === 'int' || c.prime === 'per') ? c.prime : 'int';
    const b = statBonus(effStat(ch, key));
    const med = skillPower(ch, 'meditation');
    return Math.max(0, Math.round(c.spBase + (c.spDie + b) * ch.level + med));
  }

  // Effective stat = base + equipment/effect bonus. `bonus` is recomputed, never saved.
  function effStat(ch, k) {
    const base = (ch.base && ch.base[k]) || 0;
    const bon = (ch.bonus && ch.bonus[k]) || 0;
    let v = base + bon;
    if (ch.cond && ch.cond.weak) v = Math.round(v * 0.5);
    return v;
  }

  // Armour class. Armour skill contributes only while the character is trained in what they wear —
  // handled by the caller passing the worn skill key.
  function armourClass(ch, wornSkill, itemAC) {
    const spd = statBonus(effStat(ch, 'spd'));
    const dodge = skillPower(ch, 'dodge');
    const worn = wornSkill ? skillPower(ch, wornSkill) : 0;
    return Math.max(0, Math.round((itemAC || 0) + spd + dodge * 0.5 + worn * 0.5));
  }

  // How long until this character may act again. Lower is better. Speed and weapon skill both cut
  // it, which is why a fast character with a trained weapon acts roughly twice as often.
  function recoveryTime(ch, weaponSpeed, weaponSkill) {
    const spd = statBonus(effStat(ch, 'spd'));
    const sk = weaponSkill ? skillPower(ch, weaponSkill) : 0;
    const base = (weaponSpeed || 100) - spd * 2 - sk * 1.5;
    return Math.max(5, Math.round(base));
  }

  // ---------------------------------------------------------------- combat
  function attackBonus(ch, weaponSkill, itemBonus) {
    const acc = statBonus(effStat(ch, 'acc'));
    const sk = skillPower(ch, weaponSkill);
    return Math.round(ch.level / 2 + acc + sk + (itemBonus || 0));
  }

  // Probability in [0.05, 0.95]. Never certain in either direction: a guaranteed hit removes the
  // reason to improve Accuracy and a guaranteed miss makes a boss unkillable at low level.
  function hitChance(attack, targetAC) {
    const p = (attack + 15) / (attack + targetAC + 30);
    return clamp(p, 0.05, 0.95);
  }

  function rollHit(rng, attack, targetAC) {
    return rng.next() < hitChance(attack, targetAC);
  }

  // Damage before resistance. `dice` is {n, sides, plus}.
  function rollDamage(rng, dice, migBonus, itemBonus) {
    const d = rng.dice(dice.n, dice.sides) + (dice.plus || 0);
    return Math.max(1, d + (migBonus || 0) + (itemBonus || 0));
  }

  // Resistance is a soft curve, never a hard immunity: at resistance 200 roughly 15% still lands.
  // A hard immunity turns a fight into an unwinnable wall with no feedback.
  function resistFactor(resistance) {
    const r = Math.max(0, resistance || 0);
    return clamp(30 / (30 + r), 0.15, 1);
  }

  function applyResist(dmg, resistance) {
    return Math.max(1, Math.round(dmg * resistFactor(resistance)));
  }

  // ---------------------------------------------------------------- XP and levels
  // Total XP required to BE level n. Level 1 is free; level 2 costs 1000; the curve is quadratic
  // so late levels are a real commitment without becoming a wall.
  function xpForLevel(n) {
    if (n <= 1) return 0;
    return 1000 * (n - 1) * n / 2;
  }

  function levelForXP(xp) {
    let n = 1;
    while (xpForLevel(n + 1) <= xp && n < 100) n++;
    return n;
  }

  // Training is a purchase, not an automatic promotion: MM6 made you go back to town, and that
  // round trip is most of what made a level feel earned.
  function trainCost(level) { return level * level * 10; }

  function skillUpCost(currentLevel) { return currentLevel + 1; }

  function masteryReq(tier) {
    // { skill level required, gold }
    if (tier === MASTERY.EXPERT) return { lvl: 4, gold: 2000 };
    if (tier === MASTERY.MASTER) return { lvl: 8, gold: 8000 };
    return { lvl: 0, gold: 0 };
  }

  // ---------------------------------------------------------------- economy
  // Merchant skill moves both directions of the spread. An untrained party pays 1.5x and sells at
  // 0.25x; a Master pays near list and sells near half.
  // The floor is 2, not 1. At a floor of 1 the cheapest item's buy and sell prices both clamp to
  // 1, and buy == sell is a closed loop a player will find and a reviewer will report. Keeping
  // buy strictly above sell at every base value and every Merchant level is the invariant.
  function buyPrice(base, ch) {
    const m = ch ? skillPower(ch, 'merchant') : 0;
    const mult = clamp(1.5 - m * 0.02, 1.0, 1.5);
    return Math.max(2, Math.round(base * mult));
  }

  function sellPrice(base, ch) {
    const m = ch ? skillPower(ch, 'merchant') : 0;
    const mult = clamp(0.25 + m * 0.012, 0.25, 0.55);
    return Math.max(1, Math.floor(base * mult));
  }

  function repairCost(base, condition) {
    return Math.max(1, Math.round(base * 0.35 * (1 - clamp(condition, 0, 1))));
  }

  function identifyCost(base) { return Math.max(5, Math.round(base * 0.08)); }

  function healCost(ch) {
    const missing = Math.max(0, maxHP(ch) - ch.hp);
    let c = missing * 2;
    if (ch.cond) {
      if (ch.cond.poison) c += 60;
      if (ch.cond.disease) c += 120;
      if (ch.cond.curse) c += 200;
      if (ch.cond.dead) c += 600;
      if (ch.cond.unconscious) c += 40;
    }
    return Math.max(0, Math.round(c));
  }

  // ---------------------------------------------------------------- rest
  const REST_MINUTES = 8 * 60;
  const REST_FOOD = 2;

  // Resting is refused, with a REASON, rather than silently failing. A rest button that does
  // nothing and says nothing is the single most common 1998 UI sin.
  function canRest(party, isSafe) {
    if (!isSafe) return { ok: false, why: 'Enemies are too close to make camp.' };
    if (party.food < REST_FOOD) return { ok: false, why: 'Not enough food to camp.' };
    return { ok: true };
  }

  // Returns the DELTA to apply; the caller applies it. Pure function, no mutation.
  function restResult(party) {
    const out = { minutes: REST_MINUTES, food: -REST_FOOD, members: [] };
    for (const ch of party.members) {
      const dead = ch.cond && (ch.cond.dead || ch.cond.unconscious);
      out.members.push({
        id: ch.id,
        hp: dead ? 0 : maxHP(ch) - ch.hp,
        sp: dead ? 0 : maxSP(ch) - ch.sp,
        // Rest clears fatigue-shaped conditions only. Poison, disease, curse and death need a
        // temple or a spell — otherwise the temple has no reason to exist.
        clears: dead ? [] : ['asleep', 'afraid', 'weak'],
      });
    }
    return out;
  }

  // ---------------------------------------------------------------- traps
  function disarmChance(ch, trapLevel) {
    const sk = skillPower(ch, 'disarm');
    const lck = statBonus(effStat(ch, 'lck'));
    const p = (sk + lck + 10) / (sk + lck + 10 + trapLevel * 6);
    return clamp(p, 0.05, 0.95);
  }

  function trapDamage(rng, trapLevel) {
    return rng.dice(trapLevel, 6) + trapLevel * 2;
  }

  function perceptionChance(ch, hideLevel) {
    const sk = skillPower(ch, 'perception');
    const p = (sk + 6) / (sk + 6 + hideLevel * 5);
    return clamp(p, 0.02, 0.95);
  }

  // ---------------------------------------------------------------- conditions
  // Ordered worst-first. `worstCondition` drives the portrait and who may act.
  const CONDITIONS = ['dead', 'unconscious', 'asleep', 'curse', 'disease', 'poison', 'afraid', 'weak'];

  function worstCondition(ch) {
    if (!ch.cond) return null;
    for (const c of CONDITIONS) if (ch.cond[c]) return c;
    return null;
  }

  function canAct(ch) {
    if (!ch.cond) return true;
    return !(ch.cond.dead || ch.cond.unconscious || ch.cond.asleep);
  }

  function isDead(ch) { return !!(ch.cond && ch.cond.dead); }

  // Applying damage is a rule, not glue: dropping to 0 must always produce a consistent state, or
  // a character ends up at negative HP and "alive" in one code path and dead in another.
  function applyDamage(ch, dmg) {
    const out = { dmg: Math.max(0, Math.round(dmg)), died: false, knocked: false };
    ch.hp -= out.dmg;
    if (ch.hp <= -10) {
      ch.hp = -10;
      if (!ch.cond.dead) { ch.cond.dead = true; out.died = true; }
    } else if (ch.hp <= 0) {
      if (!ch.cond.unconscious && !ch.cond.dead) { ch.cond.unconscious = true; out.knocked = true; }
    }
    return out;
  }

  function healTo(ch, amount) {
    if (ch.cond && ch.cond.dead) return 0;
    const before = ch.hp;
    ch.hp = Math.min(maxHP(ch), ch.hp + amount);
    if (ch.hp > 0 && ch.cond) ch.cond.unconscious = false;
    return ch.hp - before;
  }

  // ---------------------------------------------------------------- creation
  // Point-buy at creation. The floor of 7 and ceiling of 19 is what stops a min-maxed 25/3/3/3
  // party, which trivialises the first third of the game and then hits a wall.
  const CREATE_POINTS = 50;
  const STAT_MIN = 7;
  const STAT_MAX = 19;

  // Raising a stat costs more the higher it goes, so spread is cheap and spikes are expensive.
  function statStepCost(v) {
    if (v < 15) return 1;
    if (v < 17) return 2;
    return 3;
  }

  function statBuyCost(from, to) {
    let c = 0;
    for (let v = from; v < to; v++) c += statStepCost(v);
    return c;
  }

  function creationCost(base) {
    let c = 0;
    for (const k of STATS) c += statBuyCost(STAT_MIN, base[k]);
    return c;
  }

  function validateCreation(spec) {
    const errs = [];
    if (!spec || !Array.isArray(spec.members)) return ['no members'];
    if (spec.members.length !== 4) errs.push('party must have exactly 4 members');
    const names = new Set();
    for (const m of spec.members) {
      if (!m.name || !m.name.trim()) errs.push('a member has no name');
      if (names.has(m.name)) errs.push('duplicate name: ' + m.name);
      names.add(m.name);
      if (!CLASSES[m.cls]) errs.push('unknown class: ' + m.cls);
      for (const k of STATS) {
        const v = m.base[k];
        if (v < STAT_MIN || v > STAT_MAX) errs.push(m.name + ': ' + k + ' out of range (' + v + ')');
      }
      const cost = creationCost(m.base);
      if (cost > CREATE_POINTS) errs.push(m.name + ': spent ' + cost + ' of ' + CREATE_POINTS + ' points');
    }
    return errs;
  }

  // Build a full character from a creation spec. Pure: returns a new object.
  function makeCharacter(spec, id) {
    const cls = CLASSES[spec.cls];
    const skills = {};
    for (const s of cls.start) skills[s] = { lvl: 1, mastery: MASTERY.NOVICE };
    const ch = {
      id,
      name: spec.name,
      cls: spec.cls,
      sex: spec.sex || 'f',
      portrait: spec.portrait === undefined ? id : spec.portrait,
      base: Object.assign({}, spec.base),
      bonus: { mig: 0, int: 0, per: 0, end: 0, acc: 0, spd: 0, lck: 0 },
      hp: 1, sp: 0, ac: 0, xp: 0, level: 1, skillPts: 0,
      skills,
      cond: { poison: false, disease: false, curse: false, asleep: false, afraid: false, weak: false, unconscious: false, dead: false },
      equip: { weapon: null, offhand: null, bow: null, armour: null, helm: null, boots: null, cloak: null, gaunt: null, belt: null, amulet: null, ring1: null, ring2: null },
      pack: [],
      recovery: 0,
      quickSpell: null,
    };
    ch.hp = maxHP(ch);
    ch.sp = maxSP(ch);
    return ch;
  }

  // Awarding XP is a rule because level-up has to be consistent everywhere it can happen: combat,
  // quest turn-in and the debug harness must all produce the same character.
  function awardXP(ch, amount) {
    if (isDead(ch)) return { gained: 0, levels: 0 };
    const before = ch.level;
    ch.xp += Math.max(0, Math.round(amount));
    const now = levelForXP(ch.xp);
    // The level is EARNED here but the character is not promoted until trained in town. `pending`
    // is what the trainer charges for.
    return { gained: amount, levels: Math.max(0, now - before), pending: now - ch.level };
  }

  function promote(ch) {
    const target = levelForXP(ch.xp);
    if (target <= ch.level) return 0;
    const gained = target - ch.level;
    ch.level = target;
    ch.skillPts += gained * 2;
    ch.hp = maxHP(ch);
    ch.sp = maxSP(ch);
    return gained;
  }

  return {
    STATS, STAT_NAME, statBonus, STAT_BREAKS,
    SKILLS, SKILL_KINDS, MASTERY, MASTERY_NAME, MASTERY_MULT,
    skillPower, skillLevel, mastery, hasSkill,
    CLASSES, CLASS_IDS, classCap, canLearn,
    effStat, maxHP, maxSP, armourClass, recoveryTime,
    attackBonus, hitChance, rollHit, rollDamage, resistFactor, applyResist,
    xpForLevel, levelForXP, trainCost, skillUpCost, masteryReq,
    buyPrice, sellPrice, repairCost, identifyCost, healCost,
    REST_MINUTES, REST_FOOD, canRest, restResult,
    disarmChance, trapDamage, perceptionChance,
    CONDITIONS, worstCondition, canAct, isDead, applyDamage, healTo,
    CREATE_POINTS, STAT_MIN, STAT_MAX, statStepCost, statBuyCost, creationCost,
    validateCreation, makeCharacter, awardXP, promote,
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Rules;

// Pure. `resolve` returns a list of EFFECTS to apply; it never mutates a character. The caller
// applies them. That split is what lets the systems suite check a fireball's numbers without a
// world, and what stops combat code from growing its own private damage formula.

const Spellcraft = (() => {

  const { MASTERY, skillPower, statBonus, effStat } = Rules;

  const TIER_MASTERY = [0, MASTERY.NOVICE, MASTERY.NOVICE, MASTERY.EXPERT, MASTERY.MASTER];

    divine_heal:  { school: 'light', tier: 4, sp: 22, name: 'Divine Heal', target: 'party', heal: { n: 4, sides: 10 }, scale: 3.0 },

    darkness:     { school: 'dark', tier: 1, sp: 3, name: 'Darkness',      target: 'enemies', status: 'blind', dur: 20, radius: 2.5 },
    drain_life:   { school: 'dark', tier: 2, sp: 7, name: 'Drain Life',    target: 'enemy', dmg: { n: 2, sides: 6 }, scale: 1.4, elem: 'dark', drain: true },
    toxic_cloud:  { school: 'dark', tier: 3, sp: 12, name: 'Toxic Cloud',  target: 'enemies', dmg: { n: 3, sides: 7 }, scale: 1.9, elem: 'poison', radius: 3.0, status: 'poison' },
    shrapmetal:   { school: 'dark', tier: 4, sp: 20, name: 'Shrapmetal',   target: 'enemies', dmg: { n: 5, sides: 6 }, scale: 2.8, elem: 'phys', radius: 2.0 },

  const SPELL_IDS = Object.keys(SPELLS);

  function bySchool(school) {

  function power(ch, school) {

    if (!sp) return { ok: false, why: 'No such spell.' };
    if (!Rules.canAct(ch)) return { ok: false, why: ch.name + ' cannot act.' };
    if (Rules.classCap(ch.cls, sp.school) === 0) {
      return { ok: false, why: Rules.CLASSES[ch.cls].name + 's cannot learn ' + SCHOOLS[sp.school].name + '.' };
    }
    const m = Rules.mastery(ch, sp.school);
    if (m === 0) return { ok: false, why: 'Not trained in ' + SCHOOLS[sp.school].name + '.' };
    if (m < TIER_MASTERY[sp.tier]) {
      return { ok: false, why: 'Requires ' + Rules.MASTERY_NAME[TIER_MASTERY[sp.tier]] + ' ' + SCHOOLS[sp.school].name + '.' };
    }
    if (!ch.spells || !ch.spells[id]) return { ok: false, why: ch.name + ' has not learned ' + sp.name + '.' };
    const cost = spCost(ch, id);
    if (ch.sp < cost) return { ok: false, why: 'Not enough spell points (' + cost + ' needed).' };
    if (ch.recovery > 0) return { ok: false, why: ch.name + ' is still recovering.' };
    if (sp.school === 'light' && ctx && ctx.underground && sp.tier >= 3) {
      return { ok: false, why: 'Light magic of this power will not answer underground.' };
    }
    return { ok: true, cost };
  }

  function learnable(ch, id) {
    const sp = SPELLS[id];
    if (!sp) return false;
    return Rules.classCap(ch.cls, sp.school) >= TIER_MASTERY[sp.tier];
  }

  // ---------------------------------------------------------------- resolve
  // PURE. Returns { cost, effects: [...] }. The caller applies every effect.
  //
  // Effect shapes:
  //   { kind:'damage', target, amount, elem }
  //   { kind:'heal',   target, amount }
  //   { kind:'cure',   target, conds:[] }
  //   { kind:'buff',   target, buff, amount, dur }
  //   { kind:'status', target, status, dur }
  function resolve(ch, id, targets, rng, ctx) {
    const sp = SPELLS[id];
    const out = { spell: id, cost: spCost(ch, id), effects: [] };
    if (!sp) return out;

    const pw = power(ch, sp.school);
    const tlist = Array.isArray(targets) ? targets : (targets ? [targets] : []);

    for (const t of tlist) {
      if (sp.dmg) {
        // Base dice plus power scaling. The scale factor is what separates a tier-1 dart from a
        // tier-4 nuke far more than the dice do.
        const base = rng.dice(sp.dmg.n, sp.dmg.sides);
        const raw = Math.round(base + pw * sp.scale);
        const res = (t.resist && t.resist[sp.elem]) || 0;
        const amount = Rules.applyResist(raw, res);
        out.effects.push({ kind: 'damage', target: t, amount, elem: sp.elem });
        if (sp.drain) out.effects.push({ kind: 'heal', target: ch, amount: Math.round(amount * 0.5) });
        if (sp.status) out.effects.push({ kind: 'status', target: t, status: sp.status, dur: sp.dur || 20 });
      } else if (sp.heal) {
        const amount = Math.round(rng.dice(sp.heal.n, sp.heal.sides) + pw * sp.scale);
        out.effects.push({ kind: 'heal', target: t, amount });
      } else if (sp.cure) {
        out.effects.push({ kind: 'cure', target: t, conds: sp.cure.slice() });
        if (sp.healFrac) {
          out.effects.push({ kind: 'heal', target: t, amount: Math.round(Rules.maxHP(t) * sp.healFrac) });
        }
      } else if (sp.buff) {
        // Duration scales with power: the same spell lasts a dungeon at Master and a fight at Novice.
        const dur = Math.round(sp.dur * (1 + pw / 30));
        out.effects.push({ kind: 'buff', target: t, buff: sp.buff, amount: sp.amount || 1, dur });
      } else if (sp.status) {
        out.effects.push({ kind: 'status', target: t, status: sp.status, dur: sp.dur || 20 });
      }
    }
    return out;
  }

  // What the shop charges to teach it, and what the guild requires.
  function scrollPrice(id) {
    const sp = SPELLS[id];
    return sp ? sp.tier * sp.tier * 120 + 60 : 0;
  }

  return {
    SCHOOLS, SCHOOL_IDS, SPELLS, SPELL_IDS, TIER_MASTERY,
    bySchool, power, spCost, canCast, learnable, resolve, scrollPrice,
  };
})();

    const out = { gold: 0, items: [] };
    out.gold = rng.range(t.gold[0], t.gold[1]);

    const lb = (luckBonus || 0) * 0.01;
    if (rng.chance(clamp(0.35 + lb, 0.05, 0.85))) {
      const id = rng.pick(t.items);
      const stack = { id, qty: 1, ident: false, bonus: 0, charges: 0 };
      if (rng.chance(clamp(0.12 + lb, 0.02, 0.4))) {
        const e = rng.pick(ENCHANTS.slice(0, Math.min(ENCHANTS.length, 2 + tier)));
        stack.ench = ENCHANTS.indexOf(e);
        stack.bonus = e.bonus;
      }
      out.items.push(stack);
    }
    return out;
  }

  // THE LOOT LAW. Quest items sort first, always. Everything else follows by value descending so
  // that if a pack does overflow, what is lost is the cheapest mundane item, not the run.
  function sortForPickup(stacks) {
    return stacks.slice().sort((a, b) => {
      const qa = isQuest(a) ? 0 : 1, qb = isQuest(b) ? 0 : 1;
      if (qa !== qb) return qa - qb;
      return value(b) - value(a);
    });
  }

  function isQuest(stack) {
    const it = ITEMS[stack.id];
    return !!(it && it.quest);
  }

  function def(stack) { return ITEMS[stack.id] || null; }

  function value(stack) {
    const it = ITEMS[stack.id];
    if (!it) return 0;
    let v = it.value || 0;
    if (stack.ench !== undefined && ENCHANTS[stack.ench]) v += ENCHANTS[stack.ench].value;
    return v * (stack.qty || 1);
  }

  function displayName(stack) {
    const it = ITEMS[stack.id];
    if (!it) return '???';
    let n = it.name;
    if (stack.ench !== undefined && ENCHANTS[stack.ench]) {
      n = stack.ident ? n + ' ' + ENCHANTS[stack.ench].name : n;
    }
    if (!stack.ident && stack.ench !== undefined) n = n + ' ?';
    if ((stack.qty || 1) > 1) n += ' (' + stack.qty + ')';
    return n;
  }

  function maxStack(id) {
    const it = ITEMS[id];
    return (it && it.stack) || 1;
  }

  // Shop stock. Deterministic per shop per day from a LAYOUT stream, so a player who reloads
  // does not reroll the shop — which is the exploit every 1998 RPG shipped with.
  function shopStock(rng, kind, tier) {
    const pool = [];
    for (const id of ITEM_IDS) {
      const it = ITEMS[id];
      if (it.quest) continue;
      if ((it.tier || 1) > tier) continue;
      if (kind === 'weapon' && it.kind !== 'weapon') continue;
      if (kind === 'armour' && it.kind !== 'armour') continue;
      if (kind === 'general' && !(it.kind === 'potion' || it.kind === 'food' || it.kind === 'tool')) continue;
      if (kind === 'magic' && !(it.kind === 'ring' || it.kind === 'amulet' || it.kind === 'potion')) continue;
      pool.push(id);
    }
    rng.shuffle(pool);
    const n = Math.min(pool.length, 6 + rng.int(5));
    return pool.slice(0, n).map((id) => ({
      id, qty: maxStack(id) > 1 ? 5 + rng.int(10) : 1, ident: true, bonus: 0, charges: 0,
    }));
  }

  return {
    ITEMS, ITEM_IDS, MONSTERS, MONSTER_IDS, LOOT_TIERS, ENCHANTS,
    rollLoot, sortForPickup, isQuest, def, value, displayName, maxStack, shopStock,
  };
})();

// Owner: engine. Calls Core and World.
//
// This round implements the framebuffer/raster/present layer, which is stable and will not change,
// plus a test card. The heightfield march (per-column terrain stepping with overhead spans) lands
// in R2 and replaces `render3D`'s placeholder body. See ARCHITECTURE.md §7 for its contract.

const Engine = (() => {
  'use strict';

  const { PAL32, shade, clamp } = Core;

  // ---------------------------------------------------------------- framebuffer
  const W = 640, H = 480;

  // One byte per pixel: a PALETTE INDEX, not a colour. Nothing in this engine ever holds RGB.
  const buf = new Uint8Array(W * H);

  // Depth per column, written by the wall/terrain pass and read by the sprite pass so billboards
  // composite correctly against geometry.
  const zb = new Float32Array(W);

  // Clip rectangle. The 3D pass clips to the viewport hole; UI clips to whatever it is drawing.
  let cx0 = 0, cy0 = 0, cx1 = W, cy1 = H;

  function clip(x, y, w, h) {
    cx0 = clamp(x, 0, W); cy0 = clamp(y, 0, H);
    cx1 = clamp(x + w, 0, W); cy1 = clamp(y + h, 0, H);
  }
  function clipReset() { cx0 = 0; cy0 = 0; cx1 = W; cy1 = H; }

  function clear(pi) { buf.fill(pi | 0); }

  function px(x, y, pi) {
    if (x < cx0 || x >= cx1 || y < cy0 || y >= cy1) return;
    buf[y * W + x] = pi;
  }

  // Unclipped, uncheked write. Only for inner loops that have already bounds-checked.
  function pxFast(x, y, pi) { buf[y * W + x] = pi; }

  function hline(x, y, len, pi) {
    if (y < cy0 || y >= cy1) return;
    let a = x < cx0 ? cx0 : x;
    let b = x + len > cx1 ? cx1 : x + len;
    if (b <= a) return;
    buf.fill(pi, y * W + a, y * W + b);
  }

  function vline(x, y, len, pi) {
    if (x < cx0 || x >= cx1) return;
    let a = y < cy0 ? cy0 : y;
    let b = y + len > cy1 ? cy1 : y + len;
    for (let yy = a; yy < b; yy++) buf[yy * W + x] = pi;
  }

  function rect(x, y, w, h, pi) {
    for (let yy = y; yy < y + h; yy++) hline(x, yy, w, pi);
  }

  function frameRect(x, y, w, h, pi) {
    hline(x, y, w, pi); hline(x, y + h - 1, w, pi);
    vline(x, y, h, pi); vline(x + w - 1, y, h, pi);
  }

  // Blit an indexed sprite. Index 0 is transparent and is the ONLY transparent index.
  // `lit` is the shade level applied through the ramp: the same arithmetic every surface uses.
  function blit(spr, dx, dy, lit) {
    const sw = spr.w, sh = spr.h, d = spr.data;
    for (let y = 0; y < sh; y++) {
      const ty = dy + y;
      if (ty < cy0 || ty >= cy1) continue;
      const row = y * sw, trow = ty * W;
      for (let x = 0; x < sw; x++) {
        const pi = d[row + x];
        if (pi === 0) continue;                       // transparent
        const tx = dx + x;
        if (tx < cx0 || tx >= cx1) continue;
        buf[trow + tx] = lit === undefined ? pi : shade(pi, (pi & 0x0f) + lit);
      }
    }
  }

  // Scaled blit with nearest sampling — how a billboard sprite reaches the screen at distance.
  function blitScaled(spr, dx, dy, dw, dh, lit, mirror) {
    if (dw <= 0 || dh <= 0) return;
    const sw = spr.w, sh = spr.h, d = spr.data;
    const xs = sw / dw, ys = sh / dh;
    const x0 = dx < cx0 ? cx0 : dx, x1 = dx + dw > cx1 ? cx1 : dx + dw;
    const y0 = dy < cy0 ? cy0 : dy, y1 = dy + dh > cy1 ? cy1 : dy + dh;
    for (let ty = y0; ty < y1; ty++) {
      const sy = ((ty - dy) * ys) | 0;
      const srow = sy * sw, trow = ty * W;
      for (let tx = x0; tx < x1; tx++) {
        let sx = ((tx - dx) * xs) | 0;
        if (mirror) sx = sw - 1 - sx;
        const pi = d[srow + sx];
        if (pi === 0) continue;
        buf[trow + tx] = lit === undefined ? pi : shade(pi, (pi & 0x0f) + lit);
      }
    }
  }

  // ---------------------------------------------------------------- presentation
  let img = null, img32 = null;

  function present(ctx) {
    if (!img) {
      img = ctx.createImageData(W, H);
      img32 = new Uint32Array(img.data.buffer);
    }
    for (let i = 0, n = W * H; i < n; i++) img32[i] = PAL32[buf[i]];
    ctx.putImageData(img, 0, 0);
  }

  // ---------------------------------------------------------------- test card
  // Renders before any world exists. Its real job is to prove three things early: the palette ramps
  // are monotonic, index 0 survives the pipeline, and the letterbox scaling is integer/nearest.
  function testCard() {
    clipReset();
    clear(Core.idx(0, 1));

    // 16 ramps x 16 shades, as a grid. Any non-monotonic ramp is visible instantly here.
    const cw = 34, ch = 18, ox = 32, oy = 46;
    for (let r = 0; r < 16; r++) {
      for (let s = 0; s < 16; s++) {
        rect(ox + s * cw, oy + r * ch, cw - 1, ch - 1, (r << 4) | s);
      }
    }

    // Frame around the grid, and a marker column showing shade() clamping on ramp 0.
    frameRect(ox - 2, oy - 2, 16 * cw + 3, 16 * ch + 3, Core.idx(13, 11));

    // Alignment marks at the exact corners of the 3D viewport, so a capture can be checked for
    // off-by-one scaling without measuring pixels by eye.
    const V = VIEW;
    frameRect(V.x, V.y, V.w, V.h, Core.idx(15, 12));
    rect(V.x, V.y, 3, 3, Core.idx(0, 15));
    rect(V.x + V.w - 3, V.y + V.h - 3, 3, 3, Core.idx(0, 15));

    // HUD band boundary.
    hline(0, HUD.y, W, Core.idx(13, 8));
  }

  // ---------------------------------------------------------------- layout
  // Design decisions calibrated to the 640x480 frame. NOT measurements of MM6 — real measured
  // numbers belong in critique/MM6_REFERENCE.md, which needs reference material this build does
  // not have. See ARCHITECTURE.md §11.
  const VIEW = { x: 8, y: 8, w: 624, h: 344 };
  const HUD = { x: 0, y: 352, w: 640, h: 128 };

  // Projection scale, from the vertical FOV implied by a 70 degree horizontal FOV at VIEW's
  // aspect. Computed once; the march and the sprite pass both read it.
  const FOV_H = 70 * Math.PI / 180;
  const FOV_V = 2 * Math.atan(Math.tan(FOV_H / 2) * (VIEW.h / VIEW.w));
  const PROJ = VIEW.h / (2 * Math.tan(FOV_V / 2));

  // ---------------------------------------------------------------- 3D
  // R2 replaces this body with the per-column heightfield march described in ARCHITECTURE.md §7.
  // It is deliberately a visible placeholder rather than a silent no-op: a blank viewport in a
  // capture must be unmistakably "not implemented", not "maybe the world failed to load".
  function render3D(cam) {
    clip(VIEW.x, VIEW.y, VIEW.w, VIEW.h);
    for (let y = 0; y < VIEW.h; y++) {
      const t = y / VIEW.h;
      hline(VIEW.x, VIEW.y + y, VIEW.w, Core.idx(9, 3 + ((t * 9) | 0)));
    }
    clipReset();
  }

  return {
    W, H, buf, zb,
    clip, clipReset, clear, px, pxFast, hline, vline, rect, frameRect, blit, blitScaled,
    present, testCard, render3D,
    VIEW, HUD, FOV_H, FOV_V, PROJ,
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Engine;


/* ==================== 10_debug.js ==================== */
// 10_debug.js — boot, main loop, input, the ?debug overlay, and the test harness.
// Owner: debug. Loads last, so it may reference everything.
//
// The harness is built FIRST, before there is anything to drive, because every later stage is
// driven through it: the shot list, the E2E suite, the campaign test and the determinism diff all
// speak to __game / __session and nothing else. See ARCHITECTURE.md §10 for the contract.

const Debug = (() => {
  'use strict';

  const { Clock, RNG, Bus, Log } = Core;

  const STEP_MS = 16;          // fixed simulation timestep; the harness never uses wall-clock time
  const MAX_CATCHUP = 5;       // frames of catch-up per rAF, so a stall cannot spiral

  const state = {
    booted: false,
    ctx: null,
    canvas: null,
    acc: 0,
    last: 0,
    frames: 0,
    fps: 0,
    fpsAcc: 0,
    fpsN: 0,
    overlay: false,
    keys: Object.create(null),
    pointer: { x: 0, y: 0, down: false },
    lastError: null,
  };

  // Is the game layer present yet? Modules land across rounds; the harness must be honest about
  // what it can and cannot drive rather than failing obscurely.
  const hasGame = () => typeof Game !== 'undefined' && Game && typeof Game.update === 'function';

  function need(what) {
    throw new Error('harness: ' + what + ' requires the game layer, which is not built yet ' +
      '(src/09_game.js). This is a real gap, not a transient failure.');
  }

  // ---------------------------------------------------------------- loop
  function simulate(dtMs) {
    if (hasGame()) Game.update(dtMs);
    else Clock.advance(dtMs);
    state.frames++;
  }

  function draw() {
    if (hasGame()) Game.render();
    else Engine.testCard();
    if (state.overlay) drawOverlay();
    if (state.ctx) Engine.present(state.ctx);
  }

  function frame(now) {
    if (!state.last) state.last = now;
    let dt = now - state.last;
    state.last = now;
    if (dt > 250) dt = 250;                       // tab was backgrounded; do not fast-forward
    state.acc += dt;

    let n = 0;
    while (state.acc >= STEP_MS && n < MAX_CATCHUP) {
      simulate(STEP_MS);
      state.acc -= STEP_MS;
      n++;
    }
    if (n === MAX_CATCHUP) state.acc = 0;

    state.fpsAcc += dt; state.fpsN++;
    if (state.fpsAcc >= 500) {
      state.fps = Math.round(1000 / (state.fpsAcc / state.fpsN));
      state.fpsAcc = 0; state.fpsN = 0;
    }

    draw();
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- overlay
  function drawOverlay() {
    const lines = [
      'fps ' + state.fps + '  frame ' + state.frames,
      'clock ' + Clock.hhmm() + ' d' + Clock.day + ' ' + Clock.phase(),
      'seed ' + RNG.seed,
    ];
    if (hasGame() && Game.debugLines) lines.push.apply(lines, Game.debugLines());
    if (state.lastError) lines.push('ERR ' + state.lastError);

    // Drawn with raster primitives rather than a font until Art owns one.
    Engine.clipReset();
    Engine.rect(2, 2, 210, 6 + lines.length * 8, Core.idx(0, 1));
    Engine.frameRect(2, 2, 210, 6 + lines.length * 8, Core.idx(13, 9));
    if (typeof Art !== 'undefined' && Art.text) {
      for (let i = 0; i < lines.length; i++) Art.text(Engine, 6, 6 + i * 8, lines[i], Core.idx(0, 14));
    }
  }

  // ---------------------------------------------------------------- input
  const KEYMAP = {
    ArrowUp: 'fwd', ArrowDown: 'back', ArrowLeft: 'turnL', ArrowRight: 'turnR',
    w: 'fwd', s: 'back', a: 'strafeL', d: 'strafeR', q: 'turnL', e: 'turnR',
    Enter: 'act', ' ': 'act', Escape: 'esc', Tab: 'next',
    c: 'sheet', i: 'inv', m: 'map', r: 'rest', b: 'book', x: 'quick',
  };

  function bindInput(canvas) {
    window.addEventListener('keydown', (e) => {
      if (e.key === '`') { state.overlay = !state.overlay; e.preventDefault(); return; }
      const k = KEYMAP[e.key] || e.key;
      state.keys[k] = true;
      if (hasGame() && Game.onKey) Game.onKey(k, true);
      if (KEYMAP[e.key]) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const k = KEYMAP[e.key] || e.key;
      state.keys[k] = false;
      if (hasGame() && Game.onKey) Game.onKey(k, false);
    });

    // Pointer/touch mapped from CSS pixels into framebuffer coordinates.
    const toFb = (clientX, clientY) => {
      const r = canvas.getBoundingClientRect();
      return {
        x: Math.floor((clientX - r.left) / r.width * Engine.W),
        y: Math.floor((clientY - r.top) / r.height * Engine.H),
      };
    };
    const down = (x, y) => {
      const p = toFb(x, y);
      state.pointer.x = p.x; state.pointer.y = p.y; state.pointer.down = true;
      if (hasGame() && Game.onTap) Game.onTap(p.x, p.y, true);
    };
    const up = (x, y) => {
      const p = toFb(x, y);
      state.pointer.down = false;
      if (hasGame() && Game.onTap) Game.onTap(p.x, p.y, false);
    };
    canvas.addEventListener('pointerdown', (e) => { down(e.clientX, e.clientY); e.preventDefault(); });
    canvas.addEventListener('pointerup', (e) => { up(e.clientX, e.clientY); e.preventDefault(); });
    canvas.addEventListener('pointermove', (e) => {
      const p = toFb(e.clientX, e.clientY);
      state.pointer.x = p.x; state.pointer.y = p.y;
      if (hasGame() && Game.onMove) Game.onMove(p.x, p.y);
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // ---------------------------------------------------------------- layout
  function fit(canvas) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / Engine.W, vh / Engine.H);
    canvas.style.width = Math.floor(Engine.W * scale) + 'px';
    canvas.style.height = Math.floor(Engine.H * scale) + 'px';
  }

  // ---------------------------------------------------------------- boot
  function start() {
    if (state.booted) return;
    state.booted = true;

    const canvas = document.getElementById('fb');
    state.canvas = canvas;
    state.ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    state.ctx.imageSmoothingEnabled = false;

    fit(canvas);
    window.addEventListener('resize', () => fit(canvas));
    window.addEventListener('orientationchange', () => setTimeout(() => fit(canvas), 100));
    bindInput(canvas);

    const params = new URLSearchParams(location.search);
    if (params.has('debug')) state.overlay = true;
    if (params.has('seed')) RNG.setSeed(parseInt(params.get('seed'), 10) || 1);

    // Surface errors instead of swallowing them. A silent catch is a lie; this records and shows.
    window.addEventListener('error', (e) => {
      state.lastError = e.message;
      state.overlay = true;
    });

    if (hasGame() && Game.boot) Game.boot();
    Log.push('Thornmarch booted.', 'sys');
    requestAnimationFrame(frame);
  }

  // ================================================================ HARNESS
  // Contract in ARCHITECTURE.md §10. Everything the shot list, E2E suite, campaign test and
  // determinism diff use goes through here.
  //
  // Player-legality matters: walk/press/tap/key are actions a player could take. teleport, gotoMap,
  // give, gold, xp, heal, kill and spawn are NOT, and the campaign test is forbidden from using
  // them — it must win the game the way a person would.
  const harness = {
    // ---- travel (NOT player-legal; for reaching content quickly, never for skipping systems)
    teleport(x, y, ang) {
      if (!hasGame()) need('teleport');
      return Game.teleport(x, y, ang);
    },
    gotoMap(id, x, y, ang) {
      if (!hasGame()) need('gotoMap');
      return Game.gotoMap(id, x, y, ang);
    },
    face(ang) { if (!hasGame()) need('face'); Game.party.ang = ang; return ang; },
    pitch(p) { if (!hasGame()) need('pitch'); Game.party.pitch = p; return p; },

    // ---- player-legal movement and input
    walk(dir, cells) {
      if (!hasGame()) need('walk');
      return Game.walkCells(dir, cells === undefined ? 1 : cells);
    },
    press(key, ms) {
      if (!hasGame()) need('press');
      const steps = Math.max(1, Math.round((ms === undefined ? STEP_MS : ms) / STEP_MS));
      Game.onKey(key, true);
      for (let i = 0; i < steps; i++) simulate(STEP_MS);
      Game.onKey(key, false);
      return steps;
    },
    key(name) { if (!hasGame()) need('key'); Game.onKey(name, true); Game.onKey(name, false); },
    tap(x, y) {
      if (!hasGame()) need('tap');
      Game.onTap(x, y, true); Game.onTap(x, y, false);
    },

    // ---- grants (NOT player-legal)
    give(itemId, n) { if (!hasGame()) need('give'); return Game.grantItem(itemId, n === undefined ? 1 : n); },
    gold(n) { if (!hasGame()) need('gold'); Game.party.gold += n | 0; return Game.party.gold; },
    xp(n) { if (!hasGame()) need('xp'); return Game.grantXP(n | 0); },
    heal() { if (!hasGame()) need('heal'); return Game.healParty(); },
    kill(eid) { if (!hasGame()) need('kill'); return Game.killEntity(eid); },
    spawn(kind, x, y) { if (!hasGame()) need('spawn'); return Game.spawnEntity(kind, x, y); },

    // ---- clock (works without the game layer: Core owns it)
    setTime(minutesSinceMidnight) { return Clock.setTod(minutesSinceMidnight); },
    setDay(n) { Clock.t = (n | 0) * Core.MIN_PER_DAY + Clock.tod; return Clock.t; },

    // ---- persistence
    save(slot) { if (!hasGame()) need('save'); return Game.save(slot === undefined ? 0 : slot); },
    load(slot) { if (!hasGame()) need('load'); return Game.load(slot === undefined ? 0 : slot); },
    newParty(spec) { if (!hasGame()) need('newParty'); return Game.newParty(spec); },

    // ---- screens
    screen(name) { if (!hasGame()) need('screen'); return Game.openScreen(name); },
    closeAll() { if (!hasGame()) need('closeAll'); return Game.closeScreens(); },

    // ---- determinism control
    seed(n) { RNG.setSeed(n); return RNG.seed; },

    // Advance the simulation by exactly `ms` of game time at the fixed timestep. Never touches
    // wall-clock, so a headless run reproduces exactly.
    step(ms) {
      const steps = Math.max(1, Math.round(ms / STEP_MS));
      for (let i = 0; i < steps; i++) simulate(STEP_MS);
      return steps;
    },
    // Render `n` frames without advancing simulation further than one step each — used before a
    // capture so transient state (fades, bobs) has settled.
    settle(n) {
      const k = n === undefined ? 2 : n;
      for (let i = 0; i < k; i++) { simulate(STEP_MS); draw(); }
      return k;
    },
    // Force a redraw only. A capture calls this so the framebuffer matches the asserted state.
    redraw() { draw(); return true; },

    // Introspection for tests that need to know what exists yet.
    ready() { return hasGame(); },
    layers() {
      return {
        core: typeof Core !== 'undefined',
        rules: typeof Rules !== 'undefined',
        spells: typeof Spellcraft !== 'undefined',
        items: typeof Items !== 'undefined',
        world: typeof World !== 'undefined',
        engine: typeof Engine !== 'undefined',
        art: typeof Art !== 'undefined',
        ui: typeof UI !== 'undefined',
        game: hasGame(),
      };
    },
  };

  // ---------------------------------------------------------------- session dump
  // Stable-ordered, side-effect-free JSON. The determinism diff reads this; an unstable dump or
  // one that advances an RNG stream makes the diff meaningless.
  function sortedClone(v) {
    if (v === null || typeof v !== 'object') {
      // Normalise float noise so a dump is byte-comparable across runs.
      return typeof v === 'number' && !Number.isInteger(v) ? Number(v.toFixed(6)) : v;
    }
    if (Array.isArray(v)) return v.map(sortedClone);
    if (ArrayBuffer.isView(v)) return Array.from(v);
    if (v instanceof Map) {
      const o = {};
      for (const k of Array.from(v.keys()).sort()) o[k] = sortedClone(v.get(k));
      return o;
    }
    const out = {};
    for (const k of Object.keys(v).sort()) {
      if (k.startsWith('_')) continue;             // internal caches are not state
      out[k] = sortedClone(v[k]);
    }
    return out;
  }

  const session = {
    dump() {
      const d = {
        clock: Clock.dump(),
        rng: RNG.dump(),
        frames: state.frames,
      };
      if (hasGame() && Game.dumpState) d.game = Game.dumpState();
      return sortedClone(d);
    },

    brief() {
      const d = { t: Clock.t, phase: Clock.phase(), frames: state.frames, ready: hasGame() };
      if (hasGame() && Game.brief) Object.assign(d, Game.brief());
      return d;
    },

    // Things that must ALWAYS hold. Returns [] or a list of violations — never throws, because
    // a test wants the list, not the first failure.
    invariants() {
      const bad = [];
      if (Clock.t < 0) bad.push('clock.t negative');
      if (!Number.isInteger(Clock.t)) bad.push('clock.t not an integer');
      if (hasGame() && Game.invariants) bad.push.apply(bad, Game.invariants());
      return bad;
    },

    // Counts every item everywhere in the world. This is the conservation probe: the way to
    // refuse to chase a reported duplication ghost is to count before and after N operations.
    census() {
      if (hasGame() && Game.census) return Game.census();
      return { total: 0, byId: {}, note: 'game layer not built' };
    },

    log() { return Log.lines.map((l) => l.text); },
  };

  return { state, start, harness, session, STEP_MS, simulate, draw };
})();

// Install the harness on window under the names every test and capture script expects.
if (typeof window !== 'undefined') {
  window.__game = Debug.harness;
  window.__session = Debug.session;
  window.__debug = Debug;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', Debug.start);
  } else {
    Debug.start();
  }
}

if (typeof module !== 'undefined' && module.exports) module.exports = Debug;

</script>
